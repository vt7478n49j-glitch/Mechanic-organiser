<style>
:root{--bg:#0b1020;--card:#141b2d;--card2:#1b2439;--line:#29344d;--text:#f4f7fb;--muted:#9aa6bb;--accent:#ff8a00;--red:#ff5d6c;--green:#27c281}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:calc(16px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));min-height:100vh}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}.brandtext{min-width:0}.app-logo{width:46px;height:46px;object-fit:contain;border-radius:10px;background:#fff0;flex:0 0 auto}.app-logo.hidden{display:none}.logo-preview{width:84px;height:84px;object-fit:contain;border-radius:14px;background:white;padding:4px;border:1px solid var(--line)}h1{margin:0;font-size:26px}.sub{color:var(--muted);font-size:13px}.nav{display:flex;gap:7px;overflow:auto;margin:16px 0;padding-bottom:2px}.nav button,button{border:0;border-radius:12px;padding:11px 13px;background:var(--card2);color:white;font-weight:700}.nav .on,button.primary{background:var(--accent);color:#111}.danger{background:var(--red)}.success{background:var(--green);color:#07170f}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{display:block;font-size:22px;margin-top:4px}.muted{color:var(--muted);font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}input,select,textarea{width:100%;padding:12px;margin:5px 0 12px;border-radius:10px;border:1px solid var(--line);background:#0f1526;color:white;font:inherit;min-width:0;max-width:100%}input[type=date]{display:block;width:100%!important;min-width:0!important;max-width:100%!important;inline-size:100%!important;min-inline-size:0!important;font-size:16px;-webkit-appearance:none;appearance:none}label{font-size:12px;color:var(--muted)}textarea{min-height:80px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--card2);font-size:11px}.partline{border-top:1px solid var(--line);padding:9px 0}.partline:first-child{border-top:0}.price{font-weight:800}.empty{padding:18px 0;color:var(--muted);text-align:center}#modal{position:fixed;inset:0;background:#000c;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));overflow:auto;z-index:20}#modal:empty{display:none}#modal .card{max-width:650px;margin:10px auto;overflow:hidden}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.two>*{min-width:0}.two input,.two select{min-width:0;max-width:100%}@media(max-width:480px){.two{grid-template-columns:1fr}}@media(min-width:700px){body{max-width:850px;margin:auto}.grid{grid-template-columns:repeat(4,1fr)}}#invoiceView{position:fixed;inset:0;z-index:50;background:#f4f5f7;color:#15171a;overflow:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}#invoiceView:empty{display:none}.invoice-toolbar{max-width:800px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap}.invoice-toolbar button{background:#111;color:#fff}.invoice-toolbar .accent{background:#ff8a00;color:#111}.invoice-sheet{max-width:800px;margin:0 auto;background:white;padding:38px;box-shadow:0 8px 30px #0001}.invoice-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.invoice-company{font-size:25px;font-weight:800}.invoice-title{font-size:30px;font-weight:800;letter-spacing:.03em}.invoice-meta{margin:28px 0;display:grid;grid-template-columns:1fr 1fr;gap:18px}.invoice-box{border-top:2px solid #111;padding-top:10px}.invoice-table{width:100%;border-collapse:collapse;margin-top:30px}.invoice-table th,.invoice-table td{padding:12px 8px;border-bottom:1px solid #ddd;text-align:left}.invoice-table th:last-child,.invoice-table td:last-child{text-align:right}.invoice-total td{font-size:19px;font-weight:800;border-top:2px solid #111;border-bottom:0}.invoice-badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;font-weight:700}@media(max-width:600px){.invoice-sheet{padding:24px 18px;box-shadow:none}.invoice-meta{grid-template-columns:1fr}.invoice-head{flex-direction:column}}.invoice-image-wrap{max-width:800px;margin:0 auto}.invoice-image-wrap img,.invoice-image-wrap svg{display:block;width:100%;height:auto;background:white;border-radius:12px;box-shadow:0 8px 30px #0004}.invoice-image-status{padding:30px;text-align:center;color:var(--muted)}
@media print{body{background:white!important;color:#111!important;padding:0!important}.topbar,.nav,.invoice-toolbar,#modal{display:none!important}main{display:block!important}.invoice-sheet{box-shadow:none!important;margin:0!important;max-width:none!important;padding:20px!important}.invoice-sheet *{visibility:visible!important}}

.inline-invoice{margin-top:14px;background:#fff;color:#111;border-radius:14px;padding:18px;overflow:hidden}

 body>*{display:none!important}

 #invoicePrintHost .inline-actions{display:none!important}
 #invoicePrintHost .inline-invoice{display:block!important;margin:0;border-radius:0}
}

</head><body>
<div class="topbar"><div class="brandtext"><h1>🔧 Mechanic Mate</h1><div class="sub">Private mobile mechanic job manager</div></div><img id="headerLogo" class="app-logo hidden" alt="Company logo"></div><div id="nav" class="nav"></div><main id="app"></main><div id="modal"></div>
<script>
const KEY='mechanic-mate-v2';
let db=JSON.parse(localStorage.getItem(KEY)||'{}');
db.jobs=Array.isArray(db.jobs)?db.jobs:[];db.customers=Array.isArray(db.customers)?db.customers:[];db.parts=Array.isArray(db.parts)?db.parts:[];db.invoices=Array.isArray(db.invoices)?db.invoices:[];db.settings=db.settings||{hourlyRate:45,companyName:'',companyLogo:''};if(db.settings.hourlyRate==null)db.settings.hourlyRate=45;if(db.settings.companyName==null)db.settings.companyName='';if(db.settings.companyLogo==null)db.settings.companyLogo='';
db.jobs.forEach(j=>{if(!Array.isArray(j.partIds))j.partIds=[];if(j.hours==null)j.hours=0});
db.parts.forEach(p=>{if(p.charge==null)p.charge=Number(p.cost||0)});
let page='Dashboard';
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const gid=()=>crypto.randomUUID();
const jobLabel=j=>`${j.title||'Untitled'}${j.reg?' • '+j.reg:''}${j.customer?' • '+j.customer:''}`;
function go(p){page=p;render()}function renderHeader(){const img=document.getElementById('headerLogo');if(db.settings.companyLogo){img.src=db.settings.companyLogo;img.classList.remove('hidden')}else{img.removeAttribute('src');img.classList.add('hidden')}}function render(){renderHeader();nav.innerHTML=['Dashboard','Jobs','Customers','Parts','Invoices','Settings'].map(x=>`<button class="${page===x?'on':''}" onclick="go('${x}')">${x}</button>`).join('');app.innerHTML=({Dashboard:dash,Jobs:jobs,Customers:customers,Parts:parts,Invoices:invoices,Settings:settings}[page])()}
function dash(){const rev=db.invoices.reduce((a,x)=>a+Number(x.total||0),0),cost=db.parts.reduce((a,x)=>a+Number(x.cost||0),0);return `<div class="grid"><div class="card stat">Jobs<b>${db.jobs.length}</b></div><div class="card stat">Customers<b>${db.customers.length}</b></div><div class="card stat">Invoiced<b>${money(rev)}</b></div><div class="card stat">Profit*<b>${money(rev-cost)}</b></div></div><div class="actions"><button class="primary" onclick="jobForm()">＋ New Job</button><button onclick="invoiceForm()">＋ Invoice</button></div><div class="card"><b>Recent jobs</b>${db.jobs.slice().reverse().slice(0,5).map(jobCard).join('')||'<div class="empty">No jobs yet.</div>'}</div><p class="muted">*Invoices minus recorded parts costs.</p>`}
function linkedParts(j){return (j.partIds||[]).map(id=>db.parts.find(p=>p.id===id)).filter(Boolean)}
function jobCard(j){const ps=linkedParts(j),lab=Number(j.hours||0)*Number(db.settings.hourlyRate||0);return `<div class="card"><div class="row"><b>${esc(j.title||'Untitled job')}</b><span class="pill">${esc(j.status||'Open')}</span></div><div class="muted">${esc(j.customer||'No customer')} • ${esc(j.reg||'No reg')} • ${esc(j.date||'')}</div>${j.hours?`<div class="muted">${esc(j.hours)}h labour = ${money(lab)}</div>`:''}${ps.length?`<div class="muted">${ps.length} linked part${ps.length===1?'':'s'}</div>`:''}<div class="actions"><button onclick="jobForm('${j.id}')">Open</button><button class="primary" onclick="jobPartsMenu('${j.id}')">＋ Add / Select Parts</button><button onclick="invoiceForm('${j.id}')">Invoice</button></div></div>`}
function jobs(){return `<div class="row"><h2>Jobs</h2><button class="primary" onclick="jobForm()">＋ New</button></div>${db.jobs.slice().reverse().map(jobCard).join('')||'<div class="empty">No jobs.</div>'}`}
function customers(){return `<div class="row"><h2>Customers</h2><button class="primary" onclick="customerForm()">＋ Add</button></div>${db.customers.map(c=>`<div class="card"><b>${esc(c.name)}</b><div class="muted">${esc(c.phone)}${c.email?'<br>'+esc(c.email):''}<br>${esc(c.vehicle)}<br>${esc(c.address)}</div><div class="actions"><button onclick="customerForm('${c.id}')">Edit</button><button class="danger" onclick="del('customers','${c.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No customers.</div>'}`}
function partJobs(p){return db.jobs.filter(j=>(j.partIds||[]).includes(p.id))}
function parts(){return `<div class="row"><h2>Parts</h2><button class="primary" onclick="partForm()">＋ Add</button></div>${db.parts.slice().reverse().map(p=>{const js=partJobs(p);return `<div class="card"><div class="row"><b>${esc(p.name)}</b><span class="price">${money(p.charge||p.cost)}</span></div><div class="muted">Cost ${money(p.cost)}${p.supplier?' • '+esc(p.supplier):''}</div><div class="muted">${js.length?'Used on: '+js.map(j=>esc(j.title||j.reg||'Job')).join(', '):'Not linked to a job'}</div><div class="actions"><button onclick="partForm('${p.id}')">Edit</button><button class="danger" onclick="deletePart('${p.id}')">Delete</button></div></div>`}).join('')||'<div class="empty">No parts.</div>'}`}
function invoices(){return `<div class="row"><h2>Invoices</h2><button class="primary" onclick="invoiceForm()">＋ New</button></div>${db.invoices.slice().reverse().map(i=>`<div class="card"><div class="row"><b>${esc(i.number)}</b><b>${money(i.total)}</b></div><div class="muted">${esc(i.customer)} • ${esc(i.date)}${i.jobId?' • linked job':''}</div><p>${i.paid?'✅ PAID':'⚠️ UNPAID'}</p><div class="actions"><button class="primary" onclick="viewInvoice('${i.id}',this)">View Invoice</button><button onclick="printShareInvoice('${i.id}')">Print / Share</button><button onclick="emailInvoice('${i.id}')">Email</button><button onclick="paid('${i.id}')">Mark ${i.paid?'unpaid':'paid'}</button><button class="danger" onclick="del('invoices','${i.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No invoices.</div>'}`}
function settings(){return `<h2>Settings</h2><div class="card"><b>Business details</b><p class="muted">These details appear on your invoices and the logo also appears in the app header.</p><label>Company name</label><input id="companyName" value="${esc(db.settings.companyName||'')}" placeholder="e.g. Roadside Auto Solutions"><label>Company logo</label>${db.settings.companyLogo?`<div style="margin:8px 0"><img class="logo-preview" src="${db.settings.companyLogo}" alt="Logo preview"></div>`:'<div class="muted" style="margin:8px 0">No logo uploaded yet.</div>'}<input id="logoUpload" type="file" accept="image/*" onchange="handleLogoUpload(event)"><div class="actions"><button class="primary" onclick="saveBusinessSettings()">Save business details</button>${db.settings.companyLogo?'<button class="danger" onclick="removeLogo()">Remove logo</button>':''}</div></div><div class="card"><b>Labour rate</b><p class="muted">Used automatically when you enter hours on a job.</p><label>Hourly charge (£)</label><input id="rate" type="number" min="0" step="0.01" value="${Number(db.settings.hourlyRate||0)}"><button class="primary" onclick="db.settings.hourlyRate=Number(rate.value||0);save();alert('Hourly rate saved')">Save rate</button></div><div class="card"><b>Backup</b><p class="muted">Export your data regularly. Your uploaded logo is included in the backup.</p><button class="primary" onclick="exportData()">Export backup</button> <button onclick="imp.click()">Import</button><input id="imp" type="file" accept=".json" style="display:none" onchange="importData(event)"></div><div class="card"><b>Reset</b><p class="muted">Delete everything stored on this device.</p><button class="danger" onclick="resetData()">Delete all data</button></div>`}
function handleLogoUpload(e){const f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>3*1024*1024){alert('Please use a logo under 3 MB.');e.target.value='';return}const r=new FileReader();r.onload=()=>{db.settings.companyLogo=r.result;save();render();alert('Logo saved')};r.readAsDataURL(f)}
function saveBusinessSettings(){db.settings.companyName=companyName.value.trim();save();render();alert('Business details saved')}
function removeLogo(){if(confirm('Remove the saved company logo?')){db.settings.companyLogo='';save();render()}}
function openModal(title,body){modal.innerHTML=`<div class="card"><div class="row"><h2>${title}</h2><button onclick="closeM()">✕</button></div>${body}</div>`}function closeM(){modal.innerHTML=''}
function customerOptions(selected=''){return `<option value="">— Select customer —</option>`+db.customers.map(c=>`<option value="${esc(c.name)}" ${c.name===selected?'selected':''}>${esc(c.name)}${c.vehicle?' • '+esc(c.vehicle):''}</option>`).join('')}
function jobForm(id){let j=db.jobs.find(x=>x.id===id)||{};const ps=linkedParts(j);openModal(id?'Edit Job':'New Job',`<label>Job title</label><input id="jt" value="${esc(j.title)}"><label>Customer</label><select id="jcsel" onchange="jcmanual.value=this.value">${customerOptions(j.customer||'')}</select><label>Customer name (or type manually)</label><input id="jcmanual" value="${esc(j.customer)}"><label>Registration</label><input id="jr" value="${esc(j.reg)}"><label>Date</label><input id="jd" class="date-safe" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" value="${j.date||new Date().toISOString().slice(0,10)}"><label>Status</label><select id="js"><option>Open</option><option>Booked</option><option>In progress</option><option>Complete</option><option>Invoiced</option><option>Paid</option><option>Cancelled</option></select><label>Time spent on job (hours)</label><input id="jh" type="number" inputmode="decimal" min="0" step="0.25" value="${Number(j.hours||0)}" placeholder="e.g. 1.5"><div class="muted" style="margin-top:-6px;margin-bottom:10px">Labour is calculated automatically using your hourly rate in Settings.</div><label>Location</label><input id="jl" value="${esc(j.location)}"><label>Notes</label><textarea id="jn">${esc(j.notes)}</textarea>${id?`<div class="card"><div class="row"><b>Linked parts</b><button class="primary" onclick="jobPartsMenu('${id}')">＋ Add / Select Parts</button></div>${ps.map(p=>`<div class="partline row"><span>${esc(p.name)}</span><span>${money(p.charge||p.cost)}</span></div>`).join('')||'<div class="muted">No parts linked yet.</div>'}</div>`:''}<button class="primary" onclick="saveJob('${id||''}')">Save job</button>`);if(j.status)js.value=j.status}
function saveJob(id){let old=db.jobs.find(y=>y.id===id)||{};let x={...old,id:id||gid(),title:jt.value,customer:jcmanual.value,reg:jr.value,date:jd.value,status:js.value,location:jl.value,notes:jn.value,hours:Number(jh.value||0),partIds:old.partIds||[]},i=db.jobs.findIndex(y=>y.id===x.id);i<0?db.jobs.push(x):db.jobs[i]=x;save();closeM();render()}
function customerForm(id){let c=db.customers.find(x=>x.id===id)||{};openModal(id?'Edit Customer':'New Customer',`<label>Name</label><input id="cn" value="${esc(c.name)}"><label>Phone</label><input id="cp" value="${esc(c.phone)}"><label>Email</label><input id="ce" type="email" value="${esc(c.email||'')}"><label>Vehicle / Reg</label><input id="cv" value="${esc(c.vehicle)}"><label>Address</label><textarea id="ca">${esc(c.address)}</textarea><button class="primary" onclick="saveCustomer('${id||''}')">Save</button>`)}
function saveCustomer(id){let x={id:id||gid(),name:cn.value,phone:cp.value,email:ce.value,vehicle:cv.value,address:ca.value},i=db.customers.findIndex(y=>y.id===x.id);i<0?db.customers.push(x):db.customers[i]=x;save();closeM();render()}
function partForm(id='',linkJobId=''){let p=db.parts.find(x=>x.id===id)||{};openModal(id?'Edit Part':'Add Part',`<label>Part / expense</label><input id="pn" value="${esc(p.name)}"><div class="two"><div><label>Your cost (£)</label><input id="pc" type="number" min="0" step="0.01" value="${Number(p.cost||0)}"></div><div><label>Customer charge (£)</label><input id="pch" type="number" min="0" step="0.01" value="${Number(p.charge??p.cost??0)}"></div></div><label>Supplier</label><input id="ps" value="${esc(p.supplier)}"><button class="primary" onclick="savePart('${id}','${linkJobId}')">Save${linkJobId?' & link to job':''}</button>`)}
function savePart(id,linkJobId){const x={id:id||gid(),name:pn.value,cost:Number(pc.value||0),charge:Number(pch.value||0),supplier:ps.value},i=db.parts.findIndex(y=>y.id===x.id);i<0?db.parts.push(x):db.parts[i]=x;if(linkJobId){const j=db.jobs.find(y=>y.id===linkJobId);if(j&&!j.partIds.includes(x.id))j.partIds.push(x.id)}save();closeM();render()}
function jobPartsMenu(jobId){const j=db.jobs.find(x=>x.id===jobId);if(!j)return;const linked=new Set(j.partIds||[]);openModal('Parts for this job',`<p class="muted">${esc(jobLabel(j))}</p><div class="card"><b>Select saved parts</b><p class="muted">Tick any parts from your Parts tab that were used on this job.</p>${db.parts.length?db.parts.map(p=>`<label style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;color:var(--text)"><input type="checkbox" class="jobPartCheck" value="${p.id}" ${linked.has(p.id)?'checked':''} style="width:22px;height:22px;margin:0;flex:0 0 auto"><span style="flex:1"><b>${esc(p.name)}</b><br><span class="muted">Charge ${money(p.charge||p.cost)} • Cost ${money(p.cost)}</span></span></label>`).join(''):'<div class="empty">You have no saved parts yet.</div>'}<button class="primary" style="width:100%;margin-top:10px" onclick="saveJobPartSelection('${jobId}')">Save selected parts</button></div><button style="width:100%;margin-top:10px" onclick="partForm('','${jobId}')">＋ Add a new part manually</button><p class="muted">A manually added part is saved in the Parts tab and linked to this job automatically.</p>`)}
function saveJobPartSelection(jobId){const j=db.jobs.find(x=>x.id===jobId);if(!j)return;j.partIds=[...document.querySelectorAll('.jobPartCheck:checked')].map(x=>x.value);save();closeM();render()}
function deletePart(id){if(!confirm('Delete this part? It will also be unlinked from any jobs.'))return;db.jobs.forEach(j=>j.partIds=(j.partIds||[]).filter(x=>x!==id));db.parts=db.parts.filter(x=>x.id!==id);save();render()}
function invoiceForm(jobId=''){const j=db.jobs.find(x=>x.id===jobId)||null;const partsTotal=j?linkedParts(j).reduce((a,p)=>a+Number(p.charge||p.cost||0),0):0;const hours=j?Number(j.hours||0):0;const rate=Number(db.settings.hourlyRate||0);const labour=hours*rate;const jobsOpt=`<option value="">— No linked job —</option>`+db.jobs.slice().reverse().map(x=>`<option value="${x.id}" ${x.id===jobId?'selected':''}>${esc(jobLabel(x))}</option>`).join('');openModal('New Invoice',`<label>Recent job</label><select id="ivjob" onchange="fillInvoiceFromJob()">${jobsOpt}</select><label>Customer</label><select id="ivcustsel" onchange="ivc.value=this.value;fillCustomerEmail(this.value)">${customerOptions(j?.customer||'')}</select><label>Customer name</label><input id="ivc" value="${esc(j?.customer||'')}"><label>Customer email</label><input id="ive" type="email" value="${esc((db.customers.find(c=>c.name===(j?.customer||''))||{}).email||'')}"><label>Invoice number</label><input id="ivn" value="INV-${String(db.invoices.length+1).padStart(4,'0')}"><label>Date</label><input id="ivd" class="date-safe" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" value="${new Date().toISOString().slice(0,10)}"><label>Time spent on job (hours)</label><input id="ivhours" type="number" inputmode="decimal" min="0" step="0.25" value="${hours}" oninput="recalcInvoiceLabour()" placeholder="e.g. 1.5"><div class="muted" style="margin-top:-6px;margin-bottom:10px">Hourly rate: ${money(rate)} / hour. Labour is calculated automatically.</div><label>Labour (£) — calculated automatically</label><input id="ivl" type="number" step="0.01" value="${labour.toFixed(2)}" readonly style="opacity:.8"><label>Parts (£) — from linked parts</label><input id="ivp" type="number" step="0.01" value="${partsTotal.toFixed(2)}" readonly style="opacity:.8"><label>Travel / call-out (£)</label><input id="ivt" type="number" step="0.01" value="0"><label>Other (£)</label><input id="ivo" type="number" step="0.01" value="0"><button class="primary" onclick="saveInvoice()">Save invoice</button>`) }
function recalcInvoiceLabour(){const rate=Number(db.settings.hourlyRate||0);if(document.getElementById('ivl'))ivl.value=(Number(ivhours.value||0)*rate).toFixed(2)}
function fillInvoiceFromJob(){const j=db.jobs.find(x=>x.id===ivjob.value);if(!j){ivhours.value=0;ivl.value='0.00';ivp.value='0.00';return}ivc.value=j.customer||'';if(document.getElementById('ivcustsel'))ivcustsel.value=j.customer||'';fillCustomerEmail(j.customer||'');ivhours.value=Number(j.hours||0);recalcInvoiceLabour();ivp.value=linkedParts(j).reduce((a,p)=>a+Number(p.charge||p.cost||0),0).toFixed(2)}
function fillCustomerEmail(name){const c=db.customers.find(x=>x.name===name);if(document.getElementById('ive'))ive.value=c?.email||''}
function invoiceMarkup(i){const j=invoiceJob(i);const company=esc(db.settings.companyName||'Mechanic Mate');const logo=db.settings.companyLogo?`<img src="${db.settings.companyLogo}" style="max-width:120px;max-height:80px;object-fit:contain">`:'';const reg=j?.reg||'';const title=j?.title||'';const status=i.paid?'PAID':'DUE';return `<div class="invoice-sheet"><div class="invoice-head"><div>${logo}<div class="invoice-company">${company}</div></div><div><div class="invoice-title">INVOICE</div><div class="muted">${esc(i.number)}</div><div class="invoice-badge">${status}</div></div></div><div class="invoice-meta"><div class="invoice-box"><b>Bill to</b><div>${esc(i.customer||'')}</div>${i.email?`<div class="muted">${esc(i.email)}</div>`:''}</div><div class="invoice-box"><b>Invoice details</b><div>Date: ${esc(i.date||'')}</div>${title?`<div>Job: ${esc(title)}</div>`:''}${reg?`<div>Registration: ${esc(reg)}</div>`:''}</div></div><table class="invoice-table"><thead><tr><th>Description</th><th>Amount</th></tr></thead><tbody>${Number(i.labour||0)?`<tr><td>Labour${i.hours?` (${esc(i.hours)}h @ ${money(db.settings.hourlyRate||0)}/hr)`:''}</td><td>${money(i.labour)}</td></tr>`:''}${Number(i.parts||0)?`<tr><td>Parts</td><td>${money(i.parts)}</td></tr>`:''}${Number(i.travel||0)?`<tr><td>Travel / call-out</td><td>${money(i.travel)}</td></tr>`:''}${Number(i.other||0)?`<tr><td>Other</td><td>${money(i.other)}</td></tr>`:''}<tr class="invoice-total"><td>Total</td><td>${money(i.total)}</td></tr></tbody></table></div>`}
function closeInvoiceView(){page='Invoices';render();window.scrollTo(0,0)}
function svgEsc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&apos;'}[c]))}
function invoiceSVG(i){
  const j=invoiceJob(i),company=db.settings.companyName||'Mechanic Mate',reg=j?.reg||'',title=j?.title||'',rate=Number(db.settings.hourlyRate||0);
  const rows=[];

  if(Number(i.travel||0)) rows.push(['Travel / call-out',money(i.travel)]);
  if(Number(i.other||0)) rows.push(['Other',money(i.other)]);
  let y=790; const rowSvg=rows.map(([label,amount])=>{const out=`<line x1="90" y1="${y-26}" x2="1150" y2="${y-26}" stroke="#e5e7eb" stroke-width="2"/><text x="90" y="${y}" class="body">${svgEsc(label)}</text><text x="1150" y="${y}" class="body" text-anchor="end">${svgEsc(amount)}</text>`; y+=86; return out}).join('');
  let logo='';
  if(db.settings.companyLogo) logo=`<image href="${svgEsc(db.settings.companyLogo)}" x="90" y="70" width="220" height="125" preserveAspectRatio="xMinYMin meet"/>`;

  <style>.title{font:800 58px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#15171a}.company{font:700 44px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#15171a}.head{font:700 27px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#15171a}.body{font:400 29px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#222}.small{font:400 25px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#666}.total{font:800 40px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#15171a}</style>
  <rect width="1240" height="1754" fill="#fff"/>${logo}

  <text x="1150" y="120" class="title" text-anchor="end">INVOICE</text><text x="1150" y="170" class="small" text-anchor="end">${svgEsc(i.number||'')}</text>
  <rect x="1020" y="200" width="130" height="48" rx="24" fill="${i.paid?'#d8f5e7':'#fee4dc'}"/><text x="1085" y="233" class="head" text-anchor="middle" fill="${i.paid?'#147a4b':'#a33b28'}">${i.paid?'PAID':'DUE'}</text>
  <line x1="90" y1="320" x2="1150" y2="320" stroke="#15171a" stroke-width="3"/>
  <text x="90" y="375" class="head">BILL TO</text><text x="650" y="375" class="head">INVOICE DETAILS</text>
  <text x="90" y="425" class="body">${svgEsc(i.customer||'')}</text>${i.email?`<text x="90" y="465" class="small">${svgEsc(i.email)}</text>`:''}
  <text x="650" y="425" class="body">Date: ${svgEsc(i.date||'')}</text>${title?`<text x="650" y="465" class="small">Job: ${svgEsc(title)}</text>`:''}${reg?`<text x="650" y="505" class="small">Registration: ${svgEsc(reg)}</text>`:''}

  ${rowSvg}
  <line x1="650" y1="${y+15}" x2="1150" y2="${y+15}" stroke="#15171a" stroke-width="3"/><text x="650" y="${y+75}" class="total">TOTAL</text><text x="1150" y="${y+75}" class="total" text-anchor="end">${svgEsc(money(i.total))}</text>
  <text x="90" y="1650" class="small">Thank you for your business.</text></svg>`;
}
function invoiceImageURL(i){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(invoiceSVG(i))}
function invoiceImageBlob(i){return new Blob([invoiceSVG(i)],{type:'image/svg+xml'})}
function closeInvoiceView(){page='Invoices';render();window.scrollTo(0,0)}
function viewInvoice(id){const i=db.invoices.find(x=>x.id===id);if(!i)return;page='Invoices';renderHeader();nav.innerHTML=['Dashboard','Jobs','Customers','Parts','Invoices','Settings'].map(x=>`<button class="${x==='Invoices'?'on':''}" onclick="go('${x}')">${x}</button>`).join('');app.innerHTML=`<div class="invoice-toolbar"><button onclick="closeInvoiceView()">← Back to invoices</button><button class="accent" onclick="printInvoice()">Print / Save PDF</button><button onclick="emailInvoice('${i.id}')">Email</button></div>${invoiceMarkup(i)}`;window.scrollTo(0,0)}
function printInvoice(){window.print()}
function invoiceShareText(i){const j=invoiceJob(i);return `Invoice ${i.number}\n${db.settings.companyName||'Mechanic Mate'}\nCustomer: ${i.customer||''}${j?.reg?`\nRegistration: ${j.reg}`:''}\nTotal: ${money(i.total)}\nDate: ${i.date||''}`}
async function shareInvoice(id){const i=db.invoices.find(x=>x.id===id);if(!i)return;const text=invoiceShareText(i);try{if(navigator.share){await navigator.share({title:`Invoice ${i.number}`,text});return}}catch(e){if(e&&e.name==='AbortError')return}openModal('Share invoice',`<p class="muted">Use <b>View Invoice → Print / Save PDF</b> to create the actual invoice PDF. You can then share that PDF from the iPhone print/share screen.</p><div class="actions"><button class="primary" onclick="closeM();viewInvoice('${i.id}')">View invoice</button><button onclick="emailInvoice('${i.id}')">Email details</button></div>`) }
function saveInvoiceImage(id){const i=db.invoices.find(x=>x.id===id);if(!i)return;const blob=invoiceImageBlob(i),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${(i.number||'invoice').replace(/[^a-z0-9-_]/gi,'-')}.svg`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function emailInvoice(id){const i=db.invoices.find(x=>x.id===id);if(!i)return;const subject=encodeURIComponent(`Invoice ${i.number} - ${db.settings.companyName||'Mechanic Mate'}`),body=encodeURIComponent(invoiceShareText(i));location.href=`mailto:${encodeURIComponent(i.email||'')}?subject=${subject}&body=${body}`}
function syncJobPaymentStatus(jobId){if(!jobId)return;const j=db.jobs.find(x=>x.id===jobId);if(!j)return;const linked=db.invoices.filter(x=>x.jobId===jobId);if(linked.length){j.status=linked.every(x=>x.paid)?'Paid':'Invoiced'}else if(j.status==='Paid'||j.status==='Invoiced'){j.status='Complete'}}
function saveInvoice(){recalcInvoiceLabour();const total=(+ivl.value||0)+(+ivp.value||0)+(+ivt.value||0)+(+ivo.value||0);const jobId=ivjob.value||'';db.invoices.push({id:gid(),number:ivn.value,customer:ivc.value,email:ive.value,date:ivd.value,jobId,hours:+ivhours.value||0,labour:+ivl.value||0,parts:+ivp.value||0,travel:+ivt.value||0,other:+ivo.value||0,total,paid:false});const j=db.jobs.find(x=>x.id===jobId);if(j)j.hours=+ivhours.value||0;syncJobPaymentStatus(jobId);save();closeM();render()}
function paid(id){const x=db.invoices.find(y=>y.id===id);if(!x)return;x.paid=!x.paid;syncJobPaymentStatus(x.jobId);save();render()}function del(t,id){if(!confirm('Delete this item?'))return;if(t==='invoices'){const inv=db.invoices.find(x=>x.id===id);const jobId=inv?.jobId||'';db.invoices=db.invoices.filter(x=>x.id!==id);syncJobPaymentStatus(jobId)}else db[t]=db[t].filter(x=>x.id!==id);save();render()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='mechanic-mate-backup.json';a.click()}
function importData(e){let r=new FileReader;r.onload=()=>{try{db=JSON.parse(r.result);db.settings=db.settings||{hourlyRate:45,companyName:'',companyLogo:''};if(db.settings.companyName==null)db.settings.companyName='';if(db.settings.companyLogo==null)db.settings.companyLogo='';db.jobs=(db.jobs||[]).map(j=>({...j,partIds:Array.isArray(j.partIds)?j.partIds:[],hours:Number(j.hours||0)}));db.parts=(db.parts||[]).map(p=>({...p,charge:Number(p.charge??p.cost??0)}));save();render();alert('Backup imported')}catch{alert('Invalid backup')}};r.readAsText(e.target.files[0])}function resetData(){if(confirm('Delete ALL data?')){db={jobs:[],customers:[],parts:[],invoices:[],settings:{hourlyRate:45,companyName:'',companyLogo:''}};save();render()}}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error))}save();render();

<script>
(function(){
  function invoiceById(id){
    return (db.invoices || []).find(function(x){ return x.id === id; });
  }

  function jobByInvoice(i){
    return (db.jobs || []).find(function(j){ return j.id === i.jobId; }) || {};
  }

  function num(v){
    v = Number(v);
    return Number.isFinite(v) ? v : 0;
  }

  function invoiceHtml(i){
    var j = jobByInvoice(i);
    var settings = db.settings || {};
    var labour = num(i.labour);
    var parts = num(i.parts);
    var travel = num(i.travel);
    var other = num(i.other);
    var total = num(i.total) || labour + parts + travel + other;
    var company = settings.companyName || 'Mechanic Mate';
    var logo = settings.companyLogo || '';

    var rows = '';
    if (labour) rows += '<tr><td>Labour' + (i.hours ? ' (' + esc(i.hours) + ' hours)' : '') + '</td><td>' + money(labour) + '</td></tr>';
    if (parts) rows += '<tr><td>Parts</td><td>' + money(parts) + '</td></tr>';
    if (travel) rows += '<tr><td>Travel / call-out</td><td>' + money(travel) + '</td></tr>';
    if (other) rows += '<tr><td>Other</td><td>' + money(other) + '</td></tr>';

    return '<div class="inline-invoice">' +
      '<div class="inv-head">' +
        '<div>' +
          (logo ? '<img class="inv-logo" src="' + logo + '" alt="Company logo">' : '') +
          '<div style="font-weight:900;font-size:20px">' + esc(company) + '</div>' +
        '</div>' +
        '<div style="text-align:right">' +
          '<div class="inv-title">INVOICE</div>' +
          '<div class="inv-meta">' + esc(i.number || '') + '<br>' + esc(i.date || '') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="inv-meta">' +
        '<b>Customer:</b> ' + esc(i.customer || '') + '<br>' +
        (j.reg ? '<b>Registration:</b> ' + esc(j.reg) + '<br>' : '') +
        (j.title ? '<b>Job:</b> ' + esc(j.title) + '<br>' : '') +
      '</div>' +
      '<table><thead><tr><th>Description</th><th>Amount</th></tr></thead><tbody>' +
        rows +
      '</tbody></table>' +
      '<div class="inv-total">Total: ' + money(total) + '</div>' +
      '<div style="margin-top:16px;font-weight:900">' + (i.paid ? 'PAID' : 'UNPAID') + '</div>' +
    '</div>';
  }

  window.closeInlineInvoice = function(){
    var el = document.getElementById('inlineInvoicePreview');
    if (el) el.remove();
  };

  window.viewInvoice = function(id, button){
    var i = invoiceById(id);
    if (!i) {
      alert('Invoice not found.');
      return;
    }

    closeInlineInvoice();

    var host = document.createElement('div');
    host.id = 'inlineInvoicePreview';

    var actions = document.createElement('div');
    actions.className = 'inline-actions';

    var closeBtn = document.createElement('button');
    closeBtn.className = 'secondary';
    closeBtn.textContent = 'Close invoice';
    closeBtn.addEventListener('click', closeInlineInvoice);

    var printBtn = document.createElement('button');
    printBtn.textContent = 'Print / Save PDF';
    printBtn.addEventListener('click', function(){ printShareInvoice(id); });

    var emailBtn = document.createElement('button');
    emailBtn.textContent = 'Email';
    emailBtn.addEventListener('click', function(){ emailInvoice(id); });

    actions.appendChild(closeBtn);
    actions.appendChild(printBtn);
    actions.appendChild(emailBtn);

    var content = document.createElement('div');
    content.innerHTML = invoiceHtml(i);

    host.appendChild(actions);
    host.appendChild(content);

    var card = button && button.closest ? button.closest('.card') : null;
    (card || document.getElementById('app')).appendChild(host);

    try {
      host.scrollIntoView({behavior:'smooth', block:'start'});
    } catch(e) {
      host.scrollIntoView();
    }
  };

  window.printShareInvoice = function(id){
    var i = invoiceById(id);
    if (!i) {
      alert('Invoice not found.');
      return;
    }

    var host = document.getElementById('invoicePrintHost');
    if (!host) {
      host = document.createElement('div');
      host.id = 'invoicePrintHost';
      document.body.appendChild(host);
    }

    host.innerHTML = invoiceHtml(i);
    host.style.display = 'block';

    setTimeout(function(){
      window.print();
      setTimeout(function(){
        host.style.display = 'none';
        host.innerHTML = '';
      }, 750);
    }, 100);
  };

  window.emailInvoice = function(id){
    var i = invoiceById(id);
    if (!i) {
      alert('Invoice not found.');
      return;
    }

    var j = jobByInvoice(i);
    var company = (db.settings && db.settings.companyName) || 'Mechanic Mate';
    var subject = 'Invoice ' + (i.number || '') + ' - ' + company;
    var body =
      company + '\n\n' +
      'Invoice: ' + (i.number || '') + '\n' +
      'Date: ' + (i.date || '') + '\n' +
      'Customer: ' + (i.customer || '') + '\n' +
      (j.reg ? 'Registration: ' + j.reg + '\n' : '') +
      'Total: ' + money(i.total || 0) + '\n' +
      'Status: ' + (i.paid ? 'PAID' : 'UNPAID');

    var address = i.email || '';
    window.location.href =
      'mailto:' + encodeURIComponent(address) +
      '?subject=' + encodeURIComponent(subject) +
      '&body=' + encodeURIComponent(body);
  };
})();
</script>


<script>
(function(){
  // ---------- v17 data migration ----------
  db.settings = db.settings || {};
  if (db.settings.companyPhone == null) db.settings.companyPhone = '';
  if (db.settings.companyEmail == null) db.settings.companyEmail = '';

  db.customers = (db.customers || []).map(function(c){
    if (c.reg == null) c.reg = '';
    if (c.make == null) c.make = '';
    if (c.model == null) c.model = '';
    if (c.engineSize == null) c.engineSize = '';
    // Preserve the old free-text vehicle field.
    if (!c.reg && c.vehicle) c.reg = c.vehicle;
    return c;
  });

  db.jobs = (db.jobs || []).map(function(j){
    j.partIds = Array.isArray(j.partIds) ? j.partIds : [];
    j.partQuantities = j.partQuantities && typeof j.partQuantities === 'object' ? j.partQuantities : {};
    j.partIds.forEach(function(id){
      if (!(id in j.partQuantities)) j.partQuantities[id] = 1;
    });
    if (j.make == null) j.make = '';
    if (j.model == null) j.model = '';
    if (j.engineSize == null) j.engineSize = '';
    return j;
  });

  function customerByName(name){
    return (db.customers || []).find(function(c){ return c.name === name; }) || {};
  }

  function jobPartLines(j){
    if (!j) return [];
    return (j.partIds || []).map(function(id){
      var part = (db.parts || []).find(function(p){ return p.id === id; });
      if (!part) return null;
      var qty = Number((j.partQuantities || {})[id] || 1);
      if (!Number.isFinite(qty) || qty <= 0) qty = 1;
      var unit = Number(part.charge != null ? part.charge : part.cost || 0);
      return {
        partId: part.id,
        name: part.name || 'Part',
        qty: qty,
        unitPrice: unit,
        total: qty * unit,
        cost: Number(part.cost || 0),
        supplier: part.supplier || ''
      };
    }).filter(Boolean);
  }

  saveInvoice = function(){

    var cust = invoiceCustomer(i);

    var partsRows = lines.map(function(line){

    }).join('');

    if (!partsRows && partsSubtotal) {
      partsRows = '<tr><td>Parts</td><td>1</td><td>' + money(partsSubtotal) + '</td><td>' + money(partsSubtotal) + '</td></tr>';
    }

    var contact = [settings.companyPhone, settings.companyEmail].filter(Boolean).map(esc).join('<br>');
    var vehicleBits = [vehicle.make, vehicle.model, vehicle.engineSize].filter(Boolean).map(esc).join(' • ');

    return '<div class="inline-invoice">' +
      '<div class="inv-head"><div>' +
        (logo ? '<img class="inv-logo" src="' + logo + '" alt="Company logo">' : '') +
        '<div style="font-weight:900;font-size:20px">' + esc(company) + '</div>' +
        (contact ? '<div class="invoice-contact">' + contact + '</div>' : '') +
      '</div><div style="text-align:right"><div class="inv-title">INVOICE</div>' +
        '<div class="inv-meta">' + esc(i.number || '') + '<br>' + esc(i.date || '') + '</div>' +
        '<div style="margin-top:7px;font-weight:900">' + (i.paid ? 'PAID' : 'UNPAID') + '</div>' +
      '</div></div>' +

      '<div class="bill-grid">' +
        '<div class="bill-box"><b>BILLED TO</b><br>' +
          esc(cust.name) +
          (cust.address ? '<br>' + esc(cust.address).replace(/\n/g,'<br>') : '') +
          (cust.phone ? '<br>' + esc(cust.phone) : '') +
          (cust.email ? '<br>' + esc(cust.email) : '') +
        '</div>' +
        '<div class="bill-box"><b>VEHICLE / JOB</b><br>' +
          (vehicle.reg ? 'Registration: ' + esc(vehicle.reg) + '<br>' : '') +
          (vehicleBits ? vehicleBits + '<br>' : '') +
          (vehicle.title ? 'Job: ' + esc(vehicle.title) : '') +
        '</div>' +
      '</div>' +

      (Number(i.labour || 0) ? '<table><tbody><tr><td><b>Labour</b>' +
        (i.hours ? ' — ' + esc(i.hours) + ' hours @ ' + money(db.settings.hourlyRate || 0) + '/hr' : '') +
        '</td><td style="text-align:right"><b>' + money(i.labour) + '</b></td></tr></tbody></table>' : '') +

      (partsRows ? '<div style="margin-top:18px;font-weight:900">PARTS USED</div>' +
        '<table class="parts-table"><thead><tr><th>Part</th><th>Qty</th><th>Each</th><th>Total</th></tr></thead><tbody>' +
        partsRows +
        '<tr class="parts-subtotal"><td colspan="3">Parts subtotal</td><td>' + money(partsSubtotal) + '</td></tr>' +
        '</tbody></table>' : '') +

      ((Number(i.travel || 0) || Number(i.other || 0)) ?
        '<table><tbody>' +
          (Number(i.travel || 0) ? '<tr><td>Travel / call-out</td><td>' + money(i.travel) + '</td></tr>' : '') +
          (Number(i.other || 0) ? '<tr><td>Other</td><td>' + money(i.other) + '</td></tr>' : '') +
        '</tbody></table>' : '') +

      '<div class="inv-total">Total: ' + money(i.total) + '</div>' +
    '</div>';
  }

  // Replace the invoice functions that v16 repaired, keeping the same button wiring.
  window.viewInvoice = function(id, button){
    var i = (db.invoices || []).find(function(x){ return x.id === id; });
    if (!i) { alert('Invoice not found.'); return; }
    if (window.closeInlineInvoice) closeInlineInvoice();

    var host = document.createElement('div');
    host.id = 'inlineInvoicePreview';

    var actions = document.createElement('div');
    actions.className = 'inline-actions';

    var closeBtn = document.createElement('button');
    closeBtn.className = 'secondary';
    closeBtn.textContent = 'Close invoice';
    closeBtn.addEventListener('click', function(){ closeInlineInvoice(); });

    var printBtn = document.createElement('button');
    printBtn.textContent = 'Print / Save PDF';
    printBtn.addEventListener('click', function(){ printShareInvoice(id); });

    var emailBtn = document.createElement('button');
    emailBtn.textContent = 'Email';
    emailBtn.addEventListener('click', function(){ emailInvoice(id); });

    actions.append(closeBtn, printBtn, emailBtn);

    var content = document.createElement('div');
    content.innerHTML = invoiceHtmlV17(i);
    host.append(actions, content);

    var card = button && button.closest ? button.closest('.card') : null;
    (card || document.getElementById('app')).appendChild(host);
    try { host.scrollIntoView({behavior:'smooth', block:'start'}); } catch(e) { host.scrollIntoView(); }
  };

  window.printShareInvoice = function(id){
    var i = (db.invoices || []).find(function(x){ return x.id === id; });
    if (!i) { alert('Invoice not found.'); return; }
    var host = document.getElementById('invoicePrintHost');
    if (!host) {
      host = document.createElement('div');
      host.id = 'invoicePrintHost';
      document.body.appendChild(host);
    }
    host.innerHTML = invoiceHtmlV17(i);
    host.style.display = 'block';
    setTimeout(function(){
      window.print();
      setTimeout(function(){ host.style.display='none'; host.innerHTML=''; }, 750);
    }, 100);
  };

  window.emailInvoice = function(id){
    var i = (db.invoices || []).find(function(x){ return x.id === id; });
    if (!i) { alert('Invoice not found.'); return; }
    var cust = invoiceCustomer(i);
    var vehicle = invoiceVehicle(i);
    var settings = db.settings || {};
    var subject = 'Invoice ' + (i.number || '') + ' - ' + (settings.companyName || 'Mechanic Mate');
    var body =
      (settings.companyName || 'Mechanic Mate') + '\n' +
      (settings.companyPhone ? settings.companyPhone + '\n' : '') +
      (settings.companyEmail ? settings.companyEmail + '\n' : '') +
      '\nInvoice: ' + (i.number || '') +
      '\nDate: ' + (i.date || '') +
      '\nBilled to: ' + cust.name +
      (vehicle.reg ? '\nRegistration: ' + vehicle.reg : '') +
      '\nTotal: ' + money(i.total || 0) +
      '\nStatus: ' + (i.paid ? 'PAID' : 'UNPAID');

    window.location.href = 'mailto:' + encodeURIComponent(cust.email || i.email || '') +
      '?subject=' + encodeURIComponent(subject) +
      '&body=' + encodeURIComponent(body);
  };

  save();
  render();
})();
</script>

</body></html>
