      try{ body = await res.json(); }catch(e){}
    }else{
      try{ body = await res.text(); }catch(e){}
    }
    if(!res.ok){
      const msg = body && (body.msg || body.message || body.error_description || body.error) || ('Request failed ('+res.status+')');
      throw new Error(msg);

    return {res, body};

  async function refreshSession(){

    try{
      const result = await supabaseRequest('/auth/v1/token?grant_type=refresh_token',{
        method:'POST',

    }
  }

  async function ensureSession(){
    if(!cloudSession) return null;
    if(sessionExpiresSoon(cloudSession)) return await refreshSession();
    return cloudSession;
  }

  function getUserId(){
    return cloudSession && cloudSession.user && cloudSession.user.id || '';
  }

  function getUserEmail(){
    return cloudSession && cloudSession.user && cloudSession.user.email || '';
  }

  function updateCloudBadge(){
    let badge = document.getElementById('cloudBadge');
    if(!badge){
      const top = document.querySelector('.topbar');
      if(top){
        badge = document.createElement('div');
        badge.id = 'cloudBadge';
        badge.className = 'cloud-badge off';
        top.appendChild(badge);
      }
    }
    if(!badge) return;
    if(!cloudSession){
      badge.className='cloud-badge off';
      badge.textContent='☁️ Local only';
    }else if(cloudError){
      badge.className='cloud-badge warn';
      badge.textContent='☁️ Sync issue';
    }else if(cloudPushBusy || cloudPullBusy){
      badge.className='cloud-badge warn';
      badge.textContent='☁️ Syncing…';
    }else{
      badge.className='cloud-badge ok';
      badge.textContent='☁️ Synced';
    }
  }

  function setCloudState(status,error){
    cloudStatus = status || '';
    cloudError = error || '';
    updateCloudBadge();
    if(page === 'Settings'){
      try{ render(); }catch(e){}
    }
  }

  async function cloudRow(){
    const uid = getUserId();
    if(!uid) return null;
    const result = await supabaseRequest('/rest/v1/mechanic_mate_data?select=data,updated_at&user_id=eq.'+encodeURIComponent(uid),{
      method:'GET',
      headers:{'Accept':'application/json'}
    });
    const rows = Array.isArray(result.body) ? result.body : [];
    return rows[0] || null;
  }

  async function pushCloudNow(){
    if(!cloudSession || cloudPushBusy) return false;
    cloudPushBusy = true;
    updateCloudBadge();
    try{
      const s = await ensureSession();
      if(!s) return false;
      const uid = getUserId();
      if(!uid) return false;
      const now = new Date().toISOString();
      await supabaseRequest('/rest/v1/mechanic_mate_data?on_conflict=user_id',{
        method:'POST',
        headers:{
          'Prefer':'resolution=merge-duplicates,return=minimal'
        },
        body:JSON.stringify({
          user_id:uid,
          data:db,
          updated_at:now
        })
      });
      cloudLastSync = now;
      localStorage.setItem(LOCAL_UPDATED_KEY,now);
      setCloudState('Synced','');
      return true;
    }catch(e){
      console.error('Cloud push failed',e);
      setCloudState('Sync failed',e.message || 'Could not save to cloud');
      return false;
    }finally{
      cloudPushBusy = false;
      updateCloudBadge();
    }
  }

  window.cloudScheduleSave = function(){
    if(!cloudSession) return;
    if(cloudSaveTimer) clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(function(){
      cloudSaveTimer = null;
      pushCloudNow();
    },700);
  };

  async function applyCloudData(row){
    if(!row || !row.data) return false;
    db = normaliseDb(row.data);
    localStorage.setItem(KEY,JSON.stringify(db));
    localStorage.setItem(LOCAL_UPDATED_KEY,row.updated_at || new Date().toISOString());
    cloudLastSync = row.updated_at || '';
    render();
    return true;
  }

  async function pullCloudIfNewer(force){
    if(!cloudSession || cloudPullBusy || cloudPushBusy || cloudSaveTimer) return false;
    cloudPullBusy = true;
    updateCloudBadge();
    try{
      const row = await cloudRow();
      if(!row) return false;
      const localTime = Date.parse(localStorage.getItem(LOCAL_UPDATED_KEY) || '') || 0;
      const cloudTime = Date.parse(row.updated_at || '') || 0;
      if(force || cloudTime > localTime + 500){
        await applyCloudData(row);
      }
      setCloudState('Synced','');
      return true;
    }catch(e){
      console.error('Cloud pull failed',e);
      setCloudState('Sync failed',e.message || 'Could not load cloud data');
      return false;
    }finally{
      cloudPullBusy = false;
      updateCloudBadge();
    }
  }

  async function firstSyncAfterLogin(){
    setCloudState('Checking cloud…','');
    cloudPullBusy = true;
    updateCloudBadge();
    try{
      const row = await cloudRow();
      cloudPullBusy = false;
      if(!row){
        setCloudState('Uploading this device…','');
        await pushCloudNow();
        return;
      }

      const localTime = Date.parse(localStorage.getItem(LOCAL_UPDATED_KEY) || '') || 0;
      const cloudTime = Date.parse(row.updated_at || '') || 0;

      if(!localHasUsefulData()){
        await applyCloudData(row);
        setCloudState('Downloaded cloud data','');
      }else if(!localTime){
        // Pre-v23 device with existing data: cloud wins only if it already clearly has useful data.
        const cloudData = normaliseDb(row.data || {});
        const cloudHasData = !!(
          cloudData.jobs.length || cloudData.customers.length || cloudData.parts.length ||
          cloudData.invoices.length || cloudData.quotes.length || cloudData.settings.companyName || cloudData.settings.companyLogo
        );
        if(cloudHasData){
          const useCloud = confirm(
            'Cloud data already exists for this account.\n\n' +
            'OK = use the cloud copy on this device.\n' +
            'Cancel = upload this device’s current data to the cloud.'
          );
          if(useCloud) await applyCloudData(row);
          else await pushCloudNow();
        }else{
          await pushCloudNow();
        }
      }else if(cloudTime > localTime + 500){
        await applyCloudData(row);
      }else if(localTime > cloudTime + 500){
        await pushCloudNow();
      }

      cloudLastSync = row.updated_at || cloudLastSync;
      setCloudState('Synced','');
    }catch(e){
      cloudPullBusy = false;
      setCloudState('Sync failed',e.message || 'Could not complete first sync');
    }finally{
      updateCloudBadge();
    }
  }

  window.cloudSignIn = async function(){
    const email = String((document.getElementById('cloudEmail')||{}).value || '').trim();
    const password = String((document.getElementById('cloudPassword')||{}).value || '');
    if(!email || !password){ alert('Enter your email and password.'); return; }
    setCloudState('Signing in…','');
    try{
      const result = await supabaseRequest('/auth/v1/token?grant_type=password',{
        method:'POST',
        auth:false,
        body:JSON.stringify({email,password})
      });
      const s = result.body;
      s.obtained_at = Math.floor(Date.now()/1000);
      storeSession(s);
      await firstSyncAfterLogin();
      render();
    }catch(e){
      setCloudState('Sign in failed',e.message || '');
      alert('Sign in failed: ' + (e.message || 'Unknown error'));
    }
  };

  window.cloudSignUp = async function(){
    const email = String((document.getElementById('cloudEmail')||{}).value || '').trim();
    const password = String((document.getElementById('cloudPassword')||{}).value || '');
    if(!email || !password){ alert('Enter an email and password first.'); return; }
    if(password.length < 6){ alert('Use a password of at least 6 characters.'); return; }
    setCloudState('Creating account…','');
    try{
      const result = await supabaseRequest('/auth/v1/signup',{
        method:'POST',
        auth:false,
        body:JSON.stringify({email,password})
      });
      const body = result.body || {};
      if(body.access_token){
        body.obtained_at = Math.floor(Date.now()/1000);
        storeSession(body);
        await firstSyncAfterLogin();
        render();
        alert('Cloud account created and signed in.');
      }else{
        setCloudState('Check your email','');
        alert('Account created. Supabase requires email confirmation for this project, so check your inbox, confirm the address, then come back and tap Sign in.');
      }
    }catch(e){
      setCloudState('Sign up failed',e.message || '');
      alert('Could not create account: ' + (e.message || 'Unknown error'));
    }
  };

  window.cloudSignOut = function(){
    if(!confirm('Sign out of cloud sync on this device? Your local copy will stay on this device.')) return;
    storeSession(null);
    setCloudState('Not signed in','');
    render();
  };

  window.cloudSyncNow = async function(){
    if(!cloudSession){ alert('Sign in first.'); return; }
    if(cloudSaveTimer){
      clearTimeout(cloudSaveTimer);
      cloudSaveTimer = null;
      await pushCloudNow();
    }else{
      await pullCloudIfNewer(true);
    }
    render();
  };

  window.cloudUploadThisDevice = async function(){
    if(!cloudSession){ alert('Sign in first.'); return; }
    if(!confirm('Replace the cloud copy with the data currently on this device?')) return;
    await pushCloudNow();
    render();
  };

  window.cloudDownloadToDevice = async function(){
    if(!cloudSession){ alert('Sign in first.'); return; }
    if(!confirm('Replace this device’s local copy with the cloud copy?')) return;
    await pullCloudIfNewer(true);
    render();
  };

  const previousSettings = settings;
  settings = function(){
    let cloudHtml = '';
    if(cloudSession){
      cloudHtml =
        '<div class="card cloud-card"><b>Cloud sync</b>' +
        '<div class="cloud-status"><div class="cloud-email">☁️ ' + esc(getUserEmail()) + '</div>' +
        '<div class="muted">' + esc(cloudStatus || 'Signed in') +
        (cloudLastSync ? '<br>Last sync: ' + esc(new Date(cloudLastSync).toLocaleString()) : '') +
        (cloudError ? '<br>' + esc(cloudError) : '') + '</div></div>' +
        '<p class="muted">Changes are saved to Supabase automatically and can be opened from your other signed-in devices.</p>' +
        '<div class="actions"><button class="primary" onclick="cloudSyncNow()">Sync now</button>' +
        '<button onclick="cloudDownloadToDevice()">Download cloud copy</button>' +
        '<button onclick="cloudUploadThisDevice()">Upload this device</button>' +
        '<button class="danger" onclick="cloudSignOut()">Sign out</button></div></div>';
    }else{
      cloudHtml =
        '<div class="card cloud-card"><b>Cloud sync</b>' +
        '<p class="muted">Sign in with the same account on your phone and PC to use the same Mechanic Mate data on both.</p>' +
        '<label>Email</label><input id="cloudEmail" type="email" autocomplete="email" placeholder="you@example.com">' +
        '<label>Password</label><input id="cloudPassword" type="password" autocomplete="current-password" placeholder="Password">' +
        '<div class="actions"><button class="primary" onclick="cloudSignIn()">Sign in</button>' +
        '<button onclick="cloudSignUp()">Create cloud account</button></div>' +
        '<div class="cloud-status"><span class="muted">' + esc(cloudStatus) +
        (cloudError ? '<br>' + esc(cloudError) : '') + '</span></div></div>';
    }
    return cloudHtml + previousSettings();
  };

  loadSession();
  updateCloudBadge();

  if(cloudSession){
    ensureSession().then(function(s){
      if(s){
        firstSyncAfterLogin();
      }
    });
  }

  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState === 'visible' && cloudSession) pullCloudIfNewer(false);
  });
  window.addEventListener('focus',function(){
    if(cloudSession) pullCloudIfNewer(false);
  });
  window.addEventListener('online',function(){
    if(cloudSession){
      if(cloudSaveTimer){
        clearTimeout(cloudSaveTimer);
        cloudSaveTimer = null;
        pushCloudNow();
      }else{
        pullCloudIfNewer(false);
      }
    }
  });

  // Gentle periodic check while the app is open.
  setInterval(function(){
    if(cloudSession && document.visibilityState === 'visible') pullCloudIfNewer(false);
  },60000);

  render();
})();
</script>


<script>
(function(){
  // v24 migration: saved parts now represent purchased stock.
  db.parts = (db.parts || []).map(function(p){
    if(p.stockQty == null){
      // Existing parts were previously reusable catalogue entries.
      // Default them to one available item so nothing vanishes during upgrade.
      p.stockQty = 1;
    }
    p.stockQty = Math.max(0, Number(p.stockQty || 0));
    return p;
  });

  db.jobs = (db.jobs || []).map(function(j){
    j.partIds = Array.isArray(j.partIds) ? j.partIds : [];
    j.partQuantities = j.partQuantities && typeof j.partQuantities === 'object' ? j.partQuantities : {};
    return j;
  });

  function allocatedQty(partId){
    return (db.jobs || []).reduce(function(total,j){
      if(!(j.partIds || []).includes(partId)) return total;
      return total + Math.max(0, Number((j.partQuantities || {})[partId] || 0));
    },0);
  }

  function availableQty(part){
    return Math.max(0, Number(part.stockQty || 0) - allocatedQty(part.id));
  }

  window.partAvailableQty = availableQty;

  // Parts tab = unallocated stock only.
  parts = function(){
    var available = (db.parts || []).filter(function(p){ return availableQty(p) > 0; }).slice().reverse();
    return '<div class="row"><div><h2 style="margin-bottom:2px">Parts</h2><div class="muted">Available / unallocated stock</div></div>' +
      '<button class="primary" onclick="partForm()">＋ Add</button></div>' +
      (available.map(function(p){
        var qty = availableQty(p);
        return '<div class="card"><div class="row"><div><b>' + esc(p.name) + '</b>' +
          (p.partNo ? '<div class="muted">Part No: ' + esc(p.partNo) + '</div>' : '') +
          '</div><span class="stock-pill">Available: ' + qty + '</span></div>' +
          '<div class="muted">Cost ' + money(p.cost) + ' • Charge ' + money(p.charge != null ? p.charge : p.cost) +
          (p.supplier ? ' • ' + esc(p.supplier) : '') + '</div>' +
          '<div class="actions"><button onclick="partForm(\'' + p.id + '\')">Edit</button>' +
          '<button class="danger" onclick="deletePart(\'' + p.id + '\')">Delete</button></div></div>';
      }).join('') || '<div class="empty">No unallocated parts. Add purchased parts here and allocate them to jobs as you use them.</div>');
  };

  // Part form now records how many were purchased / stocked.
  partForm = function(id, linkJobId){
    id = id || ''; linkJobId = linkJobId || '';
    var p = (db.parts || []).find(function(x){ return x.id === id; }) || {};
    var existingAllocated = p.id ? allocatedQty(p.id) : 0;
    var stockQty = p.id ? Number(p.stockQty || 0) : 1;
    openModal(id ? 'Edit Part' : 'Add Purchased Part',
      '<label>Part / expense</label><input id="pn" value="' + esc(p.name || '') + '">' +
      '<label>Part No.</label><input id="pno" value="' + esc(p.partNo || '') + '" placeholder="e.g. 038 971 600">' +
      '<label>Quantity purchased / total stock</label><input id="pstock" type="number" min="' + existingAllocated + '" step="1" value="' + stockQty + '">' +
      (existingAllocated ? '<div class="muted" style="margin-top:-6px;margin-bottom:10px">' + existingAllocated + ' already allocated to jobs, so total stock cannot be set below that.</div>' : '') +
      '<div class="two"><div><label>Your cost (£ each)</label><input id="pc" type="number" min="0" step="0.01" value="' + Number(p.cost || 0) + '"></div>' +
      '<div><label>Customer charge (£ each)</label><input id="pch" type="number" min="0" step="0.01" value="' + Number(p.charge != null ? p.charge : p.cost || 0) + '"></div></div>' +
      '<label>Supplier</label><input id="ps" value="' + esc(p.supplier || '') + '">' +
      (linkJobId ? '<label>Quantity to allocate to this job</label><input id="pqty" type="number" min="1" step="1" value="1">' : '') +
      '<button class="primary" onclick="savePartV24(\'' + id + '\',\'' + linkJobId + '\')">Save' + (linkJobId ? ' & allocate' : '') + '</button>'
    );
  };

  window.savePartV24 = function(id, linkJobId){
    var old = (db.parts || []).find(function(y){ return y.id === id; }) || {};
    var existingAllocated = old.id ? allocatedQty(old.id) : 0;
    var requestedStock = Math.max(existingAllocated, Number(pstock.value || 0));
    var x = {
      ...old,
      id: id || gid(),
      name: pn.value,
      partNo: pno.value,
      stockQty: requestedStock,
      cost: Number(pc.value || 0),
      charge: Number(pch.value || 0),
      supplier: ps.value
    };
    var idx = db.parts.findIndex(function(y){ return y.id === x.id; });
    if(idx < 0) db.parts.push(x); else db.parts[idx] = x;

    if(linkJobId){
      var j = db.jobs.find(function(y){ return y.id === linkJobId; });
      if(j){
        j.partIds = Array.isArray(j.partIds) ? j.partIds : [];
        j.partQuantities = j.partQuantities || {};
        var qty = Math.max(1,Number((document.getElementById('pqty')||{}).value || 1));
        // New manual part must contain enough stock for what is being allocated.
        if(Number(x.stockQty || 0) < qty) x.stockQty = qty;
        if(!j.partIds.includes(x.id)) j.partIds.push(x.id);
        j.partQuantities[x.id] = qty;
      }
    }
    save(); closeM(); render();
  };

  // Job allocation menu only offers available stock plus parts already on this job.
  jobPartsMenu = function(jobId){
    var j = (db.jobs || []).find(function(x){ return x.id === jobId; });
    if(!j) return;
    var linked = new Set(j.partIds || []);
    var q = j.partQuantities || {};
    var candidates = (db.parts || []).filter(function(p){
      return availableQty(p) > 0 || linked.has(p.id);
    });

    var body = '<p class="muted">' + esc(jobLabel(j)) + '</p><div class="card"><b>Allocate parts from stock</b>' +
      '<p class="muted">Parts allocated here disappear from the Parts tab. Remove or reduce them and the quantity becomes available again.</p>';

    if(candidates.length){
      body += candidates.map(function(p){
        var checked = linked.has(p.id);
        var current = Math.max(0,Number(q[p.id] || 0));
        // Available to this job includes its own current allocation.
        var maxForJob = availableQty(p) + current;
        return '<div style="display:grid;grid-template-columns:28px 1fr 76px;gap:9px;align-items:center;padding:10px 0;border-top:1px solid var(--line)">' +
          '<input type="checkbox" class="jobPartCheck" value="' + p.id + '" ' + (checked ? 'checked' : '') + ' style="width:22px;height:22px;margin:0">' +
          '<div><b>' + esc(p.name) + '</b>' +
          (p.partNo ? '<br><span class="muted">Part No: ' + esc(p.partNo) + '</span>' : '') +
          '<br><span class="muted">Available: ' + maxForJob + ' • Each ' + money(p.charge != null ? p.charge : p.cost) + '</span></div>' +
          '<div><label>Qty</label><input class="jobPartQty qty-input" data-part-id="' + p.id + '" data-max="' + maxForJob + '" type="number" min="1" max="' + maxForJob + '" step="1" value="' + (current || 1) + '"></div></div>';
      }).join('');
    }else{
      body += '<div class="empty">No unallocated parts available.</div>';
    }

    body += '<button class="primary" style="width:100%;margin-top:10px" onclick="saveJobPartSelectionV24(\'' + jobId + '\')">Save allocation</button></div>' +
      '<button style="width:100%;margin-top:10px" onclick="partForm(\'\',\'' + jobId + '\')">＋ Add a newly purchased part</button>';
    openModal('Parts for this job',body);
  };

  window.saveJobPartSelectionV24 = function(jobId){
    var j = (db.jobs || []).find(function(x){ return x.id === jobId; });
    if(!j) return;
    var checks = Array.from(document.querySelectorAll('.jobPartCheck:checked'));
    var newIds = [];
    var newQ = {};

    for(var i=0;i<checks.length;i++){
      var ch = checks[i];
      var inp = document.querySelector('.jobPartQty[data-part-id="' + ch.value + '"]');
      var max = Math.max(0,Number(inp && inp.dataset.max || 0));
      var qty = Math.max(1,Number(inp && inp.value || 1));
      if(qty > max){
        var part = db.parts.find(function(p){ return p.id === ch.value; });
        alert((part ? part.name : 'Part') + ': only ' + max + ' available for this job.');
        return;
      }
      newIds.push(ch.value);
      newQ[ch.value] = qty;
    }

    j.partIds = newIds;
    j.partQuantities = newQ;
    save(); closeM(); render();
  };

  // Customer list gains a View button.
  customers = function(){
    return '<div class="row"><h2>Customers</h2><button class="primary" onclick="customerForm()">＋ Add</button></div>' +
      ((db.customers || []).map(function(c){
        var vehicle = [c.make,c.model].filter(Boolean).join(' ');
        var detail = [c.engineSize,c.reg || c.vehicle].filter(Boolean).join(' • ');
        var fullVehicle = [vehicle,detail].filter(Boolean).join(' — ');
        var count = (db.jobs || []).filter(function(j){ return j.customer === c.name; }).length;
        return '<div class="card"><div class="row"><b>' + esc(c.name) + '</b><span class="stock-pill">' + count + ' job' + (count===1?'':'s') + '</span></div>' +
          '<div class="muted">' + (c.phone ? esc(c.phone) : '') + (c.email ? '<br>' + esc(c.email) : '') +
          (fullVehicle ? '<br><b>Vehicle:</b> ' + esc(fullVehicle) : '') + '</div>' +
          '<div class="actions"><button class="primary" onclick="viewCustomerV24(\'' + c.id + '\')">View</button>' +
          '<button onclick="customerForm(\'' + c.id + '\')">Edit</button>' +
          '<button class="danger" onclick="del(\'customers\',\'' + c.id + '\')">Delete</button></div></div>';
      }).join('') || '<div class="empty">No customers.</div>');
  };

  function jobInvoice(jobId){
    return (db.invoices || []).slice().reverse().find(function(i){ return i.jobId === jobId; }) || null;
  }

  window.viewCustomerV24 = function(customerId){
    var c = (db.customers || []).find(function(x){ return x.id === customerId; });
    if(!c) return;

    var jobs = (db.jobs || []).filter(function(j){ return j.customer === c.name; }).slice().sort(function(a,b){
      return String(b.date || '').localeCompare(String(a.date || ''));
    });

    // Group job history by registration. Current customer vehicle is included even with no jobs.
    var regs = {};
    jobs.forEach(function(j){
      var key = (j.reg || c.reg || c.vehicle || 'No registration').toUpperCase();
      if(!regs[key]) regs[key] = [];
      regs[key].push(j);
    });
    var currentReg = (c.reg || c.vehicle || '').toUpperCase();
    if(currentReg && !regs[currentReg]) regs[currentReg] = [];

    var contact = '<div class="card"><div class="customer-summary"><div><b>' + esc(c.name) + '</b>' +
      (c.phone ? '<div class="muted">' + esc(c.phone) + '</div>' : '') +
      (c.email ? '<div class="muted">' + esc(c.email) + '</div>' : '') +
      (c.address ? '<div class="muted">' + esc(c.address).replace(/\n/g,'<br>') + '</div>' : '') +
      '</div><div><b>Saved vehicle</b><div class="muted">' +
      esc([c.make,c.model,c.engineSize].filter(Boolean).join(' ')) +
      ((c.reg || c.vehicle) ? '<br>' + esc(c.reg || c.vehicle) : '') +
      '</div></div></div></div>';

    var history = Object.keys(regs).map(function(reg){
      var list = regs[reg];
      var exemplar = list[0] || {};
      var vehicleDesc = [exemplar.make || c.make, exemplar.model || c.model, exemplar.engineSize || c.engineSize].filter(Boolean).join(' ');
      return '<div class="vehicle-card"><div class="row"><div><b>' + esc(reg) + '</b>' +
        (vehicleDesc ? '<div class="muted">' + esc(vehicleDesc) + '</div>' : '') +
        '</div><span class="stock-pill">' + list.length + ' job' + (list.length===1?'':'s') + '</span></div>' +
        (list.map(function(j){
          var inv = jobInvoice(j.id);
          var partLines = typeof window.jobPartLines === 'function' ? window.jobPartLines(j) : [];
          var partsText = partLines.length ? partLines.map(function(x){ return x.name + ' × ' + x.qty; }).join(', ') : 'No parts';
          return '<div class="history-job"><div class="row"><div><div class="history-title">' + esc(j.title || 'Job') + '</div>' +
            '<div class="muted">' + esc(j.date || '') + ' • ' + esc(j.status || '') + '</div></div>' +
            (inv ? '<span class="stock-pill">' + (inv.paid ? 'Paid' : 'Unpaid') + ' • ' + money(inv.total || 0) + '</span>' : '') +
            '</div><div class="muted">Time: ' + Number(j.hours || 0) + 'h<br>Parts: ' + esc(partsText) + '</div>' +
            '<div class="actions"><button onclick="closeM();jobForm(\'' + j.id + '\')">View / Edit Job</button>' +
            (inv ? '<button onclick="closeM();setPage(\'Invoices\');setTimeout(function(){viewInvoice(\'' + inv.id + '\')},50)">View Invoice</button>' : '') +
            '</div></div>';
        }).join('') || '<div class="empty">No jobs recorded for this vehicle yet.</div>') +
        '</div>';
    }).join('');

    openModal('Customer History', contact +
      '<div class="row"><h3>Job History</h3><span class="muted">' + jobs.length + ' total</span></div>' +
      (history || '<div class="empty">No previous jobs for this customer.</div>'));
  };

  save();
  render();
})();
</script>


<script>
(function(){
  // v28 fix: stock helpers must exist inside this update's scope.
  function allocatedQtyV28(partId){
    return (db.jobs || []).reduce(function(total,j){
      if(!(j.partIds || []).includes(partId)) return total;
      return total + Math.max(0,Number((j.partQuantities || {})[partId] || 0));
    },0);
  }

  function availableQtyV28(part){
    return Math.max(0,Number(part.stockQty || 0) - allocatedQtyV28(part.id));
  }

  // ---------- migration ----------
  db.parts = (db.parts || []).map(function(p){
    if(!Array.isArray(p.includedParts)) p.includedParts = [];
    p.includedParts = p.includedParts.map(function(x){
      return {
        name:String((x && x.name) || ''),
        partNo:String((x && x.partNo) || ''),
        qty:Math.max(1,Number((x && x.qty) || 1))
      };
    });
    return p;
  });

  function incRowsHtml(items){
    items = Array.isArray(items) ? items : [];
    if(!items.length) items = [{name:'',partNo:'',qty:1}];
    return items.map(function(x,idx){
      return '<div class="included-row">' +
        '<div><label>Included part</label><input class="inc-name" value="' + esc(x.name||'') + '" placeholder="e.g. Oil filter"></div>' +
        '<div><label>Part No. (optional)</label><input class="inc-partno" value="' + esc(x.partNo||'') + '" placeholder="Optional"></div>' +
        '<div class="inc-qty"><label>Qty</label><input class="inc-qty-input" type="number" min="1" step="1" value="' + Math.max(1,Number(x.qty||1)) + '"></div>' +
        '<div class="inc-remove"><button type="button" class="danger" style="width:44px;padding:10px 0" onclick="removeIncludedRow(this)">×</button></div>' +
      '</div>';
    }).join('');
  }

  window.addIncludedRow = function(){
    var host=document.getElementById('includedPartsRows');
    if(!host)return;
    host.insertAdjacentHTML('beforeend',incRowsHtml([{name:'',partNo:'',qty:1}]));
  };

  window.removeIncludedRow = function(btn){
    var row=btn.closest('.included-row');
    if(row) row.remove();
  };

  function readIncludedParts(){
    return Array.from(document.querySelectorAll('#includedPartsRows .included-row')).map(function(row){
      var name=(row.querySelector('.inc-name')||{}).value||'';
      var partNo=(row.querySelector('.inc-partno')||{}).value||'';
      var qty=Math.max(1,Number((row.querySelector('.inc-qty-input')||{}).value||1));
      return {name:name.trim(),partNo:partNo.trim(),qty:qty};
    }).filter(function(x){return x.name;});
  }

  function includedSummary(p){
    var inc=Array.isArray(p.includedParts)?p.includedParts:[];
    if(!inc.length)return '';
    return '<div class="included-wrap"><b>Included parts</b><ul class="included-list">' +
      inc.map(function(x){
        return '<li>' + esc(x.name) +
          (x.partNo?' <span class="muted">(' + esc(x.partNo) + ')</span>':'') +
          (Number(x.qty||1)>1?' × '+Number(x.qty||1):'') +
        '</li>';
      }).join('') + '</ul></div>';
  }

  // ---------- part form / stock ----------
  partForm = function(id, linkJobId){
    id=id||''; linkJobId=linkJobId||'';
    var p=(db.parts||[]).find(function(x){return x.id===id;})||{};
    var existingAllocated=p.id?allocatedQtyV28(p.id):0;
    var stockQty=p.id?Number(p.stockQty||0):1;
    openModal(id?'Edit Part':'Add Purchased Part',
      '<label>Part / expense</label><input id="pn" value="' + esc(p.name||'') + '">' +
      '<label>Part No.</label><input id="pno" value="' + esc(p.partNo||'') + '" placeholder="e.g. SERVICE-KIT-01">' +
      '<label>Quantity purchased / total stock</label><input id="pstock" type="number" min="' + existingAllocated + '" step="1" value="' + stockQty + '">' +
      (existingAllocated?'<div class="muted" style="margin-top:-6px;margin-bottom:10px">'+existingAllocated+' already allocated to jobs.</div>':'') +
      '<div class="two"><div><label>Your cost (£ each)</label><input id="pc" type="number" min="0" step="0.01" value="' + Number(p.cost||0) + '"></div>' +
      '<div><label>Customer charge (£ each)</label><input id="pch" type="number" min="0" step="0.01" value="' + Number(p.charge!=null?p.charge:p.cost||0) + '"></div></div>' +
      '<label>Supplier</label><input id="ps" value="' + esc(p.supplier||'') + '">' +
      '<div class="included-wrap"><div class="row"><div><b>Included parts</b><div class="muted">Optional — useful for service kits, bundles, etc.</div></div>' +
      '<button type="button" onclick="addIncludedRow()">＋ Add item</button></div>' +
      '<div id="includedPartsRows">' + incRowsHtml(p.includedParts||[]) + '</div></div>' +
      (linkJobId?'<label>Quantity to allocate to this job</label><input id="pqty" type="number" min="1" step="1" value="1">':'') +
      '<button class="primary" onclick="savePartV27(\''+id+'\',\''+linkJobId+'\')">Save'+(linkJobId?' & allocate':'')+'</button>'
    );
  };

  window.savePartV27=function(id,linkJobId){
    var old=(db.parts||[]).find(function(y){return y.id===id;})||{};
    var existingAllocated=old.id?allocatedQtyV28(old.id):0;
    var requestedStock=Math.max(existingAllocated,Number(pstock.value||0));
    var x={
      ...old,
      id:id||gid(),
      name:pn.value,
      partNo:pno.value,
      stockQty:requestedStock,
      cost:Number(pc.value||0),
      charge:Number(pch.value||0),
      supplier:ps.value,
      includedParts:readIncludedParts()
    };
    var idx=db.parts.findIndex(function(y){return y.id===x.id;});
    if(idx<0)db.parts.push(x); else db.parts[idx]=x;

    if(linkJobId){
      var j=db.jobs.find(function(y){return y.id===linkJobId;});
      if(j){
        j.partIds=Array.isArray(j.partIds)?j.partIds:[];
        j.partQuantities=j.partQuantities||{};
        var qty=Math.max(1,Number((document.getElementById('pqty')||{}).value||1));
        if(Number(x.stockQty||0)<qty)x.stockQty=qty;
        if(!j.partIds.includes(x.id))j.partIds.push(x.id);
        j.partQuantities[x.id]=qty;
      }
    }
    save();closeM();render();
  };

  parts=function(){
    var available=(db.parts||[]).filter(function(p){return availableQtyV28(p)>0;}).slice().reverse();
    return '<div class="row"><div><h2 style="margin-bottom:2px">Parts</h2><div class="muted">Available / unallocated stock</div></div><button class="primary" onclick="partForm()">＋ Add</button></div>' +
      (available.map(function(p){
        var qty=availableQtyV28(p);
        return '<div class="card"><div class="row"><div><b>'+esc(p.name)+'</b>' +
          (p.partNo?'<div class="muted">Part No: '+esc(p.partNo)+'</div>':'') +
          '</div><span class="stock-pill">Available: '+qty+'</span></div>' +
          '<div class="muted">Cost '+money(p.cost)+' • Charge '+money(p.charge!=null?p.charge:p.cost)+(p.supplier?' • '+esc(p.supplier):'')+'</div>' +
          includedSummary(p) +
          '<div class="actions"><button onclick="partForm(\''+p.id+'\')">Edit</button><button class="danger" onclick="deletePart(\''+p.id+'\')">Delete</button></div></div>';
      }).join('')||'<div class="empty">No unallocated parts.</div>');
  };

  // ---------- job/invoice snapshots ----------
  jobPartLines=function(j){
    if(!j)return[];
    return (j.partIds||[]).map(function(id){
      var part=(db.parts||[]).find(function(p){return p.id===id;});
      if(!part)return null;
      var qty=Number((j.partQuantities||{})[id]||1);
      if(!Number.isFinite(qty)||qty<=0)qty=1;
      var unit=Number(part.charge!=null?part.charge:part.cost||0);
      return {
        partId:part.id,
        name:part.name||'Part',
        partNo:part.partNo||'',
        includedParts:(part.includedParts||[]).map(function(x){return {...x};}),
        qty:qty,
        unitPrice:unit,
        total:qty*unit,
        cost:Number(part.cost||0),
        supplier:part.supplier||''
      };
    }).filter(Boolean);
  };
  window.jobPartLines=jobPartLines;

  invoicePartSnapshot=function(j){
    return jobPartLines(j).map(function(line){
      return {
        partId:line.partId,
        name:line.name,
        partNo:line.partNo||'',
        includedParts:(line.includedParts||[]).map(function(x){return {...x};}),
        qty:line.qty,
        unitPrice:line.unitPrice,
        total:line.total
      };
    });
  };

  // Override invoice save so the included-items list is snapshotted at billing time.
  saveInvoice=function(){
    recalcInvoiceLabour();
    var jobId=ivjob.value||'';
    var j=db.jobs.find(function(x){return x.id===jobId;})||null;
    var c=(db.customers||[]).find(function(x){return x.name===ivc.value;})||{};
    var partLines=invoicePartSnapshot(j);
    var partTotal=partLines.reduce(function(a,x){return a+Number(x.total||0);},0);
    ivp.value=partTotal.toFixed(2);
    var total=Number(ivl.value||0)+partTotal+Number(ivt.value||0)+Number(ivo.value||0);
    db.invoices.push({
      id:gid(),number:ivn.value,customer:ivc.value,customerId:c.id||'',email:ive.value,
      billedTo:{name:ivc.value,phone:c.phone||'',email:ive.value||c.email||'',address:c.address||''},
      date:ivd.value,jobId:jobId,hours:Number(ivhours.value||0),labour:Number(ivl.value||0),
      partLines:partLines,parts:partTotal,travel:Number(ivt.value||0),other:Number(ivo.value||0),
      total:total,paid:false
    });
    if(j)j.hours=Number(ivhours.value||0);
    syncJobPaymentStatus(jobId);
    save();closeM();render();
  };

  // ---------- on-screen / print invoice ----------
  function v27InvoiceLines(i){
    if(Array.isArray(i.partLines)&&i.partLines.length){
      return i.partLines.map(function(line){
        var current=(db.parts||[]).find(function(p){return p.id===line.partId;})||{};
        return {
          ...line,
          partNo:line.partNo||current.partNo||'',
          includedParts:Array.isArray(line.includedParts)?line.includedParts:(current.includedParts||[])
        };
      });
    }
    var j=(db.jobs||[]).find(function(x){return x.id===i.jobId;});
    return j?invoicePartSnapshot(j):[];
  }

  function v27Customer(i){
    var billed=i.billedTo||{},c=(db.customers||[]).find(function(x){return x.name===i.customer;})||{};
    return {name:billed.name||i.customer||c.name||'',phone:billed.phone||c.phone||'',email:billed.email||i.email||c.email||'',address:billed.address||c.address||''};
  }
  function v27Vehicle(i){
    var j=(db.jobs||[]).find(function(x){return x.id===i.jobId;})||{},snap=i.deletedJobSnapshot||{},c=(db.customers||[]).find(function(x){return x.name===i.customer;})||{};
    return {reg:j.reg||snap.reg||c.reg||c.vehicle||'',make:j.make||snap.make||c.make||'',model:j.model||snap.model||c.model||'',engineSize:j.engineSize||snap.engineSize||c.engineSize||'',title:j.title||snap.title||''};
  }

  function invoiceHtmlV27(i){
    var s=db.settings||{},company=s.companyName||'Mechanic Mate',logo=s.companyLogo||'',cust=v27Customer(i),vehicle=v27Vehicle(i),lines=v27InvoiceLines(i);
    var partsSubtotal=lines.reduce(function(a,x){return a+Number(x.total||0);},0);
    if(!partsSubtotal&&Number(i.parts||0))partsSubtotal=Number(i.parts||0);

    var rows=lines.map(function(line){
      var qty=Number(line.qty||1),unit=Number(line.unitPrice||0),total=Number(line.total||qty*unit);
      var main='<tr><td><b>'+esc(line.name||'Part')+'</b></td><td>'+esc(line.partNo||'')+'</td><td>'+qty+'</td><td>'+money(unit)+'</td><td>'+money(total)+'</td></tr>';
      var subs=(line.includedParts||[]).map(function(x){
        return '<tr class="invoice-subpart"><td>↳ '+esc(x.name||'')+'</td><td>'+esc(x.partNo||'')+'</td><td>'+Math.max(1,Number(x.qty||1))+'</td><td></td><td></td></tr>';
      }).join('');
      return main+subs;
    }).join('');

    if(!rows&&partsSubtotal)rows='<tr><td>Parts</td><td></td><td>1</td><td>'+money(partsSubtotal)+'</td><td>'+money(partsSubtotal)+'</td></tr>';
    var contact=[s.companyPhone,s.companyEmail].filter(Boolean).map(esc).join('<br>');
    var vb=[vehicle.make,vehicle.model,vehicle.engineSize].filter(Boolean).map(esc).join(' • ');

    return '<div class="inline-invoice"><div class="inv-head"><div>' +
      (logo?'<img class="inv-logo" src="'+logo+'" alt="Company logo">':'') +
      '<div style="font-weight:900;font-size:20px">'+esc(company)+'</div>'+(contact?'<div class="invoice-contact">'+contact+'</div>':'') +
      '</div><div style="text-align:right"><div class="inv-title">INVOICE</div><div class="inv-meta">'+esc(i.number||'')+'<br>'+esc(i.date||'')+'</div><div style="margin-top:7px;font-weight:900">'+(i.paid?'PAID':'UNPAID')+'</div></div></div>' +
      '<div class="bill-grid"><div class="bill-box"><b>BILLED TO</b><br>'+esc(cust.name)+(cust.address?'<br>'+esc(cust.address).replace(/\n/g,'<br>'):'')+(cust.phone?'<br>'+esc(cust.phone):'')+(cust.email?'<br>'+esc(cust.email):'')+'</div>' +
      '<div class="bill-box"><b>VEHICLE / JOB</b><br>'+(vehicle.reg?'Registration: '+esc(vehicle.reg)+'<br>':'')+(vb?vb+'<br>':'')+(vehicle.title?'Job: '+esc(vehicle.title):'')+'</div></div>' +
      (Number(i.labour||0)?'<table><tbody><tr><td><b>Labour</b>'+(i.hours?' — '+esc(i.hours)+' hours @ '+money(db.settings.hourlyRate||0)+'/hr':'')+'</td><td style="text-align:right"><b>'+money(i.labour)+'</b></td></tr></tbody></table>':'') +
      (rows?'<div style="margin-top:18px;font-weight:900">PARTS USED</div><table class="parts-table parts-table-v20"><thead><tr><th>Part</th><th>Part No.</th><th>Qty</th><th>Each</th><th>Total</th></tr></thead><tbody>'+rows+'<tr class="parts-subtotal"><td colspan="4">Parts subtotal</td><td>'+money(partsSubtotal)+'</td></tr></tbody></table>':'') +
      ((Number(i.travel||0)||Number(i.other||0))?'<table><tbody>'+(Number(i.travel||0)?'<tr><td>Travel / call-out</td><td>'+money(i.travel)+'</td></tr>':'')+(Number(i.other||0)?'<tr><td>Other</td><td>'+money(i.other)+'</td></tr>':'')+'</tbody></table>':'') +
      '<div class="inv-total">Total: '+money(i.total)+'</div></div>';
  }

  window.viewInvoice=function(id,button){
    var i=(db.invoices||[]).find(function(x){return x.id===id;});
    if(!i){alert('Invoice not found.');return;}
    if(window.closeInlineInvoice)closeInlineInvoice();
    var host=document.createElement('div');host.id='inlineInvoicePreview';
    var actions=document.createElement('div');actions.className='inline-actions';
    var closeBtn=document.createElement('button');closeBtn.className='secondary';closeBtn.textContent='Close invoice';closeBtn.addEventListener('click',function(){closeInlineInvoice();});
    var printBtn=document.createElement('button');printBtn.textContent='Print / Save PDF';printBtn.addEventListener('click',function(){printShareInvoice(id);});
    var emailBtn=document.createElement('button');emailBtn.textContent='Email PDF';emailBtn.addEventListener('click',function(){emailInvoice(id);});
    actions.append(closeBtn,printBtn,emailBtn);
    var content=document.createElement('div');content.innerHTML=invoiceHtmlV27(i);
    host.append(actions,content);
    var card=button&&button.closest?button.closest('.card'):null;
    (card||document.getElementById('app')).appendChild(host);
    try{host.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){host.scrollIntoView();}
  };

  window.printShareInvoice=function(id){
    var i=(db.invoices||[]).find(function(x){return x.id===id;});
    if(!i){alert('Invoice not found.');return;}
    var host=document.getElementById('invoicePrintHost');
    if(!host){host=document.createElement('div');host.id='invoicePrintHost';document.body.appendChild(host);}
    host.innerHTML=invoiceHtmlV27(i);host.style.display='block';
    setTimeout(function(){window.print();setTimeout(function(){host.style.display='none';host.innerHTML='';},750);},100);
  };

  save();
  render();
})();
</script>


<script>
(function(){
  db.quotes = Array.isArray(db.quotes) ? db.quotes : [];

  function quoteCustomer(name){
    return (db.customers||[]).find(function(c){return c.name===name;}) || {};
  }
  function quoteMoney(v){ return money(Number(v)||0); }
  function quoteNo(){
    var nums=(db.quotes||[]).map(function(q){
      var m=String(q.number||'').match(/(\d+)$/); return m?Number(m[1]):0;
    });
    return 'QUO-'+String((Math.max.apply(null,[0].concat(nums))+1)).padStart(4,'0');
  }
  function quoteTotal(q){
    var labour=Number(q.labourHours||0)*Number(q.labourRate||0);
    var parts=(q.partLines||[]).reduce(function(a,p){return a+Number(p.total!=null?p.total:(Number(p.qty||1)*Number(p.unitPrice||0)));},0);
    return labour+parts+Number(q.travel||0)+Number(q.other||0);
  }
  function quoteStatusClass(s){return String(s||'Draft').toLowerCase().replace(/\s+/g,'-');}
  function quotePartsSummary(q){
    return (q.partLines||[]).map(function(p){return (p.name||'Part')+' × '+Number(p.qty||1);}).join(', ');
  }

  // ----- form rows -----
  function workRows(items){
    items=Array.isArray(items)&&items.length?items:[{description:''}];
    return items.map(function(x){
      return '<div class="quote-work-row"><div><label>Work required</label><input class="qw-desc" value="'+esc(x.description||'')+'" placeholder="e.g. Replace front brake pads"></div>'+
        '<button type="button" class="danger" onclick="this.closest(\'.quote-work-row\').remove()">×</button></div>';
    }).join('');
  }
  function partRows(items){
    items=Array.isArray(items)?items:[];
    if(!items.length) items=[{name:'',partNo:'',supplier:'',qty:1,unitPrice:0}];
    var stockOptions='<option value="">— Saved stock (optional) —</option>'+
      (db.parts||[]).map(function(p){
        return '<option value="'+p.id+'">'+esc(p.name)+(p.partNo?' • '+esc(p.partNo):'')+'</option>';
      }).join('');
    return items.map(function(x){
      return '<div class="quote-part-row">'+
        '<div class="qp-name"><label>Part / kit</label><input class="qp-name-input" value="'+esc(x.name||'')+'" placeholder="Part description">'+
        '<select class="qp-stock" onchange="quoteFillPartFromStock(this)" style="margin-top:6px">'+stockOptions+'</select></div>'+
        '<div><label>Part No.</label><input class="qp-partno" value="'+esc(x.partNo||'')+'"></div>'+
        '<div><label>Supplier</label><input class="qp-supplier" value="'+esc(x.supplier||'')+'" placeholder="e.g. Euro Car Parts"></div>'+
        '<div><label>Qty</label><input class="qp-qty" type="number" min="1" step="1" value="'+Math.max(1,Number(x.qty||1))+'" oninput="quoteRecalc()"></div>'+
        '<div><label>Price each (£)</label><input class="qp-price" type="number" min="0" step="0.01" value="'+Number(x.unitPrice||0)+'" oninput="quoteRecalc()"></div>'+
        '<div class="qp-remove"><button type="button" class="danger" onclick="this.closest(\'.quote-part-row\').remove();quoteRecalc()">×</button></div>'+
      '</div>';
    }).join('');
  }
  window.quoteAddWork=function(){
    var h=document.getElementById('quoteWorkRows');if(h)h.insertAdjacentHTML('beforeend',workRows([{description:''}]));
  };
  window.quoteAddPart=function(){
    var h=document.getElementById('quotePartRows');if(h)h.insertAdjacentHTML('beforeend',partRows([{name:'',partNo:'',supplier:'',qty:1,unitPrice:0}]));
  };
  window.quoteFillPartFromStock=function(sel){
    var p=(db.parts||[]).find(function(x){return x.id===sel.value;});
    if(!p)return;
    var r=sel.closest('.quote-part-row');
    r.querySelector('.qp-name-input').value=p.name||'';
    r.querySelector('.qp-partno').value=p.partNo||'';
    var sup=r.querySelector('.qp-supplier'); if(sup) sup.value=p.supplier||'';
    r.querySelector('.qp-price').value=Number(p.charge!=null?p.charge:p.cost||0).toFixed(2);
    quoteRecalc();
  };
  function readQuoteWork(){
    return Array.from(document.querySelectorAll('#quoteWorkRows .quote-work-row')).map(function(r){
      return {description:String((r.querySelector('.qw-desc')||{}).value||'').trim()};
    }).filter(function(x){return x.description;});
  }
  function readQuoteParts(){
    return Array.from(document.querySelectorAll('#quotePartRows .quote-part-row')).map(function(r){
      var name=String((r.querySelector('.qp-name-input')||{}).value||'').trim();
      var partNo=String((r.querySelector('.qp-partno')||{}).value||'').trim();
      var supplier=String((r.querySelector('.qp-supplier')||{}).value||'').trim();
      var qty=Math.max(1,Number((r.querySelector('.qp-qty')||{}).value||1));
      var unit=Number((r.querySelector('.qp-price')||{}).value||0);
      return {name:name,partNo:partNo,supplier:supplier,qty:qty,unitPrice:unit,total:qty*unit};
    }).filter(function(x){return x.name;});
  }
  window.quoteRecalc=function(){
    var h=Number((document.getElementById('qhours')||{}).value||0);
    var r=Number((document.getElementById('qrate')||{}).value||0);
    var parts=readQuoteParts().reduce(function(a,p){return a+p.total;},0);
    var travel=Number((document.getElementById('qtravel')||{}).value||0);
    var other=Number((document.getElementById('qother')||{}).value||0);
    var el=document.getElementById('qtotal');
    if(el)el.textContent=quoteMoney(h*r+parts+travel+other);
  };
  window.quoteFillCustomer=function(name){
    var c=quoteCustomer(name);
    var n=document.getElementById('qcustomer');if(n)n.value=name||'';
    var e=document.getElementById('qemail');if(e)e.value=c.email||'';
    var r=document.getElementById('qreg');if(r)r.value=c.reg||c.vehicle||'';
    var ma=document.getElementById('qmake');if(ma)ma.value=c.make||'';
    var mo=document.getElementById('qmodel');if(mo)mo.value=c.model||'';

  // ----- simple downloadable/shareable quote PDF -----
  function pdfEsc(s){
    return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/£/g,'\\243').replace(/[–—]/g,'-').replace(/[^\x20-\x7E\\]/g,'');
  }
  function wrapTxt(t,n){
    var out=[],line='';String(t||'').split(/\s+/).forEach(function(w){var x=line?line+' '+w:w;if(x.length>n&&line){out.push(line);line=w}else line=x});if(line)out.push(line);return out;
  }
  function quotePdfBlob(q){
    var s=db.settings||{},left=46,right=549,y=790,cmd=[];
    function text(x,yy,size,v,b){cmd.push('BT /'+(b?'F2':'F1')+' '+size+' Tf 1 0 0 1 '+x+' '+yy+' Tm ('+pdfEsc(v)+') Tj ET')}
    function rt(yy,size,v,b){var a=String(v||'').length*size*.52;text(Math.max(left,right-a),yy,size,v,b)}
    function line(){cmd.push('0.6 w '+left+' '+y+' m '+right+' '+y+' l S')}
    function ensure(n){if(y-n<55){/* one-page quote fallback: compact */}}
    function wrap(v,size,max,b){wrapTxt(v,max).forEach(function(x){text(left,y,size,x,b);y-=size+4})}
    text(left,y,20,s.companyName||'Mechanic Mate',true);rt(y,25,'QUOTATION',true);y-=26;
    if(s.companyPhone){text(left,y,9,s.companyPhone,false);y-=13}
    if(s.companyEmail){text(left,y,9,s.companyEmail,false);y-=13}
    rt(756,11,q.number||'',true);rt(739,10,q.date||'',false);rt(720,10,q.status||'Draft',true);
    y=695;line();y-=24;
    text(left,y,12,'QUOTED TO',true);y-=18;wrap(q.customer||'',10,55,false);
    var c=quoteCustomer(q.customer||'');if(c.address){String(c.address).split(/\n/).forEach(function(a){wrap(a,9,62,false)})}
    if(q.email||c.email){wrap(q.email||c.email,9,62,false)}
    y-=5;line();y-=24;
    text(left,y,12,'VEHICLE / WORK',true);y-=18;
    if(q.reg){text(left,y,10,'Registration: '+q.reg,false);y-=15}
    var vd=[q.make,q.model,q.engineSize].filter(Boolean).join(' ');if(vd)wrap(vd,10,58,false);
    if(q.title){wrap(q.title,11,55,true);y-=3}
    if((q.workItems||[]).length){text(left,y,11,'Work required',true);y-=16;(q.workItems||[]).forEach(function(w){wrap('- '+w.description,9,65,false)})}
    var lab=Number(q.labourHours||0)*Number(q.labourRate||0);
    if(lab){y-=5;text(left,y,10,'Estimated labour: '+q.labourHours+'h @ '+quoteMoney(q.labourRate)+'/hr',true);rt(y,10,quoteMoney(lab),true);y-=22}
    if((q.partLines||[]).length){text(left,y,11,'Parts',true);y-=18;(q.partLines||[]).forEach(function(p){wrap((p.name||'Part')+(p.partNo?' ['+p.partNo+']':'')+(p.supplier?' - '+p.supplier:'')+' x'+Number(p.qty||1),9,48,false);rt(y+13,9,quoteMoney(p.total||0),false)})}
    if(Number(q.travel||0)){text(left,y,9,'Call-out / travel',false);rt(y,9,quoteMoney(q.travel),false);y-=16}
    if(Number(q.other||0)){text(left,y,9,'Other',false);rt(y,9,quoteMoney(q.other),false);y-=16}
    y-=4;line();y-=27;rt(y,19,'Estimated Total: '+quoteMoney(q.total!=null?q.total:quoteTotal(q)),true);
    y-=34;
    text(left,y,8.2,'Parts prices are subject to change depending on supplier pricing and availability.',false);
    y-=12;
    text(left,y,8.2,'Any significant price changes or additional work will be discussed before proceeding.',false);
    y-=12;
    text(left,y,8.2,'Quote valid for 30 days from the date shown above.',true);
    var content=cmd.join('\n');
    var objs=[];
    objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
    objs[2]='<< /Type /Pages /Kids [5 0 R] /Count 1 >>';
    objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
    objs[5]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents 6 0 R >>';
    objs[6]='<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream';
    var pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n',offs=[0];
    for(var i=1;i<objs.length;i++){offs[i]=pdf.length;pdf+=i+' 0 obj\n'+objs[i]+'\nendobj\n'}
    var xr=pdf.length;pdf+='xref\n0 '+objs.length+'\n0000000000 65535 f \n';
    for(var k=1;k<objs.length;k++)pdf+=String(offs[k]).padStart(10,'0')+' 00000 n \n';
    pdf+='trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
    var bytes=new Uint8Array(pdf.length);for(var b=0;b<pdf.length;b++)bytes[b]=pdf.charCodeAt(b)&255;
    return new Blob([bytes],{type:'application/pdf'});
  }
  window.shareQuotePdf=async function(id){
    var q=db.quotes.find(function(x){return x.id===id;});if(!q)return;
    var blob=quotePdfBlob(q),name=String(q.number||'quote').replace(/[^A-Za-z0-9_-]+/g,'-')+'.pdf',file=new File([blob],name,{type:'application/pdf'});
    try{
      if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
        await navigator.share({title:'Quote '+(q.number||''),text:'Quotation '+(q.number||'')+' for '+quoteMoney(q.total||0),files:[file]});return;
      }
    }catch(e){if(e&&e.name==='AbortError')return}
    var u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},3000);
  };

  // ----- convert to job -----
  window.convertQuoteToJob=function(id){
    var q=db.quotes.find(function(x){return x.id===id;});if(!q)return;
    if(q.convertedJobId){alert('This quote has already been converted to a job.');return}
    if(!confirm('Convert '+(q.number||'this quote')+' into a new job?'))return;

    var work=(q.workItems||[]).map(function(w){return '• '+w.description}).join('\n');
    var parts=(q.partLines||[]).map(function(p){
      return '• '+p.name+(p.partNo?' ['+p.partNo+']':'')+(p.supplier?' — '+p.supplier:'')+
        ' × '+Number(p.qty||1)+' @ '+quoteMoney(p.unitPrice||0);
    }).join('\n');

    var note=[
      'Converted from quote '+(q.number||''),
      work?'Quoted work:\n'+work:'',
      parts?'Quoted parts/pricing:\n'+parts:'',
      q.notes||''
    ].filter(Boolean).join('\n\n');

    var j={
      id:gid(),
      title:q.title||((q.workItems||[])[0]||{}).description||'Quoted work',
      customer:q.customer||'',
      reg:q.reg||'',
      make:q.make||'',
      model:q.model||'',
      engineSize:q.engineSize||'',
      date:new Date().toISOString().slice(0,10),
      status:'Booked',
      location:'',
      notes:note,
      hours:Number(q.labourHours||0),
      partIds:[],
      partQuantities:{},
      quoteId:q.id
    };

    db.jobs.push(j);
    q.status='Converted';
    q.convertedJobId=j.id;
    q.convertedAt=new Date().toISOString();

    var quotedParts=(q.partLines||[]).filter(function(p){return p && p.name;});
    var copiedCount=0;

    if(quotedParts.length && !q.quotedPartsAddedToStockAt){
      var copyToStock=confirm(
        'Job created.\n\nWould you like to add the '+quotedParts.length+
        ' quoted part'+(quotedParts.length===1?'':'s')+
        ' to Parts / unallocated stock?\n\n'+
        'Name, part number, supplier, quantity and quoted customer price will be copied across. '+
        'Your actual cost will be left at £0 until you enter what you paid.'
      );

      if(copyToStock){
        q.quotedStockPartIds=[];
        quotedParts.forEach(function(p){
          var stockPart={
            id:gid(),
            name:p.name||'Part',
            partNo:p.partNo||'',
            supplier:p.supplier||'',
            stockQty:Math.max(1,Number(p.qty||1)),
            cost:0,
            charge:Number(p.unitPrice||0),
            includedParts:Array.isArray(p.includedParts)?p.includedParts.map(function(x){return {...x};}):[],
            sourceQuoteId:q.id,
            sourceQuoteNumber:q.number||'',
            addedFromQuote:true
          };
          db.parts.push(stockPart);
          q.quotedStockPartIds.push(stockPart.id);
          copiedCount++;
        });
        q.quotedPartsAddedToStockAt=new Date().toISOString();
      }
    }

    save();
    render();

    if(copiedCount){
      alert('Quote converted to a new job and '+copiedCount+' quoted part'+(copiedCount===1?' was':'s were')+' added to unallocated stock.');
    }else{
      alert('Quote converted to a new job.');
    }
  };

  // ----- integrate nav/dashboard -----
  window.render=function(){
    renderHeader();
    var tabs=['Dashboard','Jobs','Quotes','Customers','Parts','Invoices','Settings'];
    nav.innerHTML=tabs.map(function(x){return '<button class="'+(page===x?'on':'')+'" onclick="go(\''+x+'\')">'+x+'</button>';}).join('');
    var views={Dashboard:dash,Jobs:jobs,Quotes:quotes,Customers:customers,Parts:parts,Invoices:invoices,Settings:settings};
    var fn=views[page]||dash;
    app.innerHTML=fn();
  };

  var oldDash=dash;
  window.dash=function(){
    var base=oldDash();
    return base.replace(
      '<div class="actions"><button class="primary" onclick="jobForm()">＋ New Job</button><button onclick="invoiceForm()">＋ Invoice</button></div>',
      '<div class="actions"><button class="primary" onclick="jobForm()">＋ New Job</button><button class="primary" onclick="quoteForm()">＋ Quote</button><button onclick="invoiceForm()">＋ Invoice</button></div>'
    );
  };

  save();
  render();
})();
</script>


<script>
(function(){
  // Migrate old "Open" jobs into the clearer Pending workflow.
  (db.jobs||[]).forEach(function(j){
    if(!j.status || j.status==='Open') j.status='Pending';
  });

  window.jobStatusFilter = window.jobStatusFilter || 'All';

  function hasInvoiceForJob(id){
    return (db.invoices||[]).some(function(i){return i.jobId===id;});
  }

  function jobNeedsInvoice(j){
    return j.status==='Complete' && !hasInvoiceForJob(j.id);
  }

  function statusDisplay(j){
    return jobNeedsInvoice(j) ? 'Ready to Invoice' : (j.status||'Pending');
  }

  function statusClass(j){
    return jobNeedsInvoice(j) ? 'status-ready' : '';
  }

  function jobCardV34(j){
    var ps=(typeof linkedParts==='function') ? linkedParts(j) : [];
    var lab=Number(j.hours||0)*Number((db.settings||{}).hourlyRate||0);
    return '<div class="card '+(jobNeedsInvoice(j)?'attention-card':'')+'">'+
      '<div class="row"><b>'+esc(j.title||'Untitled job')+'</b><span class="pill '+statusClass(j)+'">'+esc(statusDisplay(j))+'</span></div>'+
      '<div class="muted">'+esc(j.customer||'No customer')+' • '+esc(j.reg||'No reg')+' • '+esc(j.date||'')+'</div>'+
      (j.hours?'<div class="muted">'+esc(j.hours)+'h labour = '+money(lab)+'</div>':'')+
      (ps.length?'<div class="muted">'+ps.length+' linked part'+(ps.length===1?'':'s')+'</div>':'')+
      '<div class="actions"><button onclick="jobForm(\''+j.id+'\')">Open</button>'+
      '<button class="primary" onclick="jobPartsMenu(\''+j.id+'\')">＋ Add / Select Parts</button>'+

  window.setJobFilterV34=function(filter){

  window.jobs=function(){

      '<div class="job-filter-bar">'+filters.map(function(f){
        return '<button class="'+(window.jobStatusFilter===f?'on':'')+'" onclick="setJobFilterV34(\''+f+'\')">'+f+'</button>';
      }).join('')+'</div>'+
      (list.map(jobCardV34).join('')||'<div class="empty">No jobs in this status.</div>');
  };

  // Dashboard makes unfinished admin obvious.
  window.dash=function(){
    var rev=(db.invoices||[]).reduce(function(a,x){return a+Number(x.total||0);},0);
    var cost=(db.parts||[]).reduce(function(a,x){return a+Number(x.cost||0);},0);
    var ready=(db.jobs||[]).filter(jobNeedsInvoice);
    var pending=(db.jobs||[]).filter(function(j){return j.status==='Pending';});

    return '<div class="grid">'+
      '<div class="card stat">Jobs<b>'+db.jobs.length+'</b></div>'+
      '<div class="card stat">Customers<b>'+db.customers.length+'</b></div>'+
      '<div class="card stat">Ready to Invoice<b>'+ready.length+'</b></div>'+
      '<div class="card stat">Pending<b>'+pending.length+'</b></div>'+
      '<div class="card stat">Invoiced<b>'+money(rev)+'</b></div>'+
      '<div class="card stat">Profit*<b>'+money(rev-cost)+'</b></div>'+
      '</div>'+
      '<div class="actions"><button class="primary" onclick="jobForm()">＋ New Job</button><button class="primary" onclick="quoteForm()">＋ Quote</button><button onclick="invoiceForm()">＋ Invoice</button></div>'+
      (ready.length?'<div class="card attention-card"><div class="row"><b class="attention-title">Ready to Invoice</b><button onclick="setJobFilterV34(\'Ready to Invoice\');go(\'Jobs\')">View all</button></div>'+
        ready.slice().reverse().map(jobCardV34).join('')+'</div>':'')+
      (pending.length?'<div class="card"><div class="row"><b>Pending Jobs</b><button onclick="setJobFilterV34(\'Pending\');go(\'Jobs\')">View all</button></div>'+
        pending.slice().reverse().slice(0,3).map(jobCardV34).join('')+'</div>':'')+
      '<div class="card"><b>Recent jobs</b>'+(db.jobs||[]).slice().reverse().slice(0,5).map(jobCardV34).join('')+'</div>'+
      '<p class="muted">*Invoices minus recorded parts costs.</p>';
  };

  save();
  render();
})();
</script>

<script>
(function(){
  var STATUS_OPTIONS=['Pending','Booked','In progress','Complete','Invoiced','Paid','Cancelled'];
  window.jobCalendarMonth=window.jobCalendarMonth||new Date().toISOString().slice(0,7);

  function hasInvoiceV35(id){return (db.invoices||[]).some(function(i){return i.jobId===id;});}
  function needsInvoiceV35(j){return j.status==='Complete'&&!hasInvoiceV35(j.id);}
  function shownStatusV35(j){return needsInvoiceV35(j)?'Ready to Invoice':(j.status||'Pending');}
  function validDateV35(s){return /^\d{4}-\d{2}-\d{2}$/.test(String(s||''));}
  function formatDateV35(s){
    if(!validDateV35(s))return s||'';
    var a=s.split('-'),d=new Date(Date.UTC(+a[0],+a[1]-1,+a[2]));
    return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
  }
  function statusOptionsV35(current){
    return STATUS_OPTIONS.map(function(s){return '<option '+(s===current?'selected':'')+'>'+s+'</option>';}).join('');
  }

  window.quickJobStatusV35=function(id,status){
    var j=(db.jobs||[]).find(function(x){return x.id===id;});
    if(!j)return;
    j.status=status;
    save();render();
  };

  window.jobForm=function(id){
    var j=(db.jobs||[]).find(function(x){return x.id===id;})||{};
    var lines=(typeof jobPartLines==='function')?jobPartLines(j):[];
    var created=j.date||new Date().toISOString().slice(0,10);
    var linked='';
    if(id){
      linked='<div class="card"><div class="row"><b>Linked parts</b><button class="primary" onclick="jobPartsMenu(\''+id+'\')">＋ Add / Select Parts</button></div>'+
        (lines.map(function(line){return '<div class="partline row"><span>'+esc(line.name)+' × '+line.qty+'</span><span>'+money(line.total)+'</span></div>';}).join('')||'<div class="muted">No parts linked yet.</div>')+'</div>';
    }
    var actions='<div class="actions"><button class="primary" onclick="saveJob(\''+(id||'')+'\')">Save job</button>'+
      (id?'<button class="danger" onclick="deleteJobV32(\''+id+'\')">Delete Job</button>':'')+'</div>';
    openModal(id?'Edit Job':'New Job',
      '<label>Job title</label><input id="jt" value="'+esc(j.title||'')+'">'+
      '<label>Customer</label><select id="jcsel" onchange="fillJobCustomer(this.value)">'+customerOptions(j.customer||'')+'</select>'+
      '<label>Customer name (or type manually)</label><input id="jcmanual" value="'+esc(j.customer||'')+'">'+
      '<label>Registration</label><input id="jr" value="'+esc(j.reg||'')+'">'+
      '<div class="vehicle-grid"><div><label>Make</label><input id="jmake" value="'+esc(j.make||'')+'"></div><div><label>Model</label><input id="jmodel" value="'+esc(j.model||'')+'"></div></div>'+
      '<label>Engine size / engine</label><input id="jengine" value="'+esc(j.engineSize||'')+'">'+
      '<div class="two"><div><label>Date Created</label><input id="jd" class="date-safe" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" value="'+esc(created)+'"></div><div><label>Booked For</label><div class="booking-date-wrap"><input id="jbooked" class="date-safe" type="text" inputmode="numeric" placeholder="DD-MM-YYYY" value="'+esc(bookingDateToUKV38(j.bookedFor||''))+'"><button type="button" aria-label="Open booking calendar" title="Open booking calendar" onclick="openBookingDatePickerV36()">📅</button></div></div></div>'+
      '<div class="muted" style="margin-top:-7px;margin-bottom:10px">Booked For is the appointment date used by the schedule/calendar. Type DD-MM-YYYY or tap 📅 to choose visually.</div>'+
      '<label>Status</label><select id="js">'+statusOptionsV35(j.status||'Pending')+'</select>'+
      '<div class="muted" style="margin-top:-7px;margin-bottom:10px">You can move a job backwards or forwards at any time. Ready to Invoice means the saved status is Complete and no invoice has been created yet.</div>'+
      '<label>Time spent on job (hours)</label><input id="jh" type="number" inputmode="decimal" min="0" step="0.25" value="'+Number(j.hours||0)+'" placeholder="e.g. 1.5">'+
      '<div class="muted" style="margin-top:-6px;margin-bottom:10px">Labour is calculated automatically using your hourly rate in Settings.</div>'+
      '<label>Location</label><input id="jl" value="'+esc(j.location||'')+'">'+
      '<label>Notes</label><textarea id="jn">'+esc(j.notes||'')+'</textarea>'+linked+actions
    );
  };

  window.saveJob=function(id){
    var old=(db.jobs||[]).find(function(y){return y.id===id;})||{};
    var booked=bookingDateToISOV38((document.getElementById('jbooked')||{}).value||'');
    var status=js.value;
    if(status==='Booked'&&!booked){
      if(!confirm('This job is marked Booked but has no Booked For date. Save it without a calendar date?'))return;
    }
    var x={...old,id:id||gid(),title:jt.value,customer:jcmanual.value,reg:jr.value,make:jmake.value,model:jmodel.value,engineSize:jengine.value,date:jd.value,bookedFor:booked,status:status,location:jl.value,notes:jn.value,hours:Number(jh.value||0),partIds:old.partIds||[],partQuantities:old.partQuantities||{}};
    var i=db.jobs.findIndex(function(y){return y.id===x.id;});
    if(i<0)db.jobs.push(x);else db.jobs[i]=x;
    save();closeM();render();
  };

  function cardV35(j){
    var ps=(typeof linkedParts==='function')?linkedParts(j):[];
    var lab=Number(j.hours||0)*Number((db.settings||{}).hourlyRate||0);
    var ready=needsInvoiceV35(j);
    return '<div class="card '+(ready?'attention-card':'')+'">'+
      '<div class="row wrap"><b>'+esc(j.title||'Untitled job')+'</b><span class="pill '+(ready?'status-ready':'')+'">'+esc(shownStatusV35(j))+'</span></div>'+
      '<div class="muted">'+esc(j.customer||'No customer')+' • '+esc(j.reg||'No reg')+' • Created '+esc(j.date||'')+'</div>'+
      (j.bookedFor?'<div class="booked-date">📅 Booked: '+esc(formatDateV35(j.bookedFor))+'</div>':(j.status==='Booked'?'<div class="muted">📅 Booked — no appointment date set</div>':''))+
      (j.hours?'<div class="muted">'+esc(j.hours)+'h labour = '+money(lab)+'</div>':'')+
      (ps.length?'<div class="muted">'+ps.length+' linked part'+(ps.length===1?'':'s')+'</div>':'')+
      '<div class="actions"><button onclick="jobForm(\''+j.id+'\')">Open</button><select class="quick-status" aria-label="Change job status" onchange="quickJobStatusV35(\''+j.id+'\',this.value)">'+statusOptionsV35(j.status||'Pending')+'</select><button class="primary" onclick="jobPartsMenu(\''+j.id+'\')">＋ Parts</button>'+
      (ready?'<button class="primary" onclick="invoiceForm(\''+j.id+'\')">Invoice Now</button>':(j.status!=='Paid'&&j.status!=='Cancelled'?'<button onclick="invoiceForm(\''+j.id+'\')">Invoice</button>':''))+'</div></div>';
  }

  function daysInMonthV35(y,m){return new Date(Date.UTC(y,m+1,0)).getUTCDate();}
  function shiftMonthV35(ym,delta){var a=ym.split('-'),d=new Date(Date.UTC(+a[0],+a[1]-1+delta,1));return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');}
  window.shiftJobCalendarV35=function(delta){window.jobCalendarMonth=shiftMonthV35(window.jobCalendarMonth,delta);render();};
  window.jumpJobCalendarTodayV35=function(){window.jobCalendarMonth=new Date().toISOString().slice(0,7);render();};


  function bookingDateToUKV38(v){
    if(!v)return '';
    if(/^\d{4}-\d{2}-\d{2}$/.test(v)){var a=v.split('-');return a[2]+'-'+a[1]+'-'+a[0];}
    return v;
  }
  function bookingDateToISOV38(v){
    v=(v||'').trim().replace(/\//g,'-');
    if(/^\d{2}-\d{2}-\d{4}$/.test(v)){var a=v.split('-');return a[2]+'-'+a[1]+'-'+a[0];}
    return v;
  }
  function validBookingDateV38(v){return validDateV35(bookingDateToISOV38(v));}

  var bookingPickerMonthV36=null;

  window.openBookingDatePickerV36=function(){
    var inp=document.getElementById('jbooked');
    var base=new Date();
    if(inp&&validBookingDateV38(inp.value)){
      var bp=bookingDateToISOV38(inp.value).split('-');
      base=new Date(+bp[0],+bp[1]-1,+bp[2],12,0,0);
    }
    bookingPickerMonthV36=new Date(base.getFullYear(),base.getMonth(),1);
    renderBookingDatePickerV36();
  };

  window.closeBookingDatePickerV36=function(){
    var h=document.getElementById('bookingPickerHost');
    if(h) h.innerHTML='';
  };

  window.shiftBookingDatePickerV36=function(delta){
    if(!bookingPickerMonthV36) bookingPickerMonthV36=new Date();
    bookingPickerMonthV36=new Date(bookingPickerMonthV36.getFullYear(),bookingPickerMonthV36.getMonth()+delta,1);
    renderBookingDatePickerV36();
  };

  window.bookingPickerTodayV36=function(){
    var n=new Date();
    bookingPickerMonthV36=new Date(n.getFullYear(),n.getMonth(),1);
    renderBookingDatePickerV36();
  };

  window.pickBookingDateV36=function(ds){
    var inp=document.getElementById('jbooked');
    if(inp) inp.value=bookingDateToUKV38(ds);
    closeBookingDatePickerV36();
  };

  window.clearBookingDateV36=function(){
    var inp=document.getElementById('jbooked');
    if(inp) inp.value='';
    closeBookingDatePickerV36();
  };

  function renderBookingDatePickerV36(){
    var host=document.getElementById('bookingPickerHost');
    if(!host)return;
    if(!bookingPickerMonthV36){
      var n0=new Date();bookingPickerMonthV36=new Date(n0.getFullYear(),n0.getMonth(),1);
    }

    var y=bookingPickerMonthV36.getFullYear(),m=bookingPickerMonthV36.getMonth();
    var first=new Date(y,m,1),offset=(first.getDay()+6)%7;
    var gridStart=new Date(y,m,1-offset);
    var inp=document.getElementById('jbooked');
    var selected=inp?bookingDateToISOV38(inp.value):'';
    var nowV36=new Date();
    var today=nowV36.getFullYear()+'-'+String(nowV36.getMonth()+1).padStart(2,'0')+'-'+String(nowV36.getDate()).padStart(2,'0');

    var booked=(db.jobs||[]).filter(function(j){
      return j.status==='Booked'&&validDateV35(j.bookedFor);
    });
    var byDate={};
    booked.forEach(function(j){(byDate[j.bookedFor]||(byDate[j.bookedFor]=[])).push(j);});

    var cells=[];
    for(var i=0;i<42;i++){
      var d=new Date(gridStart.getFullYear(),gridStart.getMonth(),gridStart.getDate()+i);
      var ds=localDateV35(d),outside=d.getMonth()!==m,jobs=byDate[ds]||[];
      var titles=jobs.map(function(j){
        return '<div class="booking-picker-job" title="'+esc(j.title||'Job')+'">'+esc(j.title||'Job')+'</div>';
      }).join('');
      cells.push(
        '<button type="button" class="booking-picker-day '+(outside?'outside ':'')+(ds===today?'today ':'')+(ds===selected?'selected':'')+
        '" onclick="pickBookingDateV36(\''+ds+'\')"><div class="daynum">'+d.getDate()+'</div>'+titles+'</button>'
      );
    }

    var title=bookingPickerMonthV36.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    host.innerHTML=
      '<div id="bookingPickerOverlay" onclick="if(event.target===this)closeBookingDatePickerV36()">'+
        '<div class="booking-picker-card">'+
          '<div class="row wrap"><div><b>Select Booked Date</b><div class="muted">Existing booked jobs are shown by job title.</div></div><button type="button" onclick="closeBookingDatePickerV36()">✕</button></div>'+
          '<div class="schedule-toolbar"><button type="button" onclick="shiftBookingDatePickerV36(-1)">‹</button><div class="month-title">'+esc(title)+'</div><button type="button" onclick="shiftBookingDatePickerV36(1)">›</button></div>'+
          '<div class="booking-picker-grid">'+
            ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(x){return '<div class="booking-picker-head">'+x+'</div>';}).join('')+
            cells.join('')+
          '</div>'+
          '<div class="actions"><button type="button" onclick="bookingPickerTodayV36()">Today</button><button type="button" onclick="clearBookingDateV36()">Clear Date</button></div>'+
        '</div>'+
      '</div>';
  }

  function calendarV35(){
    var a=window.jobCalendarMonth.split('-'),y=+a[0],m=+a[1]-1,first=new Date(Date.UTC(y,m,1));
    var start=(first.getUTCDay()+6)%7,count=daysInMonthV35(y,m),prevCount=daysInMonthV35(y,m-1),today=new Date().toISOString().slice(0,10);
    var booked=(db.jobs||[]).filter(function(j){return j.status==='Booked'&&validDateV35(j.bookedFor);});
    var byDate={};booked.forEach(function(j){(byDate[j.bookedFor]||(byDate[j.bookedFor]=[])).push(j);});
    var cells=[];
    for(var idx=0;idx<42;idx++){
      var day=idx-start+1,cy=y,cm=m,out=false;
      if(day<1){out=true;cm=m-1;if(cm<0){cm=11;cy=y-1;}day=prevCount+day;}
      else if(day>count){out=true;day-=count;cm=m+1;if(cm>11){cm=0;cy=y+1;}}
      var ds=cy+'-'+String(cm+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'),dayJobs=byDate[ds]||[];
      cells.push('<div class="calendar-day '+(out?'outside ':'')+(ds===today?'today ':'')+(dayJobs.length?'has-jobs':'')+'"><div class="calendar-num">'+day+'</div>'+dayJobs.map(function(j){return '<button class="calendar-job" onclick="jobForm(\''+j.id+'\')">'+esc(j.title||'Job')+'</button>';}).join('')+'</div>');
    }
    var title=first.toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});
    return '<div class="card"><div class="row wrap"><div><b>Booked Jobs Calendar</b><div class="muted">Only jobs marked Booked appear here.</div></div><button onclick="jumpJobCalendarTodayV35()">Today</button></div><div class="schedule-toolbar"><button onclick="shiftJobCalendarV35(-1)">‹</button><div class="month-title">'+esc(title)+'</div><button onclick="shiftJobCalendarV35(1)">›</button></div><div class="calendar-grid">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(x){return '<div class="calendar-head">'+x+'</div>';}).join('')+cells.join('')+'</div></div>';
  }

  function bookedAgendaV35(){
    var list=(db.jobs||[]).filter(function(j){return j.status==='Booked';}).slice().sort(function(a,b){return String(a.bookedFor||'9999-99-99').localeCompare(String(b.bookedFor||'9999-99-99'));});
    if(!list.length)return '<div class="empty">No booked jobs yet.</div>';
    return '<div class="card"><b>Booked Schedule</b>'+list.map(function(j){return '<div class="partline"><div class="row wrap"><div><b>'+esc(j.bookedFor?formatDateV35(j.bookedFor):'No date set')+'</b><div class="muted">'+esc(j.reg||'No reg')+' • '+esc(j.customer||'No customer')+' • '+esc(j.title||'Job')+'</div></div><button onclick="jobForm(\''+j.id+'\')">Open</button></div></div>';}).join('')+'</div>';
  }

  window.setJobFilterV34=function(filter){window.jobStatusFilter=filter;render();};
  window.jobs=function(){
    var filters=['All','Pending','Booked','In progress','Ready to Invoice','Invoiced','Paid','Cancelled'];
    var list=(db.jobs||[]).slice().reverse().filter(function(j){if(window.jobStatusFilter==='All')return true;if(window.jobStatusFilter==='Ready to Invoice')return needsInvoiceV35(j);return j.status===window.jobStatusFilter;});
    return '<div class="row"><div><h2 style="margin-bottom:2px">Jobs</h2><div class="muted">Move jobs between statuses and schedule booked work</div></div><button class="primary" onclick="jobForm()">＋ New</button></div><div class="job-filter-bar">'+filters.map(function(f){return '<button class="'+(window.jobStatusFilter===f?'on':'')+'" onclick="setJobFilterV34(\''+f+'\')">'+f+'</button>';}).join('')+'</div>'+(window.jobStatusFilter==='Booked'?calendarV35()+bookedAgendaV35():'')+(list.map(cardV35).join('')||'<div class="empty">No jobs in this status.</div>');
  };

  window.dash=function(){
    var rev=(db.invoices||[]).reduce(function(a,x){return a+Number(x.total||0);},0),cost=(db.parts||[]).reduce(function(a,x){return a+Number(x.cost||0);},0);
    var ready=(db.jobs||[]).filter(needsInvoiceV35),pending=(db.jobs||[]).filter(function(j){return j.status==='Pending';});
    var upcoming=(db.jobs||[]).filter(function(j){return j.status==='Booked'&&validDateV35(j.bookedFor);}).sort(function(a,b){return a.bookedFor.localeCompare(b.bookedFor);});
    return '<div class="grid"><div class="card stat">Jobs<b>'+db.jobs.length+'</b></div><div class="card stat">Customers<b>'+db.customers.length+'</b></div><div class="card stat">Ready to Invoice<b>'+ready.length+'</b></div><div class="card stat">Booked<b>'+upcoming.length+'</b></div><div class="card stat">Invoiced<b>'+money(rev)+'</b></div><div class="card stat">Profit*<b>'+money(rev-cost)+'</b></div></div><div class="actions"><button class="primary" onclick="jobForm()">＋ New Job</button><button class="primary" onclick="quoteForm()">＋ Quote</button><button onclick="invoiceForm()">＋ Invoice</button></div>'+
      (upcoming.length?'<div class="card"><div class="row"><b>Upcoming Bookings</b><button onclick="setJobFilterV34(\'Booked\');go(\'Jobs\')">Calendar</button></div>'+upcoming.slice(0,4).map(function(j){return '<div class="partline"><b>'+esc(formatDateV35(j.bookedFor))+'</b><div class="muted">'+esc(j.reg||'No reg')+' • '+esc(j.title||'Job')+'</div></div>';}).join('')+'</div>':'')+
      (ready.length?'<div class="card attention-card"><div class="row"><b class="attention-title">Ready to Invoice</b><button onclick="setJobFilterV34(\'Ready to Invoice\');go(\'Jobs\')">View all</button></div>'+ready.slice().reverse().map(cardV35).join('')+'</div>':'')+
      (pending.length?'<div class="card"><div class="row"><b>Pending Jobs</b><button onclick="setJobFilterV34(\'Pending\');go(\'Jobs\')">View all</button></div>'+pending.slice().reverse().slice(0,3).map(cardV35).join('')+'</div>':'')+
      '<div class="card"><b>Recent jobs</b>'+(db.jobs||[]).slice().reverse().slice(0,5).map(cardV35).join('')+'</div><p class="muted">*Invoices minus recorded parts costs.</p>';
  };

  save();render();
})();
</script>
