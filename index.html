<style>
/* v26 visual polish */

/* Remove the dark rectangular slabs behind the title/header and tab strip */
header,.topbar{
  background:transparent !important;
  border-bottom:0 !important;
  box-shadow:none !important;
}
nav,.nav{
  background:transparent !important;
  border:0 !important;
  box-shadow:none !important;
}

/* Keep the title readable directly on the blue background */
header h1,.topbar h1{
  color:#fff !important;
  text-shadow:0 1px 2px rgba(20,55,80,.18);
}
header .sub,.topbar .sub{
  color:#DDEAF2 !important;
}

/* Tabs stay as individual pale buttons, without a strip behind them */
nav button,.nav button{
  box-shadow:0 2px 5px rgba(31,72,99,.12);
}

/* Orange accent, similar to the earlier theme */
:root{
  --action-orange:#FF8A00;
  --action-orange-dark:#D96F00;
}

/* Main standout actions */
button.primary,
.btn.primary,
.actions .primary{
  background:var(--action-orange) !important;
  color:#172A38 !important;
  border:0 !important;
}
button.primary:active,
.btn.primary:active{
  background:var(--action-orange-dark) !important;
}

/* Invoice-related buttons are especially highlighted */
button[onclick*="invoiceForm"],
button[onclick*="viewInvoice"],
button[onclick*="printShareInvoice"],
button[onclick*="emailInvoice"]{
  background:var(--action-orange) !important;
  color:#172A38 !important;
}

/* Keep destructive controls red */
button.danger,.btn.danger,.danger{
  background:#C84D5A !important;
  color:#fff !important;
}

/* Normal utility buttons stay blue */
button:not(.primary):not(.danger):not(.secondary):not([onclick*="invoiceForm"]):not([onclick*="viewInvoice"]):not([onclick*="printShareInvoice"]):not([onclick*="emailInvoice"]){
  background:#2F6F9F !important;
  color:#fff !important;
}

/* Selected navigation tab gets orange accent */
nav button.active,.nav button.on{
  background:var(--action-orange) !important;
  color:#172A38 !important;
  border-color:var(--action-orange-dark) !important;
}
</style>

</head><body>
<div class="topbar"><div class="brandtext"><h1>🔧 Mechanic Mate</h1><div class="sub">Private mobile mechanic job manager</div></div><img id="headerLogo" class="app-logo hidden" alt="Company logo"></div><div id="nav" class="nav"></div><main id="app"></main><div id="modal"></div><div id="bookingPickerHost"></div>
<script>
const KEY='mechanic-mate-v2';
let db=JSON.parse(localStorage.getItem(KEY)||'{}');
db.jobs=Array.isArray(db.jobs)?db.jobs:[];db.customers=Array.isArray(db.customers)?db.customers:[];db.parts=Array.isArray(db.parts)?db.parts:[];db.invoices=Array.isArray(db.invoices)?db.invoices:[];db.quotes=Array.isArray(db.quotes)?db.quotes:[];db.settings=db.settings||{hourlyRate:45,companyName:'',companyLogo:''};if(db.settings.hourlyRate==null)db.settings.hourlyRate=45;if(db.settings.companyName==null)db.settings.companyName='';if(db.settings.companyLogo==null)db.settings.companyLogo='';
db.jobs.forEach(j=>{if(!Array.isArray(j.partIds))j.partIds=[];if(j.hours==null)j.hours=0});
db.parts.forEach(p=>{if(p.charge==null)p.charge=Number(p.cost||0)});
let page='Dashboard';
function save(){
  localStorage.setItem(KEY,JSON.stringify(db));
  localStorage.setItem('mechanic-mate-local-updated-at',new Date().toISOString());
  if(window.cloudScheduleSave) window.cloudScheduleSave();
}const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const gid=()=>crypto.randomUUID();
const jobLabel=j=>`${j.title||'Untitled'}${j.reg?' • '+j.reg:''}${j.customer?' • '+j.customer:''}`;
function go(p){page=p;render()}function renderHeader(){const img=document.getElementById('headerLogo');if(db.settings.companyLogo){img.src=db.settings.companyLogo;img.classList.remove('hidden')}else{img.removeAttribute('src');img.classList.add('hidden')}}function render(){renderHeader();nav.innerHTML=['Dashboard','Jobs','Customers','Parts','Invoices','Settings'].map(x=>`<button class="${page===x?'on':''}" onclick="go('${x}')">${x}</button>`).join('');app.innerHTML=({Dashboard:dash,Jobs:jobs,Customers:customers,Parts:parts,Invoices:invoices,Settings:settings}[page])()}
function dash(){const rev=db.invoices.reduce((a,x)=>a+Number(x.total||0),0),cost=db.parts.reduce((a,x)=>a+Number(x.cost||0),0);return `<div class="grid"><div class="card stat">Jobs<b>${db.jobs.length}</b></div><div class="card stat">Customers<b>${db.customers.length}</b></div><div class="card stat">Invoiced<b>${money(rev)}</b></div><div class="card stat">Profit*<b>${money(rev-cost)}</b></div></div><div class="actions"><button class="primary" onclick="jobForm()">＋ New Job</button><button onclick="invoiceForm()">＋ Invoice</button></div><div class="card"><b>Recent jobs</b>${db.jobs.slice().reverse().slice(0,5).map(jobCard).join('')||'<div class="empty">No jobs yet.</div>'}</div><p class="muted">*Invoices minus recorded parts costs.</p>`}
function linkedParts(j){return (j.partIds||[]).map(id=>db.parts.find(p=>p.id===id)).filter(Boolean)}
function jobCard(j){const ps=linkedParts(j),lab=Number(j.hours||0)*Number(db.settings.hourlyRate||0);return `<div class="card"><div class="row"><b>${esc(j.title||'Untitled job')}</b><span class="pill">${esc(j.status||'Open')}</span></div><div class="muted">${esc(j.customer||'No customer')} • ${esc(j.reg||'No reg')} • ${esc(j.date||'')}</div>${j.hours?`<div class="muted">${esc(j.hours)}h labour = ${money(lab)}</div>`:''}${ps.length?`<div class="muted">${ps.length} linked part${ps.length===1?'':'s'}</div>`:''}<div class="actions"><button onclick="jobForm('${j.id}')">Open</button><button class="primary" onclick="jobPartsMenu('${j.id}')">＋ Add / Select Parts</button><button onclick="invoiceForm('${j.id}')">Invoice</button></div></div>`}
function jobs(){return `<div class="row"><h2>Jobs</h2><button class="primary" onclick="jobForm()">＋ New</button></div>${db.jobs.slice().reverse().map(jobCard).join('')||'<div class="empty">No jobs.</div>'}`}
function customers(){return `<div class="row"><h2>Customers</h2><button class="primary" onclick="customerForm()">＋ Add</button></div>${db.customers.map(c=>`<div class="card"><b>${esc(c.name)}</b><div class="muted">${esc(c.phone)}${c.email?'<br>'+esc(c.email):''}<br>${esc(c.vehicle)}<br>${esc(c.address)}</div><div class="actions"><button onclick="customerForm('${c.id}')">Edit</button><button class="danger" onclick="del('customers','${c.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No customers.</div>'}`}
function partJobs(p){return db.jobs.filter(j=>(j.partIds||[]).includes(p.id))}
function parts(){return `<div class="row"><h2>Parts</h2><button class="primary" onclick="partForm()">＋ Add</button></div>${db.parts.slice().reverse().map(p=>{const js=partJobs(p);return `<div class="card"><div class="row"><b>${esc(p.name)}</b><span class="price">${money(p.charge||p.cost)}</span></div><div class="muted">Cost ${money(p.cost)}${p.supplier?' • '+esc(p.supplier):''}</div><div class="muted">${js.length?'Used on: '+js.map(j=>esc(j.title||j.reg||'Job')).join(', '):'Not linked to a job'}</div><div class="actions"><button onclick="partForm('${p.id}')">Edit</button><button class="danger" onclick="deletePart('${p.id}')">Delete</button></div></div>`}).join('')||'<div class="empty">No parts.</div>'}`}
function invoices(){return `<div class="row"><h2>Invoices</h2><button class="primary" onclick="invoiceForm()">＋ New</button></div>${db.invoices.slice().reverse().map(i=>`<div class="card"><div class="row"><b>${esc(i.number)}</b><b>${money(i.total)}</b></div><div class="muted">${esc(i.customer)} • ${esc(i.date)}${i.jobId?' • linked job':''}</div><p>${i.paid?'✅ PAID':'⚠️ UNPAID'}</p><div class="actions"><button class="primary" onclick="viewInvoice('${i.id}',this)">View Invoice</button><button onclick="printShareInvoice('${i.id}')">Print / Share</button><button onclick="emailInvoice('${i.id}')">Email PDF</button><button onclick="paid('${i.id}')">Mark ${i.paid?'unpaid':'paid'}</button><button class="danger" onclick="del('invoices','${i.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No invoices.</div>'}`}
function settings(){return `<h2>Settings</h2><div class="card"><b>Business details</b><p class="muted">These details appear on your invoices and the logo also appears in the app header.</p><label>Company name</label><input id="companyName" value="${esc(db.settings.companyName||'')}" placeholder="e.g. Roadside Auto Solutions"><label>Company logo</label>${db.settings.companyLogo?`<div style="margin:8px 0"><img class="logo-preview" src="${db.settings.companyLogo}" alt="Logo preview"></div>`:'<div class="muted" style="margin:8px 0">No logo uploaded yet.</div>'}<input id="logoUpload" type="file" accept="image/*" onchange="handleLogoUpload(event)"><div class="actions"><button class="primary" onclick="saveBusinessSettings()">Save business details</button>${db.settings.companyLogo?'<button class="danger" onclick="removeLogo()">Remove logo</button>':''}</div></div><div class="card"><b>Labour rate</b><p class="muted">Used automatically when you enter hours on a job.</p><label>Hourly charge (£)</label><input id="rate" type="number" min="0" step="0.01" value="${Number(db.settings.hourlyRate||0)}"><button class="primary" onclick="db.settings.hourlyRate=Number(rate.value||0);save();alert('Hourly rate saved')">Save rate</button></div><div class="card"><b>Backup</b><p class="muted">Export your data regularly. Your uploaded logo is included in the backup.</p><button class="primary" onclick="exportData()">Export backup</button> <button onclick="imp.click()">Import</button><input id="imp" type="file" accept=".json" style="display:none" onchange="importData(event)"></div><div class="card"><b>Reset</b><p class="muted">Delete everything stored on this device.</p><button class="danger" onclick="resetData()">Delete all data</button></div>`}
function handleLogoUpload(e){const f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>3*1024*1024){alert('Please use a logo under 3 MB.');e.target.value='';return}const r=new FileReader();r.onload=()=>{db.settings.companyLogo=r.result;save();render();alert('Logo saved')};r.readAsDataURL(f)}
function saveBusinessSettings(){db.settings.companyName=companyName.value.trim();save();render();alert('Business details saved')}
function removeLogo(){if(confirm('Remove the saved company logo?')){db.settings.companyLogo='';save();render()}}
function openModal(title,body){modal.innerHTML=`<div class="card"><div class="row"><h2>${title}</h2><button onclick="closeM()">✕</button></div>${body}</div>`}function closeM(){modal.innerHTML=''}
function customerOptions(selected=''){return `<option value="">— Select customer —</option>`+db.customers.map(c=>`<option value="${esc(c.name)}" ${c.name===selected?'selected':''}>${esc(c.name)}${c.vehicle?' • '+esc(c.vehicle):''}</option>`).join('')}
function jobForm(id){let j=db.jobs.find(x=>x.id===id)||{};const ps=linkedParts(j);openModal(id?'Edit Job':'New Job',`<label>Job title</label><input id="jt" value="${esc(j.title)}"><label>Customer</label><select id="jcsel" onchange="jcmanual.value=this.value">${customerOptions(j.customer||'')}</select><label>Customer name (or type manually)</label><input id="jcmanual" value="${esc(j.customer)}"><label>Registration</label><input id="jr" value="${esc(j.reg)}"><label>Date</label><input id="jd" class="date-safe" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" value="${j.date||new Date().toISOString().slice(0,10)}"><label>Status</label><select id="js"><option>Pending</option><option>Booked</option><option>In progress</option><option>Complete</option><option>Invoiced</option><option>Paid</option><option>Cancelled</option></select><label>Time spent on job (hours)</label><input id="jh" type="number" inputmode="decimal" min="0" step="0.25" value="${Number(j.hours||0)}" placeholder="e.g. 1.5"><div class="muted" style="margin-top:-6px;margin-bottom:10px">Labour is calculated automatically using your hourly rate in Settings.</div><label>Location</label><input id="jl" value="${esc(j.location)}"><label>Notes</label><textarea id="jn">${esc(j.notes)}</textarea>${id?`<div class="card"><div class="row"><b>Linked parts</b><button class="primary" onclick="jobPartsMenu('${id}')">＋ Add / Select Parts</button></div>${ps.map(p=>`<div class="partline row"><span>${esc(p.name)}</span><span>${money(p.charge||p.cost)}</span></div>`).join('')||'<div class="muted">No parts linked yet.</div>'}</div>`:''}<button class="primary" onclick="saveJob('${id||''}')">Save job</button>`);if(j.status)js.value=j.status}
function saveJob(id){let old=db.jobs.find(y=>y.id===id)||{};let x={...old,id:id||gid(),title:jt.value,customer:jcmanual.value,reg:jr.value,date:jd.value,status:js.value,location:jl.value,notes:jn.value,hours:Number(jh.value||0),partIds:old.partIds||[]},i=db.jobs.findIndex(y=>y.id===x.id);i<0?db.jobs.push(x):db.jobs[i]=x;save();closeM();render()}
function customerForm(id){let c=db.customers.find(x=>x.id===id)||{};openModal(id?'Edit Customer':'New Customer',`<label>Name</label><input id="cn" value="${esc(c.name)}"><label>Phone</label><input id="cp" value="${esc(c.phone)}"><label>Email</label><input id="ce" type="email" value="${esc(c.email||'')}"><label>Vehicle / Reg</label><input id="cv" value="${esc(c.vehicle)}"><label>Address</label><textarea id="ca">${esc(c.address)}</textarea><button class="primary" onclick="saveCustomer('${id||''}')">Save</button>`)}
function saveCustomer(id){let x={id:id||gid(),name:cn.value,phone:cp.value,email:ce.value,vehicle:cv.value,address:ca.value},i=db.customers.findIndex(y=>y.id===x.id);i<0?db.customers.push(x):db.customers[i]=x;save();closeM();render()}
function partForm(id='',linkJobId=''){let p=db.parts.find(x=>x.id===id)||{};openModal(id?'Edit Part':'Add Part',`<label>Part / expense</label><input id="pn" value="${esc(p.name)}"><div class="two"><div><label>Your cost (£)</label><input id="pc" type="number" min="0" step="0.01" value="${Number(p.cost||0)}"></div><div><label>Customer charge (£)</label><input id="pch" type="number" min="0" step="0.01" value="${Number(p.charge??p.cost??0)}"></div></div><label>Supplier</label><input id="ps" value="${esc(p.supplier)}"><button class="primary" onclick="savePart('${id}','${linkJobId}')">Save${linkJobId?' & link to job':''}</button>`)}
function savePart(id,linkJobId){const x={id:id||gid(),name:pn.value,cost:Number(pc.value||0),charge:Number(pch.value||0),supplier:ps.value},i=db.parts.findIndex(y=>y.id===x.id);i<0?db.parts.push(x):db.parts[i]=x;if(linkJobId){const j=db.jobs.find(y=>y.id===linkJobId);if(j&&!j.partIds.includes(x.id))j.partIds.push(x.id)}save();closeM();render()}
function jobPartsMenu(jobId){const j=db.jobs.find(x=>x.id===jobId);if(!j)return;const linked=new Set(j.partIds||[]);openModal('Parts for this job',`<p class="muted">${esc(jobLabel(j))}</p><div class="card"><b>Select saved parts</b><p class="muted">Tick any parts from your Parts tab that were used on this job.</p>${db.parts.length?db.parts.map(p=>`<label style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;color:var(--text)"><input type="checkbox" class="jobPartCheck" value="${p.id}" ${linked.has(p.id)?'checked':''} style="width:22px;height:22px;margin:0;flex:0 0 auto"><span style="flex:1"><b>${esc(p.name)}</b><br><span class="muted">Charge ${money(p.charge||p.cost)} • Cost ${money(p.cost)}</span></span></label>`).join(''):'<div class="empty">You have no saved parts yet.</div>'}<button class="primary" style="width:100%;margin-top:10px" onclick="saveJobPartSelection('${jobId}')">Save selected parts</button></div><button style="width:100%;margin-top:10px" onclick="partForm('','${jobId}')">＋ Add a new part manually</button><p class="muted">A manually added part is saved in the Parts tab and linked to this job automatically.</p>`)}
function saveJobPartSelection(jobId){const j=db.jobs.find(x=>x.id===jobId);if(!j)return;j.partIds=[...document.querySelectorAll('.jobPartCheck:checked')].map(x=>x.value);save();closeM();render()}
function deletePart(id){if(!confirm('Delete this part? It will also be unlinked from any jobs.'))return;db.jobs.forEach(j=>j.partIds=(j.partIds||[]).filter(x=>x!==id));db.parts=db.parts.filter(x=>x.id!==id);save();render()}
function invoiceForm(jobId=''){const j=db.jobs.find(x=>x.id===jobId)||null;const partsTotal=j?linkedParts(j).reduce((a,p)=>a+Number(p.charge||p.cost||0),0):0;const hours=j?Number(j.hours||0):0;const rate=Number(db.settings.hourlyRate||0);const labour=hours*rate;const jobsOpt=`<option value="">— No linked job —</option>`+db.jobs.slice().reverse().map(x=>`<option value="${x.id}" ${x.id===jobId?'selected':''}>${esc(jobLabel(x))}</option>`).join('');openModal('New Invoice',`<label>Recent job</label><select id="ivjob" onchange="fillInvoiceFromJob()">${jobsOpt}</select><label>Customer</label><select id="ivcustsel" onchange="ivc.value=this.value;fillCustomerEmail(this.value)">${customerOptions(j?.customer||'')}</select><label>Customer name</label><input id="ivc" value="${esc(j?.customer||'')}"><label>Customer email</label><input id="ive" type="email" value="${esc((db.customers.find(c=>c.name===(j?.customer||''))||{}).email||'')}"><label>Invoice number</label><input id="ivn" value="INV-${String(db.invoices.length+1).padStart(4,'0')}"><label>Date</label><input id="ivd" class="date-safe" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" value="${new Date().toISOString().slice(0,10)}"><label>Time spent on job (hours)</label><input id="ivhours" type="number" inputmode="decimal" min="0" step="0.25" value="${hours}" oninput="recalcInvoiceLabour()" placeholder="e.g. 1.5"><div class="muted" style="margin-top:-6px;margin-bottom:10px">Hourly rate: ${money(rate)} / hour. Labour is calculated automatically.</div><label>Labour (£) — calculated automatically</label><input id="ivl" type="number" step="0.01" value="${labour.toFixed(2)}" readonly style="opacity:.8"><label>Parts (£) — from linked parts</label><input id="ivp" type="number" step="0.01" value="${partsTotal.toFixed(2)}" readonly style="opacity:.8"><label>Travel / call-out (£)</label><input id="ivt" type="number" step="0.01" value="0"><label>Other (£)</label><input id="ivo" type="number" step="0.01" value="0"><button class <script>
(function(){
  function invoiceById(id){
    return (db.invoices || []).find(function(x){ return x.id === id; });
  }

  function jobByInvoice(i){
    return (db.jobs || []).find(function(j){ return j.id === i.jobId; }) || {};
  }

  function num(v){
    v = Number(v);
    return Number.isFinite(v) ? v : 0;
  }

  function invoiceHtml(i){
    var j = jobByInvoice(i);
    var settings = db.settings || {};
    var labour = num(i.labour);
    var parts = num(i.parts);
    var travel = num(i.travel);
    var other = num(i.other);
    var total = num(i.total) || labour + parts + travel + other;
    var company = settings.companyName || 'Mechanic Mate';
    var logo = settings.companyLogo || '';

    var rows = '';
    if (labour) rows += '<tr><td>Labour' + (i.hours ? ' (' + esc(i.hours) + ' hours)' : '') + '</td><td>' + money(labour) + '</td></tr>';
    if (parts) rows += '<tr><td>Parts</td><td>' + money(parts) + '</td></tr>';
    if (travel) rows += '<tr><td>Travel / call-out</td><td>' + money(travel) + '</td></tr>';
    if (other) rows += '<tr><td>Other</td><td>' + money(other) + '</td></tr>';

    return '<div class="inline-invoice">' +
      '<div class="inv-head">' +
        '<div>' +
          (logo ? '<img class="inv-logo" src="' + logo + '" alt="Company logo">' : '') +
          '<div style="font-weight:900;font-size:20px">' + esc(company) + '</div>' +
        '</div>' +
        '<div style="text-align:right">' +
          '<div class="inv-title">INVOICE</div>' +
          '<div class="inv-meta">' + esc(i.number || '') + '<br>' + esc(i.date || '') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="inv-meta">' +
        '<b>Customer:</b> ' + esc(i.customer || '') + '<br>' +
        (j.reg ? '<b>Registration:</b> ' + esc(j.reg) + '<br>' : '') +
        (j.title ? '<b>Job:</b> ' + esc(j.title) + '<br>' : '') +
      '</div>' +
      '<table><thead><tr><th>Description</th><th>Amount</th></tr></thead><tbody>' +
        rows +
      '</tbody></table>' +
      '<div class="inv-total">Total: ' + money(total) + '</div>' +
      '<div style="margin-top:16px;font-weight:900">' + (i.paid ? 'PAID' : 'UNPAID') + '</div>' +
    '</div>';
  }

  window.closeInlineInvoice = function(){
    var el = document.getElementById('inlineInvoicePreview');
    if (el) el.remove();
  };

  window.viewInvoice = function(id, button){
    var i = invoiceById(id);
    if (!i) {
      alert('Invoice not found.');
      return;
    }

    closeInlineInvoice();

    var host = document.createElement('div');
    host.id = 'inlineInvoicePreview';

    var actions = document.createElement('div');
    actions.className = 'inline-actions';

    var closeBtn = document.createElement('button');
    closeBtn.className = 'secondary';
    closeBtn.textContent = 'Close invoice';
    closeBtn.addEventListener('click', closeInlineInvoice);

    var printBtn = document.createElement('button');
    printBtn.textContent = 'Print / Save PDF';
    printBtn.addEventListener('click', function(){ printShareInvoice(id); });

    var emailBtn = document.createElement('button');
    emailBtn.textContent = 'Email';
    emailBtn.addEventListener('click', function(){ emailInvoice(id); });

    actions.appendChild(closeBtn);
    actions.appendChild(printBtn);
    actions.appendChild(emailBtn);

    var content = document.createElement('div');
    content.innerHTML = invoiceHtml(i);

    host.appendChild(actions);
    host.appendChild(content);

    var card = button && button.closest ? button.closest('.card') : null;
    (card || document.getElementById('app')).appendChild(host);

    try {
      host.scrollIntoView({behavior:'smooth', block:'start'});
    } catch(e) {
      host.scrollIntoView();
    }
  };

  window.printShareInvoice = function(id){
    var i = invoiceById(id);
    if (!i) {
      alert('Invoice not found.');
      return;
    }

    var host = document.getElementById('invoicePrintHost');
    if (!host) {
      host = document.createElement('div');
      host.id = 'invoicePrintHost';
      document.body.appendChild(host);
    }

    host.innerHTML = invoiceHtml(i);
    host.style.display = 'block';

    setTimeout(function(){
      window.print();
      setTimeout(function(){
        host.style.display = 'none';
        host.innerHTML = '';
      }, 750);
    }, 100);
  };

  window.emailInvoice = function(id){
    var i = invoiceById(id);
    if (!i) {
      alert('Invoice not found.');
      return;
    }

    var j = jobByInvoice(i);
    var company = (db.settings && db.settings.companyName) || 'Mechanic Mate';
    var subject = 'Invoice ' + (i.number || '') + ' - ' + company;
    var body =
      company + '\n\n' +
      'Invoice: ' + (i.number || '') + '\n' +
      'Date: ' + (i.date || '') + '\n' +
      'Customer: ' + (i.customer || '') + '\n' +
      (j.reg ? 'Registration: ' + j.reg + '\n' : '') +
      'Total: ' + money(i.total || 0) + '\n' +
      'Status: ' + (i.paid ? 'PAID' : 'UNPAID');

    var address = i.email || '';
    window.location.href =
      'mailto:' + encodeURIComponent(address) +
      '?subject=' + encodeURIComponent(subject) +
      '&body=' + encodeURIComponent(body);
  };
})();
</script>


<script>
(function(){
  // ---------- v17 data migration ----------
  db.settings = db.settings || {};
  if (db.settings.companyPhone == null) db.settings.companyPhone = '';
  if (db.settings.companyEmail == null) db.settings.companyEmail = '';

  db.customers = (db.customers || []).map(function(c){
    if (c.reg == null) c.reg = '';
    if (c.make == null) c.make = '';
    if (c.model == null) c.model = '';
    if (c.engineSize == null) c.engineSize = '';
    // Preserve the old free-text vehicle field.
    if (!c.reg && c.vehicle) c.reg = c.vehicle;
    return c;
  });

  db.jobs = (db.jobs || []).map(function(j){
    j.partIds = Array.isArray(j.partIds) ? j.partIds : [];
    j.partQuantities = j.partQuantities && typeof j.partQuantities === 'object' ? j.partQuantities : {};
    j.partIds.forEach(function(id){
      if (!(id in j.partQuantities)) j.partQuantities[id] = 1;
    });
    if (j.make == null) j.make = '';
    if (j.model == null) j.model = '';
    if (j.engineSize == null) j.engineSize = '';
    return j;
  });

  function customerByName(name){
    return (db.customers || []).find(function(c){ return c.name === name; }) || {};
  }

  function jobPartLines(j){
    if (!j) return [];
    return (j.partIds || []).map(function(id){
      var part = (db.parts || []).find(function(p){ return p.id === id; });
      if (!part) return null;
      var qty = Number((j.partQuantities || {})[id] || 1);
      if (!Number.isFinite(qty) || qty <= 0) qty = 1;
      var unit = Number(part.charge != null ? part.charge : part.cost || 0);
      return {
        partId: part.id,
        name: part.name || 'Part',
        qty: qty,
        unitPrice: unit,
        total: qty * unit,
        cost: Number(part.cost || 0),
        supplier: part.supplier || ''
      };
    }).filter(Boolean);
  }
  window.jobPartLines = jobPartLines;

  function vehicleText(c){
    var bits = [c.make, c.model].filter(Boolean);
    var first = bits.join(' ');
    var detail = [c.engineSize, c.reg].filter(Boolean).join(' • ');
    return [first, detail].filter(Boolean).join(' — ');
  }

  // ---------- Customers ----------
  customers = function(){
    return '<div class="row"><h2>Customers</h2><button class="primary" onclick="customerForm()">＋ Add</button></div>' +
      ((db.customers || []).map(function(c){
        var vehicle = vehicleText(c) || c.vehicle || '';
        return '<div class="card"><b>' + esc(c.name) + '</b>' +
          '<div class="muted">' +
            (c.phone ? esc(c.phone) : '') +
            (c.email ? '<br>' + esc(c.email) : '') +
            (vehicle ? '<br><b>Vehicle:</b> ' + esc(vehicle) : '') +
            (c.address ? '<br>' + esc(c.address) : '') +

          '</div></div>';
      }).join('') || '<div class="empty">No customers.</div>');
  };

  customerOptions = function(selected){
    selected = selected || '';
    return '<option value="">— Select customer —</option>' +
      (db.customers || []).map(function(c){
        var v = vehicleText(c);
        return '<option value="' + esc(c.name) + '" ' + (c.name === selected ? 'selected' : '') + '>' +
          esc(c.name) + (v ? ' • ' + esc(v) : '') + '</option>';
      }).join('');
  };

  customerForm = function(id){
    var c = (db.customers || []).find(function(x){ return x.id === id; }) || {};
    openModal(id ? 'Edit Customer' : 'New Customer',
      '<label>Name</label><input id="cn" value="' + esc(c.name || '') + '">' +
      '<div class="two"><div><label>Phone</label><input id="cp" type="tel" value="' + esc(c.phone || '') + '"></div>' +
      '<div><label>Email</label><input id="ce" type="email" value="' + esc(c.email || '') + '"></div></div>' +
      '<h3 style="margin-bottom:5px">Vehicle details</h3>' +
      '<label>Registration</label><input id="creg" value="' + esc(c.reg || c.vehicle || '') + '" placeholder="AB12 CDE">' +
      '<div class="vehicle-grid"><div><label>Make</label><input id="cmake" value="' + esc(c.make || '') + '" placeholder="Volkswagen"></div>' +
      '<div><label>Model</label><input id="cmodel" value="' + esc(c.model || '') + '" placeholder="Passat"></div></div>' +
      '<label>Engine size / engine</label><input id="cengine" value="' + esc(c.engineSize || '') + '" placeholder="e.g. 1.9 TDI">' +
      '<label>Address</label><textarea id="ca">' + esc(c.address || '') + '</textarea>' +
      '<button class="primary" onclick="saveCustomer(\'' + (id || '') + '\')">Save</button>'
    );

  saveCustomer = function(id){
    var old = (db.customers || []).find(function(x){ return x.id === id; }) || {};
    var x = {
      ...old,
      id: id || gid(),
      name: cn.value,
      phone: cp.value,
      email: ce.value,
      reg: creg.value,

      model: cmodel.value,

    };
    var i = db.customers.findIndex(function(y){ return y.id === x.id; });
    if (i < 0) db.customers.push(x); else db.customers[i] = x;
    save(); closeM(); render();
  };

  // ---------- Jobs / vehicle autofill ----------
  window.fillJobCustomer = function(name){
    var c = customerByName(name);
    var n = document.getElementById('jcmanual');
    if (n) n.value = name || '';

  savePart = function(id, linkJobId){
    var old = (db.parts || []).find(function(y){ return y.id === id; }) || {};
    var x = {
      ...old,
      id: id || gid(),
      name: pn.value,
      cost: Number(pc.value || 0),
      charge: Number(pch.value || 0),
      supplier: ps.value
    };
    var i = db.parts.findIndex(function(y){ return y.id === x.id; });
    if (i < 0) db.parts.push(x); else db.parts[i] = x;

    if (linkJobId) {
      var j = db.jobs.find(function(y){ return y.id === linkJobId; });
      if (j) {
        j.partIds = Array.isArray(j.partIds) ? j.partIds : [];
        j.partQuantities = j.partQuantities || {};
        if (!j.partIds.includes(x.id)) j.partIds.push(x.id);
        j.partQuantities[x.id] = Math.max(1, Number((document.getElementById('pqty') || {}).value || 1));
      }
    }
    save(); closeM(); render();
  };

    var q = j.partQuantities || {};

        var checked = linked.has(p.id);
        var qty = Math.max(1, Number(q[p.id] || 1));
        return '<div style="display:grid;grid-template-columns:28px 1fr 76px;gap:9px;align-items:center;padding:10px 0;border-top:1px solid var(--line)">' +
          '<input type="checkbox" class="jobPartCheck" value="' + p.id + '" ' + (checked ? 'checked' : '') + ' style="width:22px;height:22px;margin:0">' +
          '<div><b>' + esc(p.name) + '</b><br><span class="muted">Each ' + money(p.charge != null ? p.charge : p.cost) + ' • Cost ' + money(p.cost) + '</span></div>' +

      '<p class="muted">New manual parts are saved in the Parts tab and linked to this job automatically.</p>';

  saveJobPartSelection = function(jobId){
    var j = (db.jobs || []).find(function(x){ return x.id === jobId; });
    if (!j) return;
    var checks = Array.from(document.querySelectorAll('.jobPartCheck:checked'));
    j.partIds = checks.map(function(x){ return x.value; });
    j.partQuantities = {};
    checks.forEach(function(ch){
      var qInput = document.querySelector('.jobPartQty[data-part-id="' + ch.value + '"]');
      j.partQuantities[ch.value] = Math.max(1, Number(qInput && qInput.value || 1));
    });
    save(); closeM(); render();
  };

        name: line.name,
        qty: line.qty,
        unitPrice: line.unitPrice,
        total: line.total
      };
    });

  function partSummaryHtml(j){
    var lines = jobPartLines(j);

    return lines.map(function(line){
      return '<div class="partline row"><span>' + esc(line.name) + ' × ' + line.qty + '</span><span>' + money(line.total) + '</span></div>';
    }).join('');
  }

  window.fillInvoiceCustomer = function(name){
    var c = customerByName(name);
    if (document.getElementById('ivc')) ivc.value = name || '';
    if (document.getElementById('ive')) ive.value = c.email || '';
  };

  fillCustomerEmail = function(name){
    var c = customerByName(name);
    if (document.getElementById('ive')) ive.value = c.email || '';
  };

  fillInvoiceFromJob = function(){
    var j = db.jobs.find(function(x){ return x.id === ivjob.value; });
    if (!j) {
      ivhours.value = 0;
      ivl.value = '0.00';
      ivp.value = '0.00';
      if (document.getElementById('ivPartLines')) ivPartLines.innerHTML = '<div class="muted">No parts linked to this job.</div>';
      return;
    }
    ivc.value = j.customer || '';
    if (document.getElementById('ivcustsel')) ivcustsel.value = j.customer || '';
    fillCustomerEmail(j.customer || '');
    ivhours.value = Number(j.hours || 0);
    recalcInvoiceLabour();
    var lines = jobPartLines(j);
    ivp.value = lines.reduce(function(a,x){ return a + x.total; }, 0).toFixed(2);
    if (document.getElementById('ivPartLines')) ivPartLines.innerHTML = partSummaryHtml(j);
  };

  saveInvoice = function(){
    recalcInvoiceLabour();
    var jobId = ivjob.value || '';
    var j = db.jobs.find(function(x){ return x.id === jobId; }) || null;
    var c = customerByName(ivc.value);
    var partLines = invoicePartSnapshot(j);
    var partTotal = partLines.reduce(function(a,x){ return a + x.total; }, 0);
    ivp.value = partTotal.toFixed(2);

    var total = Number(ivl.value || 0) + partTotal + Number(ivt.value || 0) + Number(ivo.value || 0);
    db.invoices.push({
      id: gid(),
      number: ivn.value,
      customer: ivc.value,
      customerId: c.id || '',
      email: ive.value,
      billedTo: {
        name: ivc.value,
        phone: c.phone || '',
        email: ive.value || c.email || '',
        address: c.address || ''
      },
      date: ivd.value,
      jobId: jobId,
      hours: Number(ivhours.value || 0),
      labour: Number(ivl.value || 0),
      partLines: partLines,
      parts: partTotal,
      travel: Number(ivt.value || 0),
      other: Number(ivo.value || 0),
      total: total,
      paid: false
    });
    if (j) j.hours = Number(ivhours.value || 0);
    syncJobPaymentStatus(jobId);
    save(); closeM(); render();
  };

  // ---------- Invoice rendering ----------
  function invoiceLines(i){
    if (Array.isArray(i.partLines) && i.partLines.length) return i.partLines;
    var j = (db.jobs || []).find(function(x){ return x.id === i.jobId; });
    if (j) return invoicePartSnapshot(j);
    return [];
  }

  function invoiceCustomer(i){
    var billed = i.billedTo || {};
    var current = customerByName(i.customer || '');
    return {
      name: billed.name || i.customer || current.name || '',
      phone: billed.phone || current.phone || '',
      email: billed.email || i.email || current.email || '',
      address: billed.address || current.address || ''
    };
  }

  function invoiceVehicle(i){
    var j = (db.jobs || []).find(function(x){ return x.id === i.jobId; }) || {};
    var c = customerByName(i.customer || '');
    return {
      reg: j.reg || c.reg || c.vehicle || '',
      make: j.make || c.make || '',
      model: j.model || c.model || '',
      engineSize: j.engineSize || c.engineSize || '',
      title: j.title || ''
    };
  }

  function invoiceHtmlV17(i){
    var settings = db.settings || {};
    var company = settings.companyName || 'Mechanic Mate';
    var logo = settings.companyLogo || '';
    var cust = invoiceCustomer(i);
    var vehicle = invoiceVehicle(i);
    var lines = invoiceLines(i);
    var partsSubtotal = lines.reduce(function(a,x){ return a + Number(x.total || (Number(x.qty||1) * Number(x.unitPrice||0))); }, 0);
    if (!partsSubtotal && Number(i.parts || 0)) partsSubtotal = Number(i.parts || 0);

    var partsRows = lines.map(function(line){
      var qty = Number(line.qty || 1);
      var unit = Number(line.unitPrice || 0);
      var lineTotal = Number(line.total || qty * unit);
      return '<tr><td>' + esc(line.name || 'Part') + '</td><td>' + qty + '</td><td>' + money(unit) + '</td><td>' + money(lineTotal) + '</td></tr>';
    }).join('');

    if (!partsRows && partsSubtotal) {
      partsRows = '<tr><td>Parts</td><td>1</td><td>' + money(partsSubtotal) + '</td><td>' + money(partsSubtotal) + '</td></tr>';
    }

    var contact = [settings.companyPhone, settings.companyEmail].filter(Boolean).map(esc).join('<br>');
    var vehicleBits = [vehicle.make, vehicle.model, vehicle.engineSize].filter(Boolean).map(esc).join(' • ');

    return '<div class="inline-invoice">' +
      '<div class="inv-head"><div>' +
        (logo ? '<img class="inv-logo" src="' + logo + '" alt="Company logo">' : '') +
        '<div style="font-weight:900;font-size:20px">' + esc(company) + '</div>' +
        (contact ? '<div class="invoice-contact">' + contact + '</div>' : '') +
      '</div><div style="text-align:right"><div class="inv-title">INVOICE</div>' +
        '<div class="inv-meta">' + esc(i.number || '') + '<br>' + esc(i.date || '') + '</div>' +
        '<div style="margin-top:7px;font-weight:900">' + (i.paid ? 'PAID' : 'UNPAID') + '</div>' +
      '</div></div>' +

      '<div class="bill-grid">' +
        '<div class="bill-box"><b>BILLED TO</b><br>' +
          esc(cust.name) +
          (cust.address ? '<br>' + esc(cust.address).replace(/\n/g,'<br>') : '') +
          (cust.phone ? '<br>' + esc(cust.phone) : '') +
          (cust.email ? '<br>' + esc(cust.email) : '') +
        '</div>' +
        '<div class="bill-box"><b>VEHICLE / JOB</b><br>' +
          (vehicle.reg ? 'Registration: ' + esc(vehicle.reg) + '<br>' : '') +
          (vehicleBits ? vehicleBits + '<br>' : '') +
          (vehicle.title ? 'Job: ' + esc(vehicle.title) : '') +
        '</div>' +
      '</div>' +

      (Number(i.labour || 0) ? '<table><tbody><tr><td><b>Labour</b>' +
        (i.hours ? ' — ' + esc(i.hours) + ' hours @ ' + money(db.settings.hourlyRate || 0) + '/hr' : '') +
        '</td><td style="text-align:right"><b>' + money(i.labour) + '</b></td></tr></tbody></table>' : '') +

      (partsRows ? '<div style="margin-top:18px;font-weight:900">PARTS USED</div>' +
        '<table class="parts-table"><thead><tr><th>Part</th><th>Qty</th><th>Each</th><th>Total</th></tr></thead><tbody>' +
        partsRows +
        '<tr class="parts-subtotal"><td colspan="3">Parts subtotal</td><td>' + money(partsSubtotal) + '</td></tr>' +
        '</tbody></table>' : '') +

      ((Number(i.travel || 0) || Number(i.other || 0)) ?
        '<table><tbody>' +
          (Number(i.travel || 0) ? '<tr><td>Travel / call-out</td><td>' + money(i.travel) + '</td></tr>' : '') +
          (Number(i.other || 0) ? '<tr><td>Other</td><td>' + money(i.other) + '</td></tr>' : '') +
        '</tbody></table>' : '') +

      '<div class="inv-total">Total: ' + money(i.total) + '</div>' +
    '</div>';
  }

  // Replace the invoice functions that v16 repaired, keeping the same button wiring.
  window.viewInvoice = function(id, button){
    var i = (db.invoices || []).find(function(x){ return x.id === id; });
    if (!i) { alert('Invoice not found.'); return; }
    if (window.closeInlineInvoice) closeInlineInvoice();

    var host = document.createElement('div');
    host.id = 'inlineInvoicePreview';

    var actions = document.createElement('div');
    actions.className = 'inline-actions';

    var closeBtn = document.createElement('button');
    closeBtn.className = 'secondary';
    closeBtn.textContent = 'Close invoice';
    closeBtn.addEventListener('click', function(){ closeInlineInvoice(); });

    var printBtn = document.createElement('button');
    printBtn.textContent = 'Print / Save PDF';
    printBtn.addEventListener('click', function(){ printShareInvoice(id); });

    var emailBtn = document.createElement('button');
    emailBtn.textContent = 'Email';
    emailBtn.addEventListener('click', function(){ emailInvoice(id); });

    actions.append(closeBtn, printBtn, emailBtn);

    var content = document.createElement('div');
    content.innerHTML = invoiceHtmlV17(i);
    host.append(actions, content);

    var card = button && button.closest ? button.closest('.card') : null;
    (card || document.getElementById('app')).appendChild(host);
    try { host.scrollIntoView({behavior:'smooth', block:'start'}); } catch(e) { host.scrollIntoView(); }
  };

  window.printShareInvoice = function(id){
    var i = (db.invoices || []).find(function(x){ return x.id === id; });
    if (!i) { alert('Invoice not found.'); return; }
    var host = document.getElementById('invoicePrintHost');
    if (!host) {
      host = document.createElement('div');
      host.id = 'invoicePrintHost';
      document.body.appendChild(host);
    }
    host.innerHTML = invoiceHtmlV17(i);
    host.style.display = 'block';
    setTimeout(function(){
      window.print();
      setTimeout(function(){ host.style.display='none'; host.innerHTML=''; }, 750);
    }, 100);
  };

  window.emailInvoice = function(id){
    var i = (db.invoices || []).find(function(x){ return x.id === id; });
    if (!i) { alert('Invoice not found.'); return; }
    var cust = invoiceCustomer(i);
    var vehicle = invoiceVehicle(i);
    var settings = db.settings || {};
    var subject = 'Invoice ' + (i.number || '') + ' - ' + (settings.companyName || 'Mechanic Mate');
    var body =
      (settings.companyName || 'Mechanic Mate') + '\n' +
      (settings.companyPhone ? settings.companyPhone + '\n' : '') +
      (settings.companyEmail ? settings.companyEmail + '\n' : '') +
      '\nInvoice: ' + (i.number || '') +
      '\nDate: ' + (i.date || '') +
      '\nBilled to: ' + cust.name +
      (vehicle.reg ? '\nRegistration: ' + vehicle.reg : '') +
      '\nTotal: ' + money(i.total || 0) +
      '\nStatus: ' + (i.paid ? 'PAID' : 'UNPAID');

    window.location.href = 'mailto:' + encodeURIComponent(cust.email || i.email || '') +
      '?subject=' + encodeURIComponent(subject) +
      '&body=' + encodeURIComponent(body);
  };


  window.deleteJobV32=function(id){
    var j=(db.jobs||[]).find(function(x){return x.id===id;});
    if(!j){alert('Job not found.');return;}
    var linkedInvoices=(db.invoices||[]).filter(function(i){return i.jobId===id;});
    var msg='Are you sure you want to delete this job?\n\n'+
      (j.title||'Job')+(j.reg?' • '+j.reg:'')+
      '\n\nAny parts allocated to this job will return to available stock.';
    if(linkedInvoices.length){
      msg+='\n\nNote: '+linkedInvoices.length+' linked invoice'+(linkedInvoices.length===1?' will':'s will')+' be kept as historical invoice records.';
    }
    if(!confirm(msg))return;
    db.jobs=db.jobs.filter(function(x){return x.id!==id;});
    // Keep invoices, but remove the live job link to avoid dangling references.
    linkedInvoices.forEach(function(i){
      if(!i.deletedJobSnapshot){
        i.deletedJobSnapshot={
          title:j.title||'',
          reg:j.reg||'',
          make:j.make||'',
          model:j.model||'',
          engineSize:j.engineSize||'',
          customer:j.customer||''
        };
      }
      i.jobId='';
    });
    // If this job came from a quote, allow the quote to be converted again if desired.
    (db.quotes||[]).forEach(function(q){
      if(q.convertedJobId===id){
        q.convertedJobId='';
        if(q.status==='Converted') q.status='Accepted';
      }
    });
    save();
    closeM();
    render();
    alert('Job deleted.');
  };

  save();
  render();
})();
</script>


<script>
(function(){
  db.parts = (db.parts || []).map(function(p){
    if (p.partNo == null) p.partNo = '';
    return p;
  });

  partForm = function(id, linkJobId){
    id = id || ''; linkJobId = linkJobId || '';
    var p = (db.parts || []).find(function(x){ return x.id === id; }) || {};
    var qty = 1;
    if (linkJobId) {
      var j = (db.jobs || []).find(function(x){ return x.id === linkJobId; });
      qty = Number(j && j.partQuantities && j.partQuantities[p.id] || 1);
    }
    openModal(id ? 'Edit Part' : 'Add Part',
      '<label>Part / expense</label><input id="pn" value="' + esc(p.name || '') + '">' +
      '<label>Part No.</label><input id="pno" value="' + esc(p.partNo || '') + '" placeholder="e.g. 038 971 600">' +
      '<div class="two"><div><label>Your cost (£ each)</label><input id="pc" type="number" min="0" step="0.01" value="' + Number(p.cost || 0) + '"></div>' +
      '<div><label>Customer charge (£ each)</label><input id="pch" type="number" min="0" step="0.01" value="' + Number(p.charge != null ? p.charge : p.cost || 0) + '"></div></div>' +
      '<label>Supplier</label><input id="ps" value="' + esc(p.supplier || '') + '">' +
      (linkJobId ? '<label>Quantity used on this job</label><input id="pqty" type="number" min="1" step="1" value="' + qty + '">' : '') +
      '<button class="primary" onclick="savePart(\'' + id + '\',\'' + linkJobId + '\')">Save' + (linkJobId ? ' & link to job' : '') + '</button>'
    );
  };

  savePart = function(id, linkJobId){
    var old = (db.parts || []).find(function(y){ return y.id === id; }) || {};
    var x = {
      ...old,
      id: id || gid(),
      name: pn.value,
      partNo: pno.value,
      cost: Number(pc.value || 0),
      charge: Number(pch.value || 0),
      supplier: ps.value
    };
    var i = db.parts.findIndex(function(y){ return y.id === x.id; });
    if (i < 0) db.parts.push(x); else db.parts[i] = x;

    if (linkJobId) {
      var j = db.jobs.find(function(y){ return y.id === linkJobId; });
      if (j) {
        j.partIds = Array.isArray(j.partIds) ? j.partIds : [];
        j.partQuantities = j.partQuantities || {};
        if (!j.partIds.includes(x.id)) j.partIds.push(x.id);
        j.partQuantities[x.id] = Math.max(1, Number((document.getElementById('pqty') || {}).value || 1));
      }
    }
    save(); closeM(); render();
  };

  jobPartLines = function(j){
    if (!j) return [];
    return (j.partIds || []).map(function(id){
      var part = (db.parts || []).find(function(p){ return p.id === id; });
      if (!part) return null;
      var qty = Number((j.partQuantities || {})[id] || 1);
      if (!Number.isFinite(qty) || qty <= 0) qty = 1;
      var unit = Number(part.charge != null ? part.charge : part.cost || 0);
      return {
        partId: part.id,
        name: part.name || 'Part',
        partNo: part.partNo || '',
        qty: qty,
        unitPrice: unit,
        total: qty * unit,
        cost: Number(part.cost || 0),
        supplier: part.supplier || ''
      };
    }).filter(Boolean);
  };
  window.jobPartLines = jobPartLines;

  parts = function(){
    return '<div class="row"><h2>Parts</h2><button class="primary" onclick="partForm()">＋ Add</button></div>' +
      ((db.parts || []).slice().reverse().map(function(p){
        var uses = (db.jobs || []).filter(function(j){ return (j.partIds || []).includes(p.id); });
        var usage = uses.length ? uses.map(function(j){
          return esc(j.title || j.reg || 'Job') + ' × ' + Math.max(1, Number((j.partQuantities || {})[p.id] || 1));
        }).join(', ') : 'Not linked to a job';
        return '<div class="card"><div class="row"><b>' + esc(p.name) + '</b><span class="price">' + money(p.charge != null ? p.charge : p.cost) + ' each</span></div>' +
          (p.partNo ? '<div class="muted"><b>Part No:</b> ' + esc(p.partNo) + '</div>' : '') +
          '<div class="muted">Cost ' + money(p.cost) + (p.supplier ? ' • ' + esc(p.supplier) : '') + '</div>' +
          '<div class="muted">' + (uses.length ? 'Used on: ' : '') + usage + '</div>' +
          '<div class="actions"><button onclick="partForm(\'' + p.id + '\')">Edit</button><button class="danger" onclick="deletePart(\'' + p.id + '\')">Delete</button></div></div>';
      }).join('') || '<div class="empty">No parts.</div>');
  };

  invoicePartSnapshot = function(j){
    return jobPartLines(j).map(function(line){
      return {
        partId: line.partId,
        name: line.name,
        partNo: line.partNo || '',
        qty: line.qty,
        unitPrice: line.unitPrice,
        total: line.total
      };
    });
  };

  function invoiceLinesV20(i){
    if (Array.isArray(i.partLines) && i.partLines.length) {
      return i.partLines.map(function(line){
        if (line.partNo == null) {
          var current = (db.parts || []).find(function(p){ return p.id === line.partId; });
          line.partNo = current && current.partNo || '';
        }
        return line;
      });
    }
    var j = (db.jobs || []).find(function(x){ return x.id === i.jobId; });
    return j ? invoicePartSnapshot(j) : [];
  }

  function currentCustomer(i){
    var billed = i.billedTo || {};
    var c = (db.customers || []).find(function(x){ return x.name === i.customer; }) || {};
    return {name:billed.name||i.customer||c.name||'', phone:billed.phone||c.phone||'', email:billed.email||i.email||c.email||'', address:billed.address||c.address||''};
  }

  function currentVehicle(i){
    var j = (db.jobs || []).find(function(x){ return x.id === i.jobId; }) || {};
    var c = (db.customers || []).find(function(x){ return x.name === i.customer; }) || {};
    return {reg:j.reg||c.reg||c.vehicle||'', make:j.make||c.make||'', model:j.model||c.model||'', engineSize:j.engineSize||c.engineSize||'', title:j.title||''};
  }

  function invoiceHtmlV20(i){
    var settings = db.settings || {};
    var company = settings.companyName || 'Mechanic Mate';
    var logo = settings.companyLogo || '';
    var cust = currentCustomer(i);
    var vehicle = currentVehicle(i);
    var lines = invoiceLinesV20(i);
    var partsSubtotal = lines.reduce(function(a,x){ return a + Number(x.total || (Number(x.qty||1) * Number(x.unitPrice||0))); }, 0);
    if (!partsSubtotal && Number(i.parts || 0)) partsSubtotal = Number(i.parts || 0);

    var partsRows = lines.map(function(line){
      var qty = Number(line.qty || 1);
      var unit = Number(line.unitPrice || 0);
      var lineTotal = Number(line.total || qty * unit);
      return '<tr><td>' + esc(line.name || 'Part') + '</td><td>' + esc(line.partNo || '') + '</td><td>' + qty + '</td><td>' + money(unit) + '</td><td>' + money(lineTotal) + '</td></tr>';
    }).join('');

    if (!partsRows && partsSubtotal) partsRows = '<tr><td>Parts</td><td></td><td>1</td><td>' + money(partsSubtotal) + '</td><td>' + money(partsSubtotal) + '</td></tr>';

    var contact = [settings.companyPhone, settings.companyEmail].filter(Boolean).map(esc).join('<br>');
    var vehicleBits = [vehicle.make, vehicle.model, vehicle.engineSize].filter(Boolean).map(esc).join(' • ');

    return '<div class="inline-invoice">' +
      '<div class="inv-head"><div>' +
        (logo ? '<img class="inv-logo" src="' + logo + '" alt="Company logo">' : '') +
        '<div style="font-weight:900;font-size:20px">' + esc(company) + '</div>' +
        (contact ? '<div class="invoice-contact">' + contact + '</div>' : '') +
      '</div><div style="text-align:right"><div class="inv-title">INVOICE</div>' +
        '<div class="inv-meta">' + esc(i.number || '') + '<br>' + esc(i.date || '') + '</div>' +
        '<div style="margin-top:7px;font-weight:900">' + (i.paid ? 'PAID' : 'UNPAID') + '</div></div></div>' +
      '<div class="bill-grid"><div class="bill-box"><b>BILLED TO</b><br>' + esc(cust.name) +
        (cust.address ? '<br>' + esc(cust.address).replace(/\n/g,'<br>') : '') +
        (cust.phone ? '<br>' + esc(cust.phone) : '') +
        (cust.email ? '<br>' + esc(cust.email) : '') +
      '</div><div class="bill-box"><b>VEHICLE / JOB</b><br>' +
        (vehicle.reg ? 'Registration: ' + esc(vehicle.reg) + '<br>' : '') +
        (vehicleBits ? vehicleBits + '<br>' : '') +
        (vehicle.title ? 'Job: ' + esc(vehicle.title) : '') + '</div></div>' +
      (Number(i.labour || 0) ? '<table><tbody><tr><td><b>Labour</b>' + (i.hours ? ' — ' + esc(i.hours) + ' hours @ ' + money(db.settings.hourlyRate || 0) + '/hr' : '') + '</td><td style="text-align:right"><b>' + money(i.labour) + '</b></td></tr></tbody></table>' : '') +
      (partsRows ? '<div style="margin-top:18px;font-weight:900">PARTS USED</div><table class="parts-table parts-table-v20"><thead><tr><th>Part</th><th>Part No.</th><th>Qty</th><th>Each</th><th>Total</th></tr></thead><tbody>' +
        partsRows + '<tr class="parts-subtotal"><td colspan="4">Parts subtotal</td><td>' + money(partsSubtotal) + '</td></tr></tbody></table>' : '') +
      ((Number(i.travel || 0) || Number(i.other || 0)) ? '<table><tbody>' +
        (Number(i.travel || 0) ? '<tr><td>Travel / call-out</td><td>' + money(i.travel) + '</td></tr>' : '') +
        (Number(i.other || 0) ? '<tr><td>Other</td><td>' + money(i.other) + '</td></tr>' : '') + '</tbody></table>' : '') +
      '<div class="inv-total">Total: ' + money(i.total) + '</div></div>';
  }

  window.viewInvoice = function(id, button){
    var i = (db.invoices || []).find(function(x){ return x.id === id; });
    if (!i) { alert('Invoice not found.'); return; }
    if (window.closeInlineInvoice) closeInlineInvoice();
    var host = document.createElement('div'); host.id = 'inlineInvoicePreview';
    var actions = document.createElement('div'); actions.className = 'inline-actions';
    var closeBtn = document.createElement('button'); closeBtn.className='secondary'; closeBtn.textContent='Close invoice'; closeBtn.addEventListener('click', function(){closeInlineInvoice();});
    var printBtn = document.createElement('button'); printBtn.textContent='Print / Save PDF'; printBtn.addEventListener('click', function(){printShareInvoice(id);});
    var emailBtn = document.createElement('button'); emailBtn.textContent='Email'; emailBtn.addEventListener('click', function(){emailInvoice(id);});
    actions.append(closeBtn, printBtn, emailBtn);
    var content = document.createElement('div'); content.innerHTML = invoiceHtmlV20(i);
    host.append(actions, content);
    var card = button && button.closest ? button.closest('.card') : null;
    (card || document.getElementById('app')).appendChild(host);
    try{host.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){host.scrollIntoView();}
  };

  window.printShareInvoice = function(id){
    var i = (db.invoices || []).find(function(x){ return x.id === id; });
    if (!i) { alert('Invoice not found.'); return; }
    var host = document.getElementById('invoicePrintHost');
    if (!host){ host=document.createElement('div'); host.id='invoicePrintHost'; document.body.appendChild(host); }
    host.innerHTML = invoiceHtmlV20(i); host.style.display='block';
    setTimeout(function(){ window.print(); setTimeout(function(){host.style.display='none';host.innerHTML='';},750); },100);
  };

  save();
  render();
})();
</script>


<script>
(function(){
  // v21 — create a real PDF locally and share it as a file.
  // No server or third-party PDF library required.

  function v21Invoice(id){
    return (db.invoices || []).find(function(x){ return x.id === id; });
  }

  function v21Customer(i){
    var billed = i.billedTo || {};
    var c = (db.customers || []).find(function(x){ return x.name === i.customer; }) || {};
    return {
      name: billed.name || i.customer || c.name || '',
      phone: billed.phone || c.phone || '',
      email: billed.email || i.email || c.email || '',
      address: billed.address || c.address || ''
    };
  }

  function v21Vehicle(i){
    var j = (db.jobs || []).find(function(x){ return x.id === i.jobId; }) || {};
    var c = (db.customers || []).find(function(x){ return x.name === i.customer; }) || {};
    return {
      reg: j.reg || c.reg || c.vehicle || '',
      make: j.make || c.make || '',
      model: j.model || c.model || '',
      engineSize: j.engineSize || c.engineSize || '',
      title: j.title || ''
    };
  }

  function v21PartLines(i){
    if (Array.isArray(i.partLines) && i.partLines.length) {
      return i.partLines.map(function(line){
        var current = (db.parts || []).find(function(p){ return p.id === line.partId; }) || {};
        return {
          name: line.name || current.name || 'Part',
          partNo: line.partNo || current.partNo || '',
          qty: Number(line.qty || 1),
          unitPrice: Number(line.unitPrice || current.charge || current.cost || 0),
          total: Number(line.total || (Number(line.qty || 1) * Number(line.unitPrice || current.charge || current.cost || 0)))
        };
      });
    }
    var j = (db.jobs || []).find(function(x){ return x.id === i.jobId; });
    if (j && typeof window.jobPartLines === 'function') return window.jobPartLines(j);
    return [];
  }

  function pdfAscii(s){
    s = String(s == null ? '' : s);
    // WinAnsi-friendly substitutions. The pound sign is written as an octal PDF escape.
    return s
      .replace(/\\/g, '\\\\')
      .replace(/\(/g, '\\(')
      .replace(/\)/g, '\\)')
      .replace(/£/g, '\\243')
      .replace(/[–—]/g, '-')
      .replace(/[“”]/g, '"')
      .replace(/[‘’]/g, "'")
      .replace(/[^\x20-\x7E\\]/g, '');
  }

  function wrapPdfText(text, maxChars){
    var words = String(text || '').split(/\s+/);
    var lines = [], line = '';
    words.forEach(function(word){
      var test = line ? line + ' ' + word : word;
      if (test.length > maxChars && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    });
    if (line) lines.push(line);
    return lines.length ? lines : [''];
  }

  function makeInvoicePdfBlob(i){
    var settings = db.settings || {};
    var cust = v21Customer(i);
    var vehicle = v21Vehicle(i);
    var parts = v21PartLines(i);
    var pageW = 595, pageH = 842;
    var left = 46, right = 549;
    var pages = [];
    var cmds = [];
    var y = 790;

    function text(x, yy, size, value, bold){
      cmds.push('BT /' + (bold ? 'F2' : 'F1') + ' ' + size + ' Tf 1 0 0 1 ' +
        x.toFixed(1) + ' ' + yy.toFixed(1) + ' Tm (' + pdfAscii(value) + ') Tj ET');
    }
    function rightText(yy, size, value, bold){
      var str = String(value || '');
      var approx = str.replace(/\\243/g,'£').length * size * 0.52;
      text(Math.max(left, right - approx), yy, size, str, bold);
    }
    function line(yy){
      cmds.push('0.65 w ' + left + ' ' + yy.toFixed(1) + ' m ' + right + ' ' + yy.toFixed(1) + ' l S');
    }
    function newPage(){
      if (cmds.length) pages.push(cmds.join('\n'));
      cmds = [];
      y = 790;
      text(left, y, 18, settings.companyName || 'Mechanic Mate', true);
      rightText(y, 18, 'INVOICE ' + (i.number || ''), true);
      y -= 28;
    }
    function ensure(space){
      if (y - space < 65) newPage();
    }
    function wrapped(x, value, size, maxChars, bold, leading){
      leading = leading || (size + 4);
      wrapPdfText(value, maxChars).forEach(function(ln){
        ensure(leading + 2);
        text(x, y, size, ln, bold);
        y -= leading;
      });
    }

    // Header
    text(left, y, 22, settings.companyName || 'Mechanic Mate', true);
    rightText(y, 27, 'INVOICE', true);
    y -= 28;

    if (settings.companyPhone) { text(left, y, 10, settings.companyPhone, false); y -= 14; }
    if (settings.companyEmail) { text(left, y, 10, settings.companyEmail, false); y -= 14; }

    var metaY = 758;
    rightText(metaY, 11, i.number || '', true);
    rightText(metaY - 17, 10, i.date || '', false);
    rightText(metaY - 36, 11, i.paid ? 'PAID' : 'UNPAID', true);

    y -= 8;
    line(y); y -= 24;

    // Billed to
    text(left, y, 12, 'BILLED TO', true); y -= 18;
    wrapped(left, cust.name, 11, 50, false, 15);
    if (cust.address) {
      String(cust.address).split(/\n/).forEach(function(a){ wrapped(left, a, 10, 58, false, 14); });
    }
    if (cust.phone) { text(left, y, 10, cust.phone, false); y -= 14; }
    if (cust.email) { wrapped(left, cust.email, 10, 58, false, 14); }
    y -= 6;
    line(y); y -= 24;

    // Vehicle / job
    text(left, y, 12, 'VEHICLE / JOB', true); y -= 18;
    if (vehicle.reg) { text(left, y, 10, 'Registration: ' + vehicle.reg, false); y -= 15; }
    var vdesc = [vehicle.make, vehicle.model, vehicle.engineSize].filter(Boolean).join(' ');
    if (vdesc) { wrapped(left, vdesc, 10, 58, false, 15); }
    if (vehicle.title) { wrapped(left, 'Job: ' + vehicle.title, 10, 58, false, 15); }
    y -= 10;

    // Labour
    if (Number(i.labour || 0)) {
      ensure(35);
      var labourDesc = 'Labour';
      if (i.hours) labourDesc += ' - ' + i.hours + ' hours @ ' + money((db.settings || {}).hourlyRate || 0) + '/hr';
      text(left, y, 11, labourDesc, true);
      rightText(y, 11, money(i.labour), true);
      y -= 18;
      line(y); y -= 25;
    }

    // Parts
    if (parts.length || Number(i.parts || 0)) {
      ensure(65);
      text(left, y, 13, 'PARTS USED', true); y -= 22;
      text(left, y, 9, 'Part', true);
      text(265, y, 9, 'Part No.', true);
      text(375, y, 9, 'Qty', true);
      text(420, y, 9, 'Each', true);
      rightText(y, 9, 'Total', true);
      y -= 13; line(y); y -= 17;

      var partsSubtotal = 0;
      if (parts.length) {
        parts.forEach(function(part){
          ensure(34);
          var nameLines = wrapPdfText(part.name || 'Part', 28);
          var rows = Math.max(1, nameLines.length);
          nameLines.forEach(function(nm, idx){ text(left, y - idx*13, 9, nm, false); });
          text(265, y, 8.5, part.partNo || '', false);
          text(382, y, 9, String(part.qty || 1), false);
          text(420, y, 9, money(part.unitPrice || 0), false);
          rightText(y, 9, money(part.total || 0), false);
          partsSubtotal += Number(part.total || 0);
          y -= Math.max(18, rows*13 + 5);
        });
      } else {
        partsSubtotal = Number(i.parts || 0);
        text(left, y, 9, 'Parts', false);
        text(382, y, 9, '1', false);
        text(420, y, 9, money(partsSubtotal), false);
        rightText(y, 9, money(partsSubtotal), false);
        y -= 19;
      }
      line(y); y -= 18;
      text(left, y, 10, 'Parts subtotal', true);
      rightText(y, 10, money(partsSubtotal), true);
      y -= 24;
    }

    if (Number(i.travel || 0)) {
      ensure(20); text(left, y, 10, 'Travel / call-out', false); rightText(y, 10, money(i.travel), false); y -= 17;
    }
    if (Number(i.other || 0)) {
      ensure(20); text(left, y, 10, 'Other', false); rightText(y, 10, money(i.other), false); y -= 17;
    }

    ensure(42);
    line(y); y -= 28;
    rightText(y, 20, 'Total: ' + money(i.total || 0), true);

    pages.push(cmds.join('\n'));

    // Build a small standards-compliant PDF using built-in Helvetica fonts.
    var objects = [];
    objects[1] = '<< /Type /Catalog /Pages 2 0 R >>';

    var pageObjectNums = [];
    var contentObjectNums = [];
    var nextObj = 5;

    pages.forEach(function(content){
      pageObjectNums.push(nextObj++);
      contentObjectNums.push(nextObj++);
    });

    objects[2] = '<< /Type /Pages /Kids [' + pageObjectNums.map(function(n){return n+' 0 R';}).join(' ') + '] /Count ' + pages.length + ' >>';
    objects[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    objects[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';

    pages.forEach(function(content, idx){
      var pnum = pageObjectNums[idx], cnum = contentObjectNums[idx];
      objects[pnum] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pageW + ' ' + pageH + '] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + cnum + ' 0 R >>';
      objects[cnum] = '<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream';
    });

    var pdf = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
    var offsets = [0];
    for (var n=1; n<objects.length; n++) {
      if (!objects[n]) continue;
      offsets[n] = pdf.length;
      pdf += n + ' 0 obj\n' + objects[n] + '\nendobj\n';
    }

    var xref = pdf.length;
    pdf += 'xref\n0 ' + objects.length + '\n';
    pdf += '0000000000 65535 f \n';
    for (var k=1; k<objects.length; k++) {
      var off = offsets[k] || 0;
      pdf += String(off).padStart(10,'0') + ' 00000 n \n';
    }
    pdf += 'trailer\n<< /Size ' + objects.length + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF';

    // Latin-1 byte conversion keeps PDF offsets valid and supports WinAnsi £ via octal escape.
    var bytes = new Uint8Array(pdf.length);
    for (var b=0; b<pdf.length; b++) bytes[b] = pdf.charCodeAt(b) & 255;
    return new Blob([bytes], {type:'application/pdf'});
  }

  window.createInvoicePdfFile = function(id){
    var i = v21Invoice(id);
    if (!i) throw new Error('Invoice not found.');
    var safeNo = String(i.number || 'invoice').replace(/[^A-Za-z0-9_-]+/g,'-');
    var blob = makeInvoicePdfBlob(i);
    return new File([blob], safeNo + '.pdf', {type:'application/pdf'});
  };

  window.emailInvoice = async function(id){
    var i = v21Invoice(id);
    if (!i) { alert('Invoice not found.'); return; }

    var file;
    try {
      file = createInvoicePdfFile(id);
    } catch(err) {
      alert('Could not create the invoice PDF.');
      return;
    }

    var cust = v21Customer(i);

    var shareData = {

    };

    try {
      if (navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))) {
        await navigator.share(shareData);
        return;
      }
    } catch(err) {
      if (err && err.name === 'AbortError') return;
      // Continue to download fallback.
    }

    // Desktop / unsupported-browser fallback: save the PDF locally, then open an addressed email.
    var url = URL.createObjectURL(file);
    var a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);

    var subject = title + ' - ' + ((db.settings || {}).companyName || 'Mechanic Mate');
    var body = 'Hi ' + (cust.name || '') + ',\n\nPlease find invoice ' + (i.number || '') +
      ' for ' + money(i.total || 0) + '.\n\nThe PDF has been downloaded ready to attach.';
    setTimeout(function(){

    }, 500);
  };

  render();
})();

<script>
(function(){
  // v22 PDF fixes:
  // 1) Embed the saved company logo in the generated PDF.
  // 2) Move the header divider safely below PAID / UNPAID.

  function v22Invoice(id){
    return (db.invoices || []).find(function(x){ return x.id === id; });
  }

  function v22Customer(i){
    var billed = i.billedTo || {};
    var c = (db.customers || []).find(function(x){ return x.name === i.customer; }) || {};
    return {
      name: billed.name || i.customer || c.name || '',
      phone: billed.phone || c.phone || '',
      email: billed.email || i.email || c.email || '',
      address: billed.address || c.address || ''
    };
  }

  function v22Vehicle(i){
    var j = (db.jobs || []).find(function(x){ return x.id === i.jobId; }) || {};
    var c = (db.customers || []).find(function(x){ return x.name === i.customer; }) || {};
    return {
      reg: j.reg || c.reg || c.vehicle || '',
      make: j.make || c.make || '',
      model: j.model || c.model || '',
      engineSize: j.engineSize || c.engineSize || '',
      title: j.title || ''
    };
  }

  function v22PartLines(i){
    if (Array.isArray(i.partLines) && i.partLines.length) {
      return i.partLines.map(function(line){
        var current = (db.parts || []).find(function(p){ return p.id === line.partId; }) || {};
        var qty = Number(line.qty || 1);
        var unit = Number(line.unitPrice || current.charge || current.cost || 0);
        return {
          name: line.name || current.name || 'Part',
          partNo: line.partNo || current.partNo || '',
          includedParts: Array.isArray(line.includedParts) ? line.includedParts : (Array.isArray(current.includedParts) ? current.includedParts : []),
          qty: qty,
          unitPrice: unit,
          total: Number(line.total || qty * unit)
        };
      });
    }
    var j = (db.jobs || []).find(function(x){ return x.id === i.jobId; });
    if (j && typeof window.jobPartLines === 'function') return window.jobPartLines(j);
    return [];
  }

  function v22PdfEscape(s){
    s = String(s == null ? '' : s);
    return s
      .replace(/\\/g, '\\\\')
      .replace(/\(/g, '\\(')
      .replace(/\)/g, '\\)')
      .replace(/£/g, '\\243')
      .replace(/[–—]/g, '-')
      .replace(/[“”]/g, '"')
      .replace(/[‘’]/g, "'")
      .replace(/[^\x20-\x7E\\]/g, '');
  }

  function v22Wrap(text, maxChars){
    var words = String(text || '').split(/\s+/);
    var lines = [], line = '';
    words.forEach(function(word){
      var test = line ? line + ' ' + word : word;
      if (test.length > maxChars && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    });
    if (line) lines.push(line);
    return lines.length ? lines : [''];
  }

  function dataUrlToBytes(dataUrl){
    var base64 = String(dataUrl).split(',')[1] || '';
    var bin = atob(base64);
    var bytes = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function companyLogoAsJpeg(){
    var src = (db.settings || {}).companyLogo || '';
    if (!src) return null;

    // Existing JPEG logo can be embedded directly.
    if (/^data:image\/jpe?g;base64,/i.test(src)) {
      return await new Promise(function(resolve){
        var img = new Image();
        img.onload = function(){
          resolve({bytes:dataUrlToBytes(src), width:img.naturalWidth || img.width, height:img.naturalHeight || img.height});
        };
        img.onerror = function(){ resolve(null); };
        img.src = src;
      });
    }

    // PNG/other uploaded logos are converted to a small JPEG for PDF embedding.
    return await new Promise(function(resolve){
      var img = new Image();
      img.onload = function(){
        try {
          var max = 500;
          var scale = Math.min(1, max / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
          var w = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
          var h = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          var jpeg = canvas.toDataURL('image/jpeg',0.9);
          resolve({bytes:dataUrlToBytes(jpeg), width:w, height:h});
        } catch(e) {
          resolve(null);
        }
      };
      img.onerror = function(){ resolve(null); };
      img.src = src;
    });
  }

  async function makeInvoicePdfBlobV22(i){
    var settings = db.settings || {};
    var cust = v22Customer(i);
    var vehicle = v22Vehicle(i);
    var parts = v22PartLines(i);
    var logo = await companyLogoAsJpeg();

    var pageW = 595, pageH = 842;
    var left = 46, right = 549;
    var pages = [];
    var cmds = [];
    var y = 790;

    function text(x, yy, size, value, bold){
      cmds.push('BT /' + (bold ? 'F2' : 'F1') + ' ' + size + ' Tf 1 0 0 1 ' +
        x.toFixed(1) + ' ' + yy.toFixed(1) + ' Tm (' + v22PdfEscape(value) + ') Tj ET');
    }
    function rightText(yy, size, value, bold){
      var str = String(value || '');
      var approx = str.length * size * 0.52;
      text(Math.max(left, right - approx), yy, size, str, bold);
    }
    function line(yy){
      cmds.push('0.65 w ' + left + ' ' + yy.toFixed(1) + ' m ' + right + ' ' + yy.toFixed(1) + ' l S');
    }
    function addLogo(x, topY, maxW, maxH){
      if (!logo) return 0;
      var ratio = logo.width / logo.height;
      var w = maxW, h = w / ratio;
      if (h > maxH) { h = maxH; w = h * ratio; }
      var bottom = topY - h;
      cmds.push('q ' + w.toFixed(2) + ' 0 0 ' + h.toFixed(2) + ' ' +
        x.toFixed(2) + ' ' + bottom.toFixed(2) + ' cm /Im1 Do Q');
      return h;
    }
    function newPage(){
      if (cmds.length) pages.push(cmds.join('\n'));
      cmds = [];
      y = 790;
      text(left, y, 18, settings.companyName || 'Mechanic Mate', true);
      rightText(y, 18, 'INVOICE ' + (i.number || ''), true);
      y -= 28;
    }
    function ensure(space){
      if (y - space < 65) newPage();
    }
    function wrapped(x, value, size, maxChars, bold, leading){
      leading = leading || (size + 4);
      v22Wrap(value, maxChars).forEach(function(ln){
        ensure(leading + 2);
        text(x, y, size, ln, bold);
        y -= leading;
      });
    }

    // Header. Logo occupies the upper-left when available.
    var headerTop = 792;
    var logoH = addLogo(left, headerTop, 78, 72);
    var companyX = logo ? left + 92 : left;

    text(companyX, 786, 18, settings.companyName || 'Mechanic Mate', true);
    if (settings.companyPhone) text(companyX, 762, 9.5, settings.companyPhone, false);
    if (settings.companyEmail) text(companyX, 747, 9.5, settings.companyEmail, false);

    rightText(786, 27, 'INVOICE', true);
    rightText(754, 11, i.number || '', true);
    rightText(735, 10, i.date || '', false);
    rightText(711, 11, i.paid ? 'PAID' : 'UNPAID', true);

    // Divider is deliberately below the status so it never runs through it.
    y = 686;
    line(y);
    y -= 26;

    // Billed to
    text(left, y, 12, 'BILLED TO', true); y -= 18;
    wrapped(left, cust.name, 11, 50, false, 15);
    if (cust.address) {
      String(cust.address).split(/\n/).forEach(function(a){ wrapped(left, a, 10, 58, false, 14); });
    }
    if (cust.phone) { text(left, y, 10, cust.phone, false); y -= 14; }
    if (cust.email) wrapped(left, cust.email, 10, 58, false, 14);
    y -= 6;
    line(y); y -= 24;

    // Vehicle / job
    text(left, y, 12, 'VEHICLE / JOB', true); y -= 18;

    var vdesc = [vehicle.make, vehicle.model, vehicle.engineSize].filter(Boolean).join(' ');
    if (vdesc) wrapped(left, vdesc, 10, 58, false, 15);
    if (vehicle.title) wrapped(left, 'Job: ' + vehicle.title, 10, 58, false, 15);
    y -= 10;

    // Labour
    if (Number(i.labour || 0)) {
      ensure(35);
      var labourDesc = 'Labour';
      if (i.hours) labourDesc += ' - ' + i.hours + ' hours @ ' + money((db.settings || {}).hourlyRate || 0) + '/hr';
      text(left, y, 11, labourDesc, true);

      y -= 18;
      line(y); y -= 25;
    }

    // Parts
    if (parts.length || Number(i.parts || 0)) {
      ensure(65);
      text(left, y, 13, 'PARTS USED', true); y -= 22;
      text(left, y, 9, 'Part', true);
      text(265, y, 9, 'Part No.', true);
      text(375, y, 9, 'Qty', true);
      text(420, y, 9, 'Each', true);
      rightText(y, 9, 'Total', true);
      y -= 13; line(y); y -= 17;

      var partsSubtotal = 0;
      if (parts.length) {
        parts.forEach(function(part){
          ensure(34);
          var nameLines = v22Wrap(part.name || 'Part', 28);
          nameLines.forEach(function(nm, idx){ text(left, y - idx*13, 9, nm, false); });
          text(265, y, 8.5, part.partNo || '', false);
          text(382, y, 9, String(part.qty || 1), false);
          text(420, y, 9, money(part.unitPrice || 0), false);
          rightText(y, 9, money(part.total || 0), false);
          partsSubtotal += Number(part.total || 0);
          y -= Math.max(18, nameLines.length*13 + 5);
          if (Array.isArray(part.includedParts) && part.includedParts.length) {
            part.includedParts.forEach(function(sub){
              ensure(16);
              text(left + 14, y, 8.2, '- ' + (sub.name || '') + (Number(sub.qty || 1) > 1 ? ' x' + Number(sub.qty || 1) : ''), false);
              if (sub.partNo) text(265, y, 7.8, sub.partNo, false);
              y -= 13;
            });
            y -= 2;
          }
        });
      } else {
        partsSubtotal = Number(i.parts || 0);
        text(left, y, 9, 'Parts', false);
        text(382, y, 9, '1', false);
        text(420, y, 9, money(partsSubtotal), false);
        rightText(y, 9, money(partsSubtotal), false);
        y -= 19;
      }

      line(y); y -= 18;
      text(left, y, 10, 'Parts subtotal', true);
      rightText(y, 10, money(partsSubtotal), true);
      y -= 24;
    }

    if (Number(i.travel || 0)) {
      ensure(20);
      text(left, y, 10, 'Travel / call-out', false);
      rightText(y, 10, money(i.travel), false);
      y -= 17;

    if (Number(i.other || 0)) {
      ensure(20);
      text(left, y, 10, 'Other', false);
      rightText(y, 10, money(i.other), false);
      y -= 17;
    }

    ensure(42);
    line(y); y -= 28;
    rightText(y, 20, 'Total: ' + money(i.total || 0), true);
    pages.push(cmds.join('\n'));

    // Build PDF objects. If a logo exists, object 5 is the JPEG XObject.

    objects[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    objects[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';

    var nextObj = 5;
    var imageObj = null;
    if (logo) imageObj = nextObj++;

    var pageObjectNums = [];
    var contentObjectNums = [];
    pages.forEach(function(){
      pageObjectNums.push(nextObj++);
      contentObjectNums.push(nextObj++);
    });

    objects[2] = '<< /Type /Pages /Kids [' + pageObjectNums.map(function(n){return n+' 0 R';}).join(' ') + '] /Count ' + pages.length + ' >>';

    if (logo) {
      var bin = '';
      var chunk = 0x8000;
      for (var bi=0; bi<logo.bytes.length; bi+=chunk) {
        var sub = logo.bytes.subarray(bi, Math.min(bi+chunk, logo.bytes.length));
        bin += String.fromCharCode.apply(null, sub);
      }
      objects[imageObj] =
        '<< /Type /XObject /Subtype /Image /Width ' + logo.width +
        ' /Height ' + logo.height +
        ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' +
        logo.bytes.length + ' >>\nstream\n' + bin + '\nendstream';
    }

    pages.forEach(function(content, idx){
      var pnum = pageObjectNums[idx], cnum = contentObjectNums[idx];
      var xobj = logo ? ' /XObject << /Im1 ' + imageObj + ' 0 R >>' : '';
      objects[pnum] =
        '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pageW + ' ' + pageH +
        '] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>' + xobj +
        ' >> /Contents ' + cnum + ' 0 R >>';
      objects[cnum] = '<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream';
    });

    var pdf = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
    var offsets = [0];
    for (var n=1; n<objects.length; n++) {
      if (!objects[n]) continue;
      offsets[n] = pdf.length;
      pdf += n + ' 0 obj\n' + objects[n] + '\nendobj\n';
    }

    var xref = pdf.length;
    pdf += 'xref\n0 ' + objects.length + '\n';
    pdf += '0000000000 65535 f \n';
    for (var k=1; k<objects.length; k++) {
      var off = offsets[k] || 0;
      pdf += String(off).padStart(10,'0') + ' 00000 n \n';
    }
    pdf += 'trailer\n<< /Size ' + objects.length + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF';

    var bytes = new Uint8Array(pdf.length);
    for (var b=0; b<pdf.length; b++) bytes[b] = pdf.charCodeAt(b) & 255;
    return new Blob([bytes], {type:'application/pdf'});
  }

  window.createInvoicePdfFile = async function(id){

        await navigator.share(shareData);

      }

    }

    var url = URL.createObjectURL(file);
    var a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);

    var subject = title + ' - ' + ((db.settings || {}).companyName || 'Mechanic Mate');
    var body = 'Hi ' + (cust.name || '') + ',\n\nPlease find invoice ' + (i.number || '') +
      ' for ' + money(i.total || 0) + '.\n\nThe PDF has been downloaded ready to attach.';
    setTimeout(function(){
      window.location.href = 'mailto:' + encodeURIComponent(cust.email || i.email || '') +

  function normaliseDb(raw){

    return !expiry || (expiry * 1000) < (Date.now() + 60000);

  async function supabaseRequest(path, opts){
    opts = opts || {};
    const headers = Object.assign({
      'apikey': SUPABASE_KEY,
      'Content-Type': 'application/json'
    }, opts.headers || {});
    if(opts.auth !== false){
      const s = await ensureSession();
      if(!s || !s.access_token) throw new Error('Not signed in');
      headers['Authorization'] = 'Bearer ' + s.access_token;

    const res = await fetch(SUPABASE_URL + path, Object.assign({}, opts, {headers}));
    let body = null;
    const ct = res.headers.get('content-type') || '';
