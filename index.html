    if (cust.phone) { text(left, y, 10, cust.phone, false); y -= 14; }
    if (cust.email) wrapped(left, cust.email, 10, 58, false, 14);
    y -= 6;
    line(y); y -= 24;

    // Vehicle / job
    text(left, y, 12, 'VEHICLE / JOB', true); y -= 18;
    if (vehicle.reg) { text(left, y, 10, 'Registration: ' + vehicle.reg, false); y -= 15; }
    var vdesc = [vehicle.make, vehicle.model, vehicle.engineSize].filter(Boolean).join(' ');
    if (vdesc) wrapped(left, vdesc, 10, 58, false, 15);
    if (vehicle.title) wrapped(left, 'Job: ' + vehicle.title, 10, 58, false, 15);
    y -= 10;

    // Labour
    if (Number(i.labour || 0)) {
      ensure(35);
      var labourDesc = 'Labour';
      if (i.hours) labourDesc += ' - ' + i.hours + ' hours @ ' + money((db.settings || {}).hourlyRate || 0) + '/hr';
      text(left, y, 11, labourDesc, true);
      rightText(y, 11, money(i.labour), true);
      y -= 18;
      line(y); y -= 25;
    }

    // Parts
    if (parts.length || Number(i.parts || 0)) {
      ensure(65);
      text(left, y, 13, 'PARTS USED', true); y -= 22;
      text(left, y, 9, 'Part', true);
      text(265, y, 9, 'Part No.', true);
      text(375, y, 9, 'Qty', true);
      text(420, y, 9, 'Each', true);
      rightText(y, 9, 'Total', true);
      y -= 13; line(y); y -= 17;

      var partsSubtotal = 0;
      if (parts.length) {
        parts.forEach(function(part){
          ensure(34);
          var nameLines = v22Wrap(part.name || 'Part', 28);
          nameLines.forEach(function(nm, idx){ text(left, y - idx*13, 9, nm, false); });
          text(265, y, 8.5, part.partNo || '', false);
          text(382, y, 9, String(part.qty || 1), false);
          text(420, y, 9, money(part.unitPrice || 0), false);
          rightText(y, 9, money(part.total || 0), false);
          partsSubtotal += Number(part.total || 0);
          y -= Math.max(18, nameLines.length*13 + 5);
          if (Array.isArray(part.includedParts) && part.includedParts.length) {
            part.includedParts.forEach(function(sub){
              ensure(16);
              text(left + 14, y, 8.2, '- ' + (sub.name || '') + (Number(sub.qty || 1) > 1 ? ' x' + Number(sub.qty || 1) : ''), false);
              if (sub.partNo) text(265, y, 7.8, sub.partNo, false);
              y -= 13;
            });
            y -= 2;
          }
        });
      } else {
        partsSubtotal = Number(i.parts || 0);
        text(left, y, 9, 'Parts', false);
        text(382, y, 9, '1', false);
        text(420, y, 9, money(partsSubtotal), false);
        rightText(y, 9, money(partsSubtotal), false);
        y -= 19;
      }

      line(y); y -= 18;
      text(left, y, 10, 'Parts subtotal', true);
      rightText(y, 10, money(partsSubtotal), true);
      y -= 24;
    }

    if (Number(i.travel || 0)) {
      ensure(20);
      text(left, y, 10, 'Travel / call-out', false);
      rightText(y, 10, money(i.travel), false);
      y -= 17;
    }
    if (Number(i.other || 0)) {
      ensure(20);
      text(left, y, 10, 'Other', false);
      rightText(y, 10, money(i.other), false);
      y -= 17;
    }

    ensure(42);
    line(y); y -= 28;
    rightText(y, 20, 'Total: ' + money(i.total || 0), true);
    pages.push(cmds.join('\n'));

    // Build PDF objects. If a logo exists, object 5 is the JPEG XObject.
    var objects = [];
    objects[1] = '<< /Type /Catalog /Pages 2 0 R >>';
    objects[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    objects[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';

    var nextObj = 5;
    var imageObj = null;
    if (logo) imageObj = nextObj++;

    var pageObjectNums = [];
    var contentObjectNums = [];
    pages.forEach(function(){
      pageObjectNums.push(nextObj++);
      contentObjectNums.push(nextObj++);
    });

    objects[2] = '<< /Type /Pages /Kids [' + pageObjectNums.map(function(n){return n+' 0 R';}).join(' ') + '] /Count ' + pages.length + ' >>';

    if (logo) {
      var bin = '';
      var chunk = 0x8000;
      for (var bi=0; bi<logo.bytes.length; bi+=chunk) {
        var sub = logo.bytes.subarray(bi, Math.min(bi+chunk, logo.bytes.length));
        bin += String.fromCharCode.apply(null, sub);
      }
      objects[imageObj] =
        '<< /Type /XObject /Subtype /Image /Width ' + logo.width +
        ' /Height ' + logo.height +
        ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' +
        logo.bytes.length + ' >>\nstream\n' + bin + '\nendstream';
    }

    pages.forEach(function(content, idx){
      var pnum = pageObjectNums[idx], cnum = contentObjectNums[idx];
      var xobj = logo ? ' /XObject << /Im1 ' + imageObj + ' 0 R >>' : '';
      objects[pnum] =
        '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pageW + ' ' + pageH +
        '] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>' + xobj +
        ' >> /Contents ' + cnum + ' 0 R >>';
      objects[cnum] = '<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream';
    });

    var pdf = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
    var offsets = [0];
    for (var n=1; n<objects.length; n++) {
      if (!objects[n]) continue;
      offsets[n] = pdf.length;
      pdf += n + ' 0 obj\n' + objects[n] + '\nendobj\n';
    }

    var xref = pdf.length;
    pdf += 'xref\n0 ' + objects.length + '\n';
    pdf += '0000000000 65535 f \n';
    for (var k=1; k<objects.length; k++) {
      var off = offsets[k] || 0;
      pdf += String(off).padStart(10,'0') + ' 00000 n \n';
    }
    pdf += 'trailer\n<< /Size ' + objects.length + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF';

    var bytes = new Uint8Array(pdf.length);
    for (var b=0; b<pdf.length; b++) bytes[b] = pdf.charCodeAt(b) & 255;
    return new Blob([bytes], {type:'application/pdf'});
  }

  window.createInvoicePdfFile = async function(id){
    var i = v22Invoice(id);
    if (!i) throw new Error('Invoice not found.');
    var safeNo = String(i.number || 'invoice').replace(/[^A-Za-z0-9_-]+/g,'-');
    var blob = await makeInvoicePdfBlobV22(i);
    return new File([blob], safeNo + '.pdf', {type:'application/pdf'});
  };

  window.emailInvoice = async function(id){
    var i = v22Invoice(id);
    if (!i) { alert('Invoice not found.'); return; }

    var file;
    try {
      file = await createInvoicePdfFile(id);
    } catch(err) {
      console.error(err);
      alert('Could not create the invoice PDF.');
      return;
    }

    var cust = v22Customer(i);
    var title = 'Invoice ' + (i.number || '');
    var shareData = {
      title: title,
      text: 'Invoice ' + (i.number || '') + ' for ' + money(i.total || 0),
      files: [file]
    };

    try {
      if (navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))) {
        await navigator.share(shareData);
        return;
      }
    } catch(err) {
      if (err && err.name === 'AbortError') return;
    }

    var url = URL.createObjectURL(file);
    var a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);

    var subject = title + ' - ' + ((db.settings || {}).companyName || 'Mechanic Mate');
    var body = 'Hi ' + (cust.name || '') + ',\n\nPlease find invoice ' + (i.number || '') +
      ' for ' + money(i.total || 0) + '.\n\nThe PDF has been downloaded ready to attach.';
    setTimeout(function(){
      window.location.href = 'mailto:' + encodeURIComponent(cust.email || i.email || '') +
        '?subject=' + encodeURIComponent(subject) +
        '&body=' + encodeURIComponent(body);
    }, 500);
  };

  save();
  render();
})();
</script>


<script>
(function(){
  const SUPABASE_URL = 'https://ikjtezngfnophhjzjedi.supabase.co';
  const SUPABASE_KEY = 'sb_publishable__Tyf3b3tPIcmdC-JxvUykA_gos5pu9l';
  const SESSION_KEY = 'mechanic-mate-supabase-session';
  const LOCAL_UPDATED_KEY = 'mechanic-mate-local-updated-at';

  let cloudSession = null;
  let cloudSaveTimer = null;
  let cloudPushBusy = false;
  let cloudPullBusy = false;
  let cloudStatus = 'Not signed in';
  let cloudLastSync = '';
  let cloudError = '';

  function loadSession(){
    try{
      cloudSession = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    }catch(e){ cloudSession = null; }
  }

  function storeSession(s){
    cloudSession = s || null;
    if(s) localStorage.setItem(SESSION_KEY,JSON.stringify(s));
    else localStorage.removeItem(SESSION_KEY);
    updateCloudBadge();
  }

  function normaliseDb(raw){
    raw = raw && typeof raw === 'object' ? raw : {};
    raw.jobs = Array.isArray(raw.jobs) ? raw.jobs : [];
    raw.customers = Array.isArray(raw.customers) ? raw.customers : [];
    raw.parts = Array.isArray(raw.parts) ? raw.parts : [];
    raw.invoices = Array.isArray(raw.invoices) ? raw.invoices : [];
    raw.settings = raw.settings && typeof raw.settings === 'object' ? raw.settings : {};
    if(raw.settings.hourlyRate == null) raw.settings.hourlyRate = 45;
    if(raw.settings.companyName == null) raw.settings.companyName = '';
    if(raw.settings.companyLogo == null) raw.settings.companyLogo = '';
    if(raw.settings.companyPhone == null) raw.settings.companyPhone = '';
    if(raw.settings.companyEmail == null) raw.settings.companyEmail = '';
    return raw;
  }

  function localHasUsefulData(){
    return !!(
      (db.jobs && db.jobs.length) ||
      (db.customers && db.customers.length) ||
      (db.parts && db.parts.length) ||
      (db.invoices && db.invoices.length) ||
      (db.settings && (db.settings.companyName || db.settings.companyLogo || db.settings.companyPhone || db.settings.companyEmail))
    );
  }

  function sessionExpiresSoon(s){
    if(!s) return true;
    let expiry = Number(s.expires_at || 0);
    if(!expiry && s.expires_in && s.obtained_at) expiry = Number(s.obtained_at) + Number(s.expires_in);
    return !expiry || (expiry * 1000) < (Date.now() + 60000);
  }

  async function supabaseRequest(path, opts){
    opts = opts || {};
    const headers = Object.assign({
      'apikey': SUPABASE_KEY,
      'Content-Type': 'application/json'
    }, opts.headers || {});
    if(opts.auth !== false){
      const s = await ensureSession();
      if(!s || !s.access_token) throw new Error('Not signed in');
      headers['Authorization'] = 'Bearer ' + s.access_token;
    }
    const res = await fetch(SUPABASE_URL + path, Object.assign({}, opts, {headers}));
    let body = null;
    const ct = res.headers.get('content-type') || '';
    if(ct.includes('application/json')){
      try{ body = await res.json(); }catch(e){}
    }else{
      try{ body = await res.text(); }catch(e){}
    }
    if(!res.ok){
      const msg = body && (body.msg || body.message || body.error_description || body.error) || ('Request failed ('+res.status+')');
      throw new Error(msg);
    }
    return {res, body};
  }

  async function refreshSession(){
    if(!cloudSession || !cloudSession.refresh_token) return null;
    try{
      const result = await supabaseRequest('/auth/v1/token?grant_type=refresh_token',{
        method:'POST',
        auth:false,
        body:JSON.stringify({refresh_token:cloudSession.refresh_token})
      });
      const s = result.body;
      s.obtained_at = Math.floor(Date.now()/1000);
      storeSession(s);
      return s;
    }catch(e){
      storeSession(null);
      cloudStatus = 'Sign in required';
      cloudError = e.message || '';
      updateCloudBadge();
      return null;
    }
  }

  async function ensureSession(){
    if(!cloudSession) return null;
    if(sessionExpiresSoon(cloudSession)) return await refreshSession();
    return cloudSession;
  }

  function getUserId(){
    return cloudSession && cloudSession.user && cloudSession.user.id || '';
  }

  function getUserEmail(){
    return cloudSession && cloudSession.user && cloudSession.user.email || '';
  }

  function updateCloudBadge(){
    let badge = document.getElementById('cloudBadge');
    if(!badge){
      const top = document.querySelector('.topbar');
      if(top){
        badge = document.createElement('div');
        badge.id = 'cloudBadge';
        badge.className = 'cloud-badge off';
        top.appendChild(badge);
      }
    }
    if(!badge) return;
    if(!cloudSession){
      badge.className='cloud-badge off';
      badge.textContent='☁️ Local only';
    }else if(cloudError){
      badge.className='cloud-badge warn';
      badge.textContent='☁️ Sync issue';
    }else if(cloudPushBusy || cloudPullBusy){
      badge.className='cloud-badge warn';
      badge.textContent='☁️ Syncing…';
    }else{
      badge.className='cloud-badge ok';
      badge.textContent='☁️ Synced';
    }
  }

  function setCloudState(status,error){
    cloudStatus = status || '';
    cloudError = error || '';
    updateCloudBadge();
    if(page === 'Settings'){
      try{ render(); }catch(e){}
    }
  }

  async function cloudRow(){
    const uid = getUserId();
    if(!uid) return null;
    const result = await supabaseRequest('/rest/v1/mechanic_mate_data?select=data,updated_at&user_id=eq.'+encodeURIComponent(uid),{
      method:'GET',
      headers:{'Accept':'application/json'}
    });
    const rows = Array.isArray(result.body) ? result.body : [];
    return rows[0] || null;
  }

  async function pushCloudNow(){
    if(!cloudSession || cloudPushBusy) return false;
    cloudPushBusy = true;
    updateCloudBadge();
    try{
      const s = await ensureSession();
      if(!s) return false;
      const uid = getUserId();
      if(!uid) return false;
      const now = new Date().toISOString();
      await supabaseRequest('/rest/v1/mechanic_mate_data?on_conflict=user_id',{
        method:'POST',
        headers:{
          'Prefer':'resolution=merge-duplicates,return=minimal'
        },
        body:JSON.stringify({
          user_id:uid,
          data:db,
          updated_at:now
        })
      });
      cloudLastSync = now;
      localStorage.setItem(LOCAL_UPDATED_KEY,now);
      setCloudState('Synced','');
      return true;
    }catch(e){
      console.error('Cloud push failed',e);
      setCloudState('Sync failed',e.message || 'Could not save to cloud');
      return false;
    }finally{
      cloudPushBusy = false;
      updateCloudBadge();
    }
  }

  window.cloudScheduleSave = function(){
    if(!cloudSession) return;
    if(cloudSaveTimer) clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(function(){
      cloudSaveTimer = null;
      pushCloudNow();
    },700);
  };

  async function applyCloudData(row){
    if(!row || !row.data) return false;
    db = normaliseDb(row.data);
    localStorage.setItem(KEY,JSON.stringify(db));
    localStorage.setItem(LOCAL_UPDATED_KEY,row.updated_at || new Date().toISOString());
    cloudLastSync = row.updated_at || '';
    render();
    return true;
  }

  async function pullCloudIfNewer(force){
    if(!cloudSession || cloudPullBusy || cloudPushBusy || cloudSaveTimer) return false;
    cloudPullBusy = true;
    updateCloudBadge();
    try{
      const row = await cloudRow();
      if(!row) return false;
      const localTime = Date.parse(localStorage.getItem(LOCAL_UPDATED_KEY) || '') || 0;
      const cloudTime = Date.parse(row.updated_at || '') || 0;
      if(force || cloudTime > localTime + 500){
        await applyCloudData(row);
      }
      setCloudState('Synced','');
      return true;
    }catch(e){
      console.error('Cloud pull failed',e);
      setCloudState('Sync failed',e.message || 'Could not load cloud data');
      return false;
    }finally{
      cloudPullBusy = false;
      updateCloudBadge();
    }
  }

  async function firstSyncAfterLogin(){
    setCloudState('Checking cloud…','');
    cloudPullBusy = true;
    updateCloudBadge();
    try{
      const row = await cloudRow();
      cloudPullBusy = false;
      if(!row){
        setCloudState('Uploading this device…','');
        await pushCloudNow();
        return;
      }

      const localTime = Date.parse(localStorage.getItem(LOCAL_UPDATED_KEY) || '') || 0;
      const cloudTime = Date.parse(row.updated_at || '') || 0;

      if(!localHasUsefulData()){
        await applyCloudData(row);
        setCloudState('Downloaded cloud data','');
      }else if(!localTime){
        // Pre-v23 device with existing data: cloud wins only if it already clearly has useful data.
        const cloudData = normaliseDb(row.data || {});
        const cloudHasData = !!(
          cloudData.jobs.length || cloudData.customers.length || cloudData.parts.length ||
          cloudData.invoices.length || cloudData.settings.companyName || cloudData.settings.companyLogo
        );
        if(cloudHasData){
          const useCloud = confirm(
            'Cloud data already exists for this account.\n\n' +
            'OK = use the cloud copy on this device.\n' +
            'Cancel = upload this device’s current data to the cloud.'
          );
          if(useCloud) await applyCloudData(row);
          else await pushCloudNow();
        }else{
          await pushCloudNow();
        }
      }else if(cloudTime > localTime + 500){
        await applyCloudData(row);
      }else if(localTime > cloudTime + 500){
        await pushCloudNow();
      }

      cloudLastSync = row.updated_at || cloudLastSync;
      setCloudState('Synced','');
    }catch(e){
      cloudPullBusy = false;
      setCloudState('Sync failed',e.message || 'Could not complete first sync');
    }finally{
      updateCloudBadge();
    }
  }

  window.cloudSignIn = async function(){
    const email = String((document.getElementById('cloudEmail')||{}).value || '').trim();
    const password = String((document.getElementById('cloudPassword')||{}).value || '');
    if(!email || !password){ alert('Enter your email and password.'); return; }
    setCloudState('Signing in…','');
    try{
      const result = await supabaseRequest('/auth/v1/token?grant_type=password',{
        method:'POST',
        auth:false,
        body:JSON.stringify({email,password})
      });
      const s = result.body;
      s.obtained_at = Math.floor(Date.now()/1000);
      storeSession(s);
      await firstSyncAfterLogin();
      render();
    }catch(e){
      setCloudState('Sign in failed',e.message || '');
      alert('Sign in failed: ' + (e.message || 'Unknown error'));
    }
  };

  window.cloudSignUp = async function(){
    const email = String((document.getElementById('cloudEmail')||{}).value || '').trim();
    const password = String((document.getElementById('cloudPassword')||{}).value || '');
    if(!email || !password){ alert('Enter an email and password first.'); return; }
    if(password.length < 6){ alert('Use a password of at least 6 characters.'); return; }
    setCloudState('Creating account…','');
    try{
      const result = await supabaseRequest('/auth/v1/signup',{
        method:'POST',
        auth:false,
        body:JSON.stringify({email,password})
      });
      const body = result.body || {};
      if(body.access_token){
        body.obtained_at = Math.floor(Date.now()/1000);
        storeSession(body);
        await firstSyncAfterLogin();
        render();
        alert('Cloud account created and signed in.');
      }else{
        setCloudState('Check your email','');
        alert('Account created. Supabase requires email confirmation for this project, so check your inbox, confirm the address, then come back and tap Sign in.');
      }
    }catch(e){
      setCloudState('Sign up failed',e.message || '');
      alert('Could not create account: ' + (e.message || 'Unknown error'));
    }
  };

  window.cloudSignOut = function(){
    if(!confirm('Sign out of cloud sync on this device? Your local copy will stay on this device.')) return;
    storeSession(null);
    setCloudState('Not signed in','');
    render();
  };

  window.cloudSyncNow = async function(){
    if(!cloudSession){ alert('Sign in first.'); return; }
    if(cloudSaveTimer){
      clearTimeout(cloudSaveTimer);
      cloudSaveTimer = null;
      await pushCloudNow();
    }else{
      await pullCloudIfNewer(true);
    }
    render();
  };

  window.cloudUploadThisDevice = async function(){
    if(!cloudSession){ alert('Sign in first.'); return; }
    if(!confirm('Replace the cloud copy with the data currently on this device?')) return;
    await pushCloudNow();
    render();
  };

  window.cloudDownloadToDevice = async function(){
    if(!cloudSession){ alert('Sign in first.'); return; }
    if(!confirm('Replace this device’s local copy with the cloud copy?')) return;
    await pullCloudIfNewer(true);
    render();
  };

  const previousSettings = settings;
  settings = function(){
    let cloudHtml = '';
    if(cloudSession){
      cloudHtml =
        '<div class="card cloud-card"><b>Cloud sync</b>' +
        '<div class="cloud-status"><div class="cloud-email">☁️ ' + esc(getUserEmail()) + '</div>' +
        '<div class="muted">' + esc(cloudStatus || 'Signed in') +
        (cloudLastSync ? '<br>Last sync: ' + esc(new Date(cloudLastSync).toLocaleString()) : '') +
        (cloudError ? '<br>' + esc(cloudError) : '') + '</div></div>' +
        '<p class="muted">Changes are saved to Supabase automatically and can be opened from your other signed-in devices.</p>' +
        '<div class="actions"><button class="primary" onclick="cloudSyncNow()">Sync now</button>' +
        '<button onclick="cloudDownloadToDevice()">Download cloud copy</button>' +
        '<button onclick="cloudUploadThisDevice()">Upload this device</button>' +
        '<button class="danger" onclick="cloudSignOut()">Sign out</button></div></div>';
    }else{
      cloudHtml =
        '<div class="card cloud-card"><b>Cloud sync</b>' +
        '<p class="muted">Sign in with the same account on your phone and PC to use the same Mechanic Mate data on both.</p>' +
        '<label>Email</label><input id="cloudEmail" type="email" autocomplete="email" placeholder="you@example.com">' +
        '<label>Password</label><input id="cloudPassword" type="password" autocomplete="current-password" placeholder="Password">' +
        '<div class="actions"><button class="primary" onclick="cloudSignIn()">Sign in</button>' +
        '<button onclick="cloudSignUp()">Create cloud account</button></div>' +
        '<div class="cloud-status"><span class="muted">' + esc(cloudStatus) +
        (cloudError ? '<br>' + esc(cloudError) : '') + '</span></div></div>';
    }
    return cloudHtml + previousSettings();
  };

  loadSession();
  updateCloudBadge();

  if(cloudSession){
    ensureSession().then(function(s){
      if(s){
        firstSyncAfterLogin();
      }
    });
  }

  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState === 'visible' && cloudSession) pullCloudIfNewer(false);
  });
  window.addEventListener('focus',function(){
    if(cloudSession) pullCloudIfNewer(false);
  });
  window.addEventListener('online',function(){
    if(cloudSession){
      if(cloudSaveTimer){
        clearTimeout(cloudSaveTimer);
        cloudSaveTimer = null;
        pushCloudNow();
      }else{
        pullCloudIfNewer(false);
      }
    }
  });

  // Gentle periodic check while the app is open.
  setInterval(function(){
    if(cloudSession && document.visibilityState === 'visible') pullCloudIfNewer(false);
  },60000);

  render();
})();
</script>


<script>
(function(){
  // v24 migration: saved parts now represent purchased stock.
  db.parts = (db.parts || []).map(function(p){
    if(p.stockQty == null){
      // Existing parts were previously reusable catalogue entries.
      // Default them to one available item so nothing vanishes during upgrade.
      p.stockQty = 1;
    }
    p.stockQty = Math.max(0, Number(p.stockQty || 0));
    return p;
  });

  db.jobs = (db.jobs || []).map(function(j){
    j.partIds = Array.isArray(j.partIds) ? j.partIds : [];
    j.partQuantities = j.partQuantities && typeof j.partQuantities === 'object' ? j.partQuantities : {};
    return j;
  });

  function allocatedQty(partId){
    return (db.jobs || []).reduce(function(total,j){
      if(!(j.partIds || []).includes(partId)) return total;
      return total + Math.max(0, Number((j.partQuantities || {})[partId] || 0));
    },0);
  }

  function availableQty(part){
    return Math.max(0, Number(part.stockQty || 0) - allocatedQty(part.id));
  }

  window.partAvailableQty = availableQty;

  // Parts tab = unallocated stock only.
  parts = function(){
    var available = (db.parts || []).filter(function(p){ return availableQty(p) > 0; }).slice().reverse();
    return '<div class="row"><div><h2 style="margin-bottom:2px">Parts</h2><div class="muted">Available / unallocated stock</div></div>' +
      '<button class="primary" onclick="partForm()">＋ Add</button></div>' +
      (available.map(function(p){
        var qty = availableQty(p);
        return '<div class="card"><div class="row"><div><b>' + esc(p.name) + '</b>' +
          (p.partNo ? '<div class="muted">Part No: ' + esc(p.partNo) + '</div>' : '') +
          '</div><span class="stock-pill">Available: ' + qty + '</span></div>' +
          '<div class="muted">Cost ' + money(p.cost) + ' • Charge ' + money(p.charge != null ? p.charge : p.cost) +
          (p.supplier ? ' • ' + esc(p.supplier) : '') + '</div>' +
          '<div class="actions"><button onclick="partForm(\'' + p.id + '\')">Edit</button>' +
          '<button class="danger" onclick="deletePart(\'' + p.id + '\')">Delete</button></div></div>';
      }).join('') || '<div class="empty">No unallocated parts. Add purchased parts here and allocate them to jobs as you use them.</div>');
  };

  // Part form now records how many were purchased / stocked.
  partForm = function(id, linkJobId){
    id = id || ''; linkJobId = linkJobId || '';
    var p = (db.parts || []).find(function(x){ return x.id === id; }) || {};
    var existingAllocated = p.id ? allocatedQty(p.id) : 0;
    var stockQty = p.id ? Number(p.stockQty || 0) : 1;
    openModal(id ? 'Edit Part' : 'Add Purchased Part',
      '<label>Part / expense</label><input id="pn" value="' + esc(p.name || '') + '">' +
      '<label>Part No.</label><input id="pno" value="' + esc(p.partNo || '') + '" placeholder="e.g. 038 971 600">' +
      '<label>Quantity purchased / total stock</label><input id="pstock" type="number" min="' + existingAllocated + '" step="1" value="' + stockQty + '">' +
      (existingAllocated ? '<div class="muted" style="margin-top:-6px;margin-bottom:10px">' + existingAllocated + ' already allocated to jobs, so total stock cannot be set below that.</div>' : '') +
      '<div class="two"><div><label>Your cost (£ each)</label><input id="pc" type="number" min="0" step="0.01" value="' + Number(p.cost || 0) + '"></div>' +
      '<div><label>Customer charge (£ each)</label><input id="pch" type="number" min="0" step="0.01" value="' + Number(p.charge != null ? p.charge : p.cost || 0) + '"></div></div>' +
      '<label>Supplier</label><input id="ps" value="' + esc(p.supplier || '') + '">' +
      (linkJobId ? '<label>Quantity to allocate to this job</label><input id="pqty" type="number" min="1" step="1" value="1">' : '') +
      '<button class="primary" onclick="savePartV24(\'' + id + '\',\'' + linkJobId + '\')">Save' + (linkJobId ? ' & allocate' : '') + '</button>'
    );
  };

  window.savePartV24 = function(id, linkJobId){
    var old = (db.parts || []).find(function(y){ return y.id === id; }) || {};
    var existingAllocated = old.id ? allocatedQty(old.id) : 0;
    var requestedStock = Math.max(existingAllocated, Number(pstock.value || 0));
    var x = {
      ...old,
      id: id || gid(),
      name: pn.value,
      partNo: pno.value,
      stockQty: requestedStock,
      cost: Number(pc.value || 0),
      charge: Number(pch.value || 0),
      supplier: ps.value
    };
    var idx = db.parts.findIndex(function(y){ return y.id === x.id; });
    if(idx < 0) db.parts.push(x); else db.parts[idx] = x;

    if(linkJobId){
      var j = db.jobs.find(function(y){ return y.id === linkJobId; });
      if(j){
        j.partIds = Array.isArray(j.partIds) ? j.partIds : [];
        j.partQuantities = j.partQuantities || {};
        var qty = Math.max(1,Number((document.getElementById('pqty')||{}).value || 1));
        // New manual part must contain enough stock for what is being allocated.
        if(Number(x.stockQty || 0) < qty) x.stockQty = qty;
        if(!j.partIds.includes(x.id)) j.partIds.push(x.id);
        j.partQuantities[x.id] = qty;
      }
    }
    save(); closeM(); render();
  };

  // Job allocation menu only offers available stock plus parts already on this job.
  jobPartsMenu = function(jobId){
    var j = (db.jobs || []).find(function(x){ return x.id === jobId; });
    if(!j) return;
    var linked = new Set(j.partIds || []);
    var q = j.partQuantities || {};
    var candidates = (db.parts || []).filter(function(p){
      return availableQty(p) > 0 || linked.has(p.id);
    });

    var body = '<p class="muted">' + esc(jobLabel(j)) + '</p><div class="card"><b>Allocate parts from stock</b>' +
      '<p class="muted">Parts allocated here disappear from the Parts tab. Remove or reduce them and the quantity becomes available again.</p>';

    if(candidates.length){
      body += candidates.map(function(p){
        var checked = linked.has(p.id);
        var current = Math.max(0,Number(q[p.id] || 0));
        // Available to this job includes its own current allocation.
        var maxForJob = availableQty(p) + current;
        return '<div style="display:grid;grid-template-columns:28px 1fr 76px;gap:9px;align-items:center;padding:10px 0;border-top:1px solid var(--line)">' +
          '<input type="checkbox" class="jobPartCheck" value="' + p.id + '" ' + (checked ? 'checked' : '') + ' style="width:22px;height:22px;margin:0">' +
          '<div><b>' + esc(p.name) + '</b>' +
          (p.partNo ? '<br><span class="muted">Part No: ' + esc(p.partNo) + '</span>' : '') +
          '<br><span class="muted">Available: ' + maxForJob + ' • Each ' + money(p.charge != null ? p.charge : p.cost) + '</span></div>' +
          '<div><label>Qty</label><input class="jobPartQty qty-input" data-part-id="' + p.id + '" data-max="' + maxForJob + '" type="number" min="1" max="' + maxForJob + '" step="1" value="' + (current || 1) + '"></div></div>';
      }).join('');
    }else{
      body += '<div class="empty">No unallocated parts available.</div>';
    }

    body += '<button class="primary" style="width:100%;margin-top:10px" onclick="saveJobPartSelectionV24(\'' + jobId + '\')">Save allocation</button></div>' +
      '<button style="width:100%;margin-top:10px" onclick="partForm(\'\',\'' + jobId + '\')">＋ Add a newly purchased part</button>';
    openModal('Parts for this job',body);
  };

  window.saveJobPartSelectionV24 = function(jobId){
    var j = (db.jobs || []).find(function(x){ return x.id === jobId; });
    if(!j) return;
    var checks = Array.from(document.querySelectorAll('.jobPartCheck:checked'));
    var newIds = [];
    var newQ = {};

    for(var i=0;i<checks.length;i++){
      var ch = checks[i];
      var inp = document.querySelector('.jobPartQty[data-part-id="' + ch.value + '"]');
      var max = Math.max(0,Number(inp && inp.dataset.max || 0));
      var qty = Math.max(1,Number(inp && inp.value || 1));
      if(qty > max){
        var part = db.parts.find(function(p){ return p.id === ch.value; });
        alert((part ? part.name : 'Part') + ': only ' + max + ' available for this job.');
        return;
      }
      newIds.push(ch.value);
      newQ[ch.value] = qty;
    }

    j.partIds = newIds;
    j.partQuantities = newQ;
    save(); closeM(); render();
  };

  // Customer list gains a View button.
  customers = function(){
    return '<div class="row"><h2>Customers</h2><button class="primary" onclick="customerForm()">＋ Add</button></div>' +
      ((db.customers || []).map(function(c){
        var vehicle = [c.make,c.model].filter(Boolean).join(' ');
        var detail = [c.engineSize,c.reg || c.vehicle].filter(Boolean).join(' • ');
        var fullVehicle = [vehicle,detail].filter(Boolean).join(' — ');
        var count = (db.jobs || []).filter(function(j){ return j.customer === c.name; }).length;
        return '<div class="card"><div class="row"><b>' + esc(c.name) + '</b><span class="stock-pill">' + count + ' job' + (count===1?'':'s') + '</span></div>' +
          '<div class="muted">' + (c.phone ? esc(c.phone) : '') + (c.email ? '<br>' + esc(c.email) : '') +
          (fullVehicle ? '<br><b>Vehicle:</b> ' + esc(fullVehicle) : '') + '</div>' +
          '<div class="actions"><button class="primary" onclick="viewCustomerV24(\'' + c.id + '\')">View</button>' +
          '<button onclick="customerForm(\'' + c.id + '\')">Edit</button>' +
          '<button class="danger" onclick="del(\'customers\',\'' + c.id + '\')">Delete</button></div></div>';
      }).join('') || '<div class="empty">No customers.</div>');
  };

  function jobInvoice(jobId){
    return (db.invoices || []).slice().reverse().find(function(i){ return i.jobId === jobId; }) || null;
  }

  window.viewCustomerV24 = function(customerId){
    var c = (db.customers || []).find(function(x){ return x.id === customerId; });
    if(!c) return;

    var jobs = (db.jobs || []).filter(function(j){ return j.customer === c.name; }).slice().sort(function(a,b){
      return String(b.date || '').localeCompare(String(a.date || ''));
    });

    // Group job history by registration. Current customer vehicle is included even with no jobs.
    var regs = {};
    jobs.forEach(function(j){
      var key = (j.reg || c.reg || c.vehicle || 'No registration').toUpperCase();
      if(!regs[key]) regs[key] = [];
      regs[key].push(j);
    });
    var currentReg = (c.reg || c.vehicle || '').toUpperCase();
    if(currentReg && !regs[currentReg]) regs[currentReg] = [];

    var contact = '<div class="card"><div class="customer-summary"><div><b>' + esc(c.name) + '</b>' +
      (c.phone ? '<div class="muted">' + esc(c.phone) + '</div>' : '') +
      (c.email ? '<div class="muted">' + esc(c.email) + '</div>' : '') +
      (c.address ? '<div class="muted">' + esc(c.address).replace(/\n/g,'<br>') + '</div>' : '') +
      '</div><div><b>Saved vehicle</b><div class="muted">' +
      esc([c.make,c.model,c.engineSize].filter(Boolean).join(' ')) +
      ((c.reg || c.vehicle) ? '<br>' + esc(c.reg || c.vehicle) : '') +
      '</div></div></div></div>';

    var history = Object.keys(regs).map(function(reg){
      var list = regs[reg];
      var exemplar = list[0] || {};
      var vehicleDesc = [exemplar.make || c.make, exemplar.model || c.model, exemplar.engineSize || c.engineSize].filter(Boolean).join(' ');
      return '<div class="vehicle-card"><div class="row"><div><b>' + esc(reg) + '</b>' +
        (vehicleDesc ? '<div class="muted">' + esc(vehicleDesc) + '</div>' : '') +
        '</div><span class="stock-pill">' + list.length + ' job' + (list.length===1?'':'s') + '</span></div>' +
        (list.map(function(j){
          var inv = jobInvoice(j.id);
          var partLines = typeof window.jobPartLines === 'function' ? window.jobPartLines(j) : [];
          var partsText = partLines.length ? partLines.map(function(x){ return x.name + ' × ' + x.qty; }).join(', ') : 'No parts';
          return '<div class="history-job"><div class="row"><div><div class="history-title">' + esc(j.title || 'Job') + '</div>' +
            '<div class="muted">' + esc(j.date || '') + ' • ' + esc(j.status || '') + '</div></div>' +
            (inv ? '<span class="stock-pill">' + (inv.paid ? 'Paid' : 'Unpaid') + ' • ' + money(inv.total || 0) + '</span>' : '') +
            '</div><div class="muted">Time: ' + Number(j.hours || 0) + 'h<br>Parts: ' + esc(partsText) + '</div>' +
            '<div class="actions"><button onclick="closeM();jobForm(\'' + j.id + '\')">View / Edit Job</button>' +
            (inv ? '<button onclick="closeM();setPage(\'Invoices\');setTimeout(function(){viewInvoice(\'' + inv.id + '\')},50)">View Invoice</button>' : '') +
            '</div></div>';
        }).join('') || '<div class="empty">No jobs recorded for this vehicle yet.</div>') +
        '</div>';
    }).join('');

    openModal('Customer History', contact +
      '<div class="row"><h3>Job History</h3><span class="muted">' + jobs.length + ' total</span></div>' +
      (history || '<div class="empty">No previous jobs for this customer.</div>'));
  };

  save();
  render();
})();
</script>


<script>
(function(){
  // v28 fix: stock helpers must exist inside this update's scope.
  function allocatedQtyV28(partId){
    return (db.jobs || []).reduce(function(total,j){
      if(!(j.partIds || []).includes(partId)) return total;
      return total + Math.max(0,Number((j.partQuantities || {})[partId] || 0));
    },0);
  }

  function availableQtyV28(part){
    return Math.max(0,Number(part.stockQty || 0) - allocatedQtyV28(part.id));
  }

  // ---------- migration ----------
  db.parts = (db.parts || []).map(function(p){
    if(!Array.isArray(p.includedParts)) p.includedParts = [];
    p.includedParts = p.includedParts.map(function(x){
      return {
        name:String((x && x.name) || ''),
        partNo:String((x && x.partNo) || ''),
        qty:Math.max(1,Number((x && x.qty) || 1))
      };
    });
    return p;
  });

  function incRowsHtml(items){
    items = Array.isArray(items) ? items : [];
    if(!items.length) items = [{name:'',partNo:'',qty:1}];
    return items.map(function(x,idx){
      return '<div class="included-row">' +
        '<div><label>Included part</label><input class="inc-name" value="' + esc(x.name||'') + '" placeholder="e.g. Oil filter"></div>' +
        '<div><label>Part No. (optional)</label><input class="inc-partno" value="' + esc(x.partNo||'') + '" placeholder="Optional"></div>' +
        '<div class="inc-qty"><label>Qty</label><input class="inc-qty-input" type="number" min="1" step="1" value="' + Math.max(1,Number(x.qty||1)) + '"></div>' +
        '<div class="inc-remove"><button type="button" class="danger" style="width:44px;padding:10px 0" onclick="removeIncludedRow(this)">×</button></div>' +
      '</div>';
    }).join('');
  }

  window.addIncludedRow = function(){
    var host=document.getElementById('includedPartsRows');
    if(!host)return;
    host.insertAdjacentHTML('beforeend',incRowsHtml([{name:'',partNo:'',qty:1}]));
  };

  window.removeIncludedRow = function(btn){
    var row=btn.closest('.included-row');
    if(row) row.remove();
  };

  function readIncludedParts(){
    return Array.from(document.querySelectorAll('#includedPartsRows .included-row')).map(function(row){
      var name=(row.querySelector('.inc-name')||{}).value||'';
      var partNo=(row.querySelector('.inc-partno')||{}).value||'';
      var qty=Math.max(1,Number((row.querySelector('.inc-qty-input')||{}).value||1));
      return {name:name.trim(),partNo:partNo.trim(),qty:qty};
    }).filter(function(x){return x.name;});
  }

  function includedSummary(p){
    var inc=Array.isArray(p.includedParts)?p.includedParts:[];
    if(!inc.length)return '';
    return '<div class="included-wrap"><b>Included parts</b><ul class="included-list">' +
      inc.map(function(x){
        return '<li>' + esc(x.name) +
          (x.partNo?' <span class="muted">(' + esc(x.partNo) + ')</span>':'') +
          (Number(x.qty||1)>1?' × '+Number(x.qty||1):'') +
        '</li>';
      }).join('') + '</ul></div>';
  }

  // ---------- part form / stock ----------
  partForm = function(id, linkJobId){
    id=id||''; linkJobId=linkJobId||'';
    var p=(db.parts||[]).find(function(x){return x.id===id;})||{};
    var existingAllocated=p.id?allocatedQtyV28(p.id):0;
    var stockQty=p.id?Number(p.stockQty||0):1;
    openModal(id?'Edit Part':'Add Purchased Part',
      '<label>Part / expense</label><input id="pn" value="' + esc(p.name||'') + '">' +
      '<label>Part No.</label><input id="pno" value="' + esc(p.partNo||'') + '" placeholder="e.g. SERVICE-KIT-01">' +
      '<label>Quantity purchased / total stock</label><input id="pstock" type="number" min="' + existingAllocated + '" step="1" value="' + stockQty + '">' +
      (existingAllocated?'<div class="muted" style="margin-top:-6px;margin-bottom:10px">'+existingAllocated+' already allocated to jobs.</div>':'') +
      '<div class="two"><div><label>Your cost (£ each)</label><input id="pc" type="number" min="0" step="0.01" value="' + Number(p.cost||0) + '"></div>' +
      '<div><label>Customer charge (£ each)</label><input id="pch" type="number" min="0" step="0.01" value="' + Number(p.charge!=null?p.charge:p.cost||0) + '"></div></div>' +
      '<label>Supplier</label><input id="ps" value="' + esc(p.supplier||'') + '">' +
      '<div class="included-wrap"><div class="row"><div><b>Included parts</b><div class="muted">Optional — useful for service kits, bundles, etc.</div></div>' +
      '<button type="button" onclick="addIncludedRow()">＋ Add item</button></div>' +
      '<div id="includedPartsRows">' + incRowsHtml(p.includedParts||[]) + '</div></div>' +
      (linkJobId?'<label>Quantity to allocate to this job</label><input id="pqty" type="number" min="1" step="1" value="1">':'') +
      '<button class="primary" onclick="savePartV27(\''+id+'\',\''+linkJobId+'\')">Save'+(linkJobId?' & allocate':'')+'</button>'
    );
  };

  window.savePartV27=function(id,linkJobId){
    var old=(db.parts||[]).find(function(y){return y.id===id;})||{};
    var existingAllocated=old.id?allocatedQtyV28(old.id):0;
    var requestedStock=Math.max(existingAllocated,Number(pstock.value||0));
    var x={
      ...old,
      id:id||gid(),
      name:pn.value,
      partNo:pno.value,
      stockQty:requestedStock,
      cost:Number(pc.value||0),
      charge:Number(pch.value||0),
      supplier:ps.value,
      includedParts:readIncludedParts()
    };
    var idx=db.parts.findIndex(function(y){return y.id===x.id;});
    if(idx<0)db.parts.push(x); else db.parts[idx]=x;

    if(linkJobId){
      var j=db.jobs.find(function(y){return y.id===linkJobId;});
      if(j){
        j.partIds=Array.isArray(j.partIds)?j.partIds:[];
        j.partQuantities=j.partQuantities||{};
        var qty=Math.max(1,Number((document.getElementById('pqty')||{}).value||1));
        if(Number(x.stockQty||0)<qty)x.stockQty=qty;
        if(!j.partIds.includes(x.id))j.partIds.push(x.id);
        j.partQuantities[x.id]=qty;
      }
    }
    save();closeM();render();
  };

  parts=function(){
    var available=(db.parts||[]).filter(function(p){return availableQtyV28(p)>0;}).slice().reverse();
    return '<div class="row"><div><h2 style="margin-bottom:2px">Parts</h2><div class="muted">Available / unallocated stock</div></div><button class="primary" onclick="partForm()">＋ Add</button></div>' +
      (available.map(function(p){
        var qty=availableQtyV28(p);
        return '<div class="card"><div class="row"><div><b>'+esc(p.name)+'</b>' +
          (p.partNo?'<div class="muted">Part No: '+esc(p.partNo)+'</div>':'') +
          '</div><span class="stock-pill">Available: '+qty+'</span></div>' +
          '<div class="muted">Cost '+money(p.cost)+' • Charge '+money(p.charge!=null?p.charge:p.cost)+(p.supplier?' • '+esc(p.supplier):'')+'</div>' +
          includedSummary(p) +
          '<div class="actions"><button onclick="partForm(\''+p.id+'\')">Edit</button><button class="danger" onclick="deletePart(\''+p.id+'\')">Delete</button></div></div>';
      }).join('')||'<div class="empty">No unallocated parts.</div>');
  };

  // ---------- job/invoice snapshots ----------
  jobPartLines=function(j){
    if(!j)return[];
    return (j.partIds||[]).map(function(id){
      var part=(db.parts||[]).find(function(p){return p.id===id;});
      if(!part)return null;
      var qty=Number((j.partQuantities||{})[id]||1);
      if(!Number.isFinite(qty)||qty<=0)qty=1;
      var unit=Number(part.charge!=null?part.charge:part.cost||0);
      return {
        partId:part.id,
        name:part.name||'Part',
        partNo:part.partNo||'',
        includedParts:(part.includedParts||[]).map(function(x){return {...x};}),
        qty:qty,
        unitPrice:unit,
        total:qty*unit,
        cost:Number(part.cost||0),
        supplier:part.supplier||''
      };
    }).filter(Boolean);
  };
  window.jobPartLines=jobPartLines;

  invoicePartSnapshot=function(j){
    return jobPartLines(j).map(function(line){
      return {
        partId:line.partId,
        name:line.name,
        partNo:line.partNo||'',
        includedParts:(line.includedParts||[]).map(function(x){return {...x};}),
        qty:line.qty,
        unitPrice:line.unitPrice,
        total:line.total
      };
    });
  };

  // Override invoice save so the included-items list is snapshotted at billing time.
  saveInvoice=function(){
    recalcInvoiceLabour();
    var jobId=ivjob.value||'';
    var j=db.jobs.find(function(x){return x.id===jobId;})||null;
    var c=(db.customers||[]).find(function(x){return x.name===ivc.value;})||{};
    var partLines=invoicePartSnapshot(j);
    var partTotal=partLines.reduce(function(a,x){return a+Number(x.total||0);},0);
    ivp.value=partTotal.toFixed(2);
    var total=Number(ivl.value||0)+partTotal+Number(ivt.value||0)+Number(ivo.value||0);
    db.invoices.push({
      id:gid(),number:ivn.value,customer:ivc.value,customerId:c.id||'',email:ive.value,
      billedTo:{name:ivc.value,phone:c.phone||'',email:ive.value||c.email||'',address:c.address||''},
      date:ivd.value,jobId:jobId,hours:Number(ivhours.value||0),labour:Number(ivl.value||0),
      partLines:partLines,parts:partTotal,travel:Number(ivt.value||0),other:Number(ivo.value||0),
      total:total,paid:false
    });
    if(j)j.hours=Number(ivhours.value||0);
    syncJobPaymentStatus(jobId);
    save();closeM();render();
  };

  // ---------- on-screen / print invoice ----------
  function v27InvoiceLines(i){
    if(Array.isArray(i.partLines)&&i.partLines.length){
      return i.partLines.map(function(line){
        var current=(db.parts||[]).find(function(p){return p.id===line.partId;})||{};
        return {
          ...line,
          partNo:line.partNo||current.partNo||'',
          includedParts:Array.isArray(line.includedParts)?line.includedParts:(current.includedParts||[])
        };
      });
    }
    var j=(db.jobs||[]).find(function(x){return x.id===i.jobId;});
    return j?invoicePartSnapshot(j):[];
  }

  function v27Customer(i){
    var billed=i.billedTo||{},c=(db.customers||[]).find(function(x){return x.name===i.customer;})||{};
    return {name:billed.name||i.customer||c.name||'',phone:billed.phone||c.phone||'',email:billed.email||i.email||c.email||'',address:billed.address||c.address||''};
  }
  function v27Vehicle(i){
    var j=(db.jobs||[]).find(function(x){return x.id===i.jobId;})||{},c=(db.customers||[]).find(function(x){return x.name===i.customer;})||{};
    return {reg:j.reg||c.reg||c.vehicle||'',make:j.make||c.make||'',model:j.model||c.model||'',engineSize:j.engineSize||c.engineSize||'',title:j.title||''};
  }

  function invoiceHtmlV27(i){
    var s=db.settings||{},company=s.companyName||'Mechanic Mate',logo=s.companyLogo||'',cust=v27Customer(i),vehicle=v27Vehicle(i),lines=v27InvoiceLines(i);
    var partsSubtotal=lines.reduce(function(a,x){return a+Number(x.total||0);},0);
    if(!partsSubtotal&&Number(i.parts||0))partsSubtotal=Number(i.parts||0);

    var rows=lines.map(function(line){
      var qty=Number(line.qty||1),unit=Number(line.unitPrice||0),total=Number(line.total||qty*unit);
      var main='<tr><td><b>'+esc(line.name||'Part')+'</b></td><td>'+esc(line.partNo||'')+'</td><td>'+qty+'</td><td>'+money(unit)+'</td><td>'+money(total)+'</td></tr>';
      var subs=(line.includedParts||[]).map(function(x){
        return '<tr class="invoice-subpart"><td>↳ '+esc(x.name||'')+'</td><td>'+esc(x.partNo||'')+'</td><td>'+Math.max(1,Number(x.qty||1))+'</td><td></td><td></td></tr>';
      }).join('');
      return main+subs;
    }).join('');

    if(!rows&&partsSubtotal)rows='<tr><td>Parts</td><td></td><td>1</td><td>'+money(partsSubtotal)+'</td><td>'+money(partsSubtotal)+'</td></tr>';
    var contact=[s.companyPhone,s.companyEmail].filter(Boolean).map(esc).join('<br>');
    var vb=[vehicle.make,vehicle.model,vehicle.engineSize].filter(Boolean).map(esc).join(' • ');

    return '<div class="inline-invoice"><div class="inv-head"><div>' +
      (logo?'<img class="inv-logo" src="'+logo+'" alt="Company logo">':'') +
      '<div style="font-weight:900;font-size:20px">'+esc(company)+'</div>'+(contact?'<div class="invoice-contact">'+contact+'</div>':'') +
      '</div><div style="text-align:right"><div class="inv-title">INVOICE</div><div class="inv-meta">'+esc(i.number||'')+'<br>'+esc(i.date||'')+'</div><div style="margin-top:7px;font-weight:900">'+(i.paid?'PAID':'UNPAID')+'</div></div></div>' +
      '<div class="bill-grid"><div class="bill-box"><b>BILLED TO</b><br>'+esc(cust.name)+(cust.address?'<br>'+esc(cust.address).replace(/\n/g,'<br>'):'')+(cust.phone?'<br>'+esc(cust.phone):'')+(cust.email?'<br>'+esc(cust.email):'')+'</div>' +
      '<div class="bill-box"><b>VEHICLE / JOB</b><br>'+(vehicle.reg?'Registration: '+esc(vehicle.reg)+'<br>':'')+(vb?vb+'<br>':'')+(vehicle.title?'Job: '+esc(vehicle.title):'')+'</div></div>' +
      (Number(i.labour||0)?'<table><tbody><tr><td><b>Labour</b>'+(i.hours?' — '+esc(i.hours)+' hours @ '+money(db.settings.hourlyRate||0)+'/hr':'')+'</td><td style="text-align:right"><b>'+money(i.labour)+'</b></td></tr></tbody></table>':'') +
      (rows?'<div style="margin-top:18px;font-weight:900">PARTS USED</div><table class="parts-table parts-table-v20"><thead><tr><th>Part</th><th>Part No.</th><th>Qty</th><th>Each</th><th>Total</th></tr></thead><tbody>'+rows+'<tr class="parts-subtotal"><td colspan="4">Parts subtotal</td><td>'+money(partsSubtotal)+'</td></tr></tbody></table>':'') +
      ((Number(i.travel||0)||Number(i.other||0))?'<table><tbody>'+(Number(i.travel||0)?'<tr><td>Travel / call-out</td><td>'+money(i.travel)+'</td></tr>':'')+(Number(i.other||0)?'<tr><td>Other</td><td>'+money(i.other)+'</td></tr>':'')+'</tbody></table>':'') +
      '<div class="inv-total">Total: '+money(i.total)+'</div></div>';
  }

  window.viewInvoice=function(id,button){
    var i=(db.invoices||[]).find(function(x){return x.id===id;});
    if(!i){alert('Invoice not found.');return;}
    if(window.closeInlineInvoice)closeInlineInvoice();
    var host=document.createElement('div');host.id='inlineInvoicePreview';
    var actions=document.createElement('div');actions.className='inline-actions';
    var closeBtn=document.createElement('button');closeBtn.className='secondary';closeBtn.textContent='Close invoice';closeBtn.addEventListener('click',function(){closeInlineInvoice();});
    var printBtn=document.createElement('button');printBtn.textContent='Print / Save PDF';printBtn.addEventListener('click',function(){printShareInvoice(id);});
    var emailBtn=document.createElement('button');emailBtn.textContent='Email PDF';emailBtn.addEventListener('click',function(){emailInvoice(id);});
    actions.append(closeBtn,printBtn,emailBtn);
    var content=document.createElement('div');content.innerHTML=invoiceHtmlV27(i);
    host.append(actions,content);
    var card=button&&button.closest?button.closest('.card'):null;
    (card||document.getElementById('app')).appendChild(host);
    try{host.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){host.scrollIntoView();}
  };

  window.printShareInvoice=function(id){
    var i=(db.invoices||[]).find(function(x){return x.id===id;});
    if(!i){alert('Invoice not found.');return;}
    var host=document.getElementById('invoicePrintHost');
    if(!host){host=document.createElement('div');host.id='invoicePrintHost';document.body.appendChild(host);}
    host.innerHTML=invoiceHtmlV27(i);host.style.display='block';
    setTimeout(function(){window.print();setTimeout(function(){host.style.display='none';host.innerHTML='';},750);},100);
  };

  save();
  render();
})();
</script>

</body></html>
