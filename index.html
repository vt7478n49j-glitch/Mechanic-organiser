<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mechanic Mate">
<title>Mechanic Mate</title>
<style>
:root{--bg:#0b1020;--card:#141b2d;--line:#29344d;--text:#f4f7fb;--muted:#9aa6bb;--accent:#ff8a00;--red:#ff5d6c;--green:#3ddc97}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding-left:16px;padding-right:16px;padding-bottom:calc(90px + env(safe-area-inset-bottom));padding-top:calc(18px + env(safe-area-inset-top));min-height:100vh}
h1{margin:0}.sub{color:var(--muted);font-size:13px}.nav{display:flex;gap:7px;overflow:auto;margin:16px 0;padding-bottom:2px}.nav button,button{border:0;border-radius:12px;padding:11px 13px;background:#1b2439;color:white;font-weight:700}.nav .on,button.primary{background:var(--accent);color:#111}.danger{background:var(--red)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{display:block;font-size:22px}.muted{color:var(--muted);font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#1b2439;font-size:11px}.good{color:var(--green)}input,select,textarea{width:100%;padding:12px;margin:5px 0 12px;border-radius:10px;border:1px solid var(--line);background:#0f1526;color:white;font:inherit}label{font-size:12px;color:var(--muted)}.calc{padding:10px 12px;border-radius:10px;background:#0f1526;border:1px solid var(--line);margin:5px 0 12px}.calc strong{font-size:18px}#modal{position:fixed;inset:0;background:#000c;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));overflow:auto;z-index:20}#modal:empty{display:none}#modal .card{max-width:650px;margin:10px auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:420px){.two{grid-template-columns:1fr}}@media(min-width:700px){body{max-width:800px;margin:auto}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<h1>🔧 Mechanic Mate</h1><div class="sub">Private mobile mechanic job manager</div><div id="nav" class="nav"></div><main id="app"></main><div id="modal"></div>
<script>
const KEY='mechanic-mate-v2';
let db=JSON.parse(localStorage.getItem(KEY)||'{"jobs":[],"customers":[],"parts":[],"invoices":[]}');
if(!db.jobs)db.jobs=[];if(!db.customers)db.customers=[];if(!db.parts)db.parts=[];if(!db.invoices)db.invoices=[];if(!db.settings)db.settings={};if(!Number.isFinite(Number(db.settings.hourlyRate)))db.settings.hourlyRate=40;
let page='Dashboard';
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jobById=id=>db.jobs.find(x=>x.id===id);
const customerNames=()=>[...new Set([...db.customers.map(c=>c.name),...db.jobs.map(j=>j.customer)].filter(Boolean))].sort((a,b)=>a.localeCompare(b));
function partJobName(p){let j=jobById(p.jobId);return j?`${j.title||'Job'} • ${j.reg||j.customer||''}`:(p.job||'Unlinked');}
function go(p){page=p;render()}
function render(){nav.innerHTML=['Dashboard','Jobs','Customers','Parts','Invoices','Settings'].map(x=>`<button class="${page===x?'on':''}" onclick="go('${x}')">${x}</button>`).join('');app.innerHTML=({Dashboard:dash,Jobs:jobs,Customers:customers,Parts:parts,Invoices:invoices,Settings:settings}[page])()}
function dash(){const rev=db.invoices.reduce((a,x)=>a+Number(x.total||0),0),cost=db.parts.reduce((a,x)=>a+Number(x.cost||0),0);return `<div class="grid"><div class="card stat">Jobs<b>${db.jobs.length}</b></div><div class="card stat">Customers<b>${db.customers.length}</b></div><div class="card stat">Invoiced<b>${money(rev)}</b></div><div class="card stat">Profit*<b>${money(rev-cost)}</b></div></div><p><button class="primary" onclick="jobForm()">＋ New Job</button> <button onclick="invoiceForm()">＋ Invoice</button></p><div class="card"><b>Recent jobs</b>${db.jobs.slice().reverse().slice(0,5).map(jobCard).join('')||'<p class="muted">No jobs yet.</p>'}</div><p class="muted">*Invoices minus recorded parts costs.</p>`}
function jobParts(id){return db.parts.filter(p=>p.jobId===id)}
function jobCard(j){const pc=jobParts(j.id);return `<div class="card"><div class="row"><b>${esc(j.title)}</b><span>${esc(j.status)}</span></div><div class="muted">${esc(j.customer)} • ${esc(j.reg)} • ${esc(j.date)}</div>${j.hours?`<div class="muted">Time: ${esc(j.hours)}h • Labour: ${money(Number(j.hours)*Number(db.settings.hourlyRate||0))}</div>`:''}${pc.length?`<div class="muted">Parts linked: ${pc.length} • Cost ${money(pc.reduce((a,p)=>a+Number(p.cost||0),0))}</div>`:''}<button onclick="jobForm('${j.id}')">Open</button> <button onclick="partForm('', '${j.id}')">＋ Part</button> <button onclick="invoiceForm('${j.id}')">Invoice</button></div>`}
function jobs(){return `<div class="row"><h2>Jobs</h2><button class="primary" onclick="jobForm()">＋ New</button></div>${db.jobs.slice().reverse().map(jobCard).join('')||'<p class="muted">No jobs.</p>'}`}
function customers(){return `<div class="row"><h2>Customers</h2><button class="primary" onclick="customerForm()">＋ Add</button></div>${db.customers.map(c=>`<div class="card"><b>${esc(c.name)}</b><div class="muted">${esc(c.phone)}<br>${esc(c.vehicle)}<br>${esc(c.address)}</div><button onclick="customerForm('${c.id}')">Edit</button> <button class="danger" onclick="del('customers','${c.id}')">Delete</button></div>`).join('')||'<p class="muted">No customers.</p>'}`}
function parts(){return `<div class="row"><h2>Parts</h2><button class="primary" onclick="partForm()">＋ Add</button></div>${db.parts.slice().reverse().map(p=>`<div class="card"><div class="row"><b>${esc(p.name)}</b><b>${money(p.cost)}</b></div><div class="muted">${esc(p.supplier)} • ${esc(partJobName(p))}</div>${Number(p.charge||0)?`<div class="muted">Customer charge: ${money(p.charge)}</div>`:''}<button onclick="partForm('${p.id}')">Edit</button> <button class="danger" onclick="del('parts','${p.id}')">Delete</button></div>`).join('')||'<p class="muted">No parts.</p>'}`}
function invoices(){return `<div class="row"><h2>Invoices</h2><button class="primary" onclick="invoiceForm()">＋ New</button></div>${db.invoices.slice().reverse().map(i=>`<div class="card"><div class="row"><b>${esc(i.number)}</b><b>${money(i.total)}</b></div><div class="muted">${esc(i.customer)} • ${esc(i.date)}${i.jobId&&jobById(i.jobId)?`<br>${esc(jobById(i.jobId).title)} • ${esc(jobById(i.jobId).reg)}`:''}</div><div class="muted">Labour ${money(i.labour)} • Parts ${money(i.parts)} • Call-out ${money(i.callout)} • Other ${money(i.other)}</div><p>${i.paid?'✅ PAID':'⚠️ UNPAID'}</p><button onclick="paid('${i.id}')">Mark ${i.paid?'unpaid':'paid'}</button> <button class="danger" onclick="del('invoices','${i.id}')">Delete</button></div>`).join('')||'<p class="muted">No invoices.</p>'}`}
function settings(){return `<h2>Settings</h2><div class="card"><b>Labour rate</b><p class="muted">Set your normal hourly charge. Jobs and invoices use this automatically.</p><label>Hourly rate (£/hour)</label><input id="setRate" type="number" step="0.01" min="0" value="${Number(db.settings.hourlyRate||0)}"><button class="primary" onclick="saveRate()">Save hourly rate</button></div><div class="card"><b>Backup</b><p class="muted">Export your data regularly.</p><button class="primary" onclick="exportData()">Export backup</button> <button onclick="imp.click()">Import</button><input id="imp" type="file" accept=".json" style="display:none" onchange="importData(event)"></div><div class="card"><b>Reset</b><p class="muted">Delete everything stored on this device.</p><button class="danger" onclick="resetData()">Delete all data</button></div>`}
function saveRate(){db.settings.hourlyRate=Number(setRate.value)||0;save();render();alert('Hourly rate saved.')}
function openModal(title,body){modal.innerHTML=`<div class="card"><div class="row"><h2>${title}</h2><button onclick="closeM()">✕</button></div>${body}</div>`}function closeM(){modal.innerHTML=''}
function jobForm(id){let j=db.jobs.find(x=>x.id===id)||{};openModal(id?'Edit Job':'New Job',`<label>Job title</label><input id="jt" value="${esc(j.title)}"><label>Customer</label><input id="jc" list="customerList" value="${esc(j.customer)}"><datalist id="customerList">${customerNames().map(n=>`<option value="${esc(n)}">`).join('')}</datalist><label>Registration</label><input id="jr" value="${esc(j.reg)}"><div class="two"><div><label>Date</label><input id="jd" type="date" value="${j.date||new Date().toISOString().slice(0,10)}"></div><div><label>Status</label><select id="js"><option>Open</option><option>Booked</option><option>In progress</option><option>Complete</option><option>Cancelled</option></select></div></div><label>Time spent (hours)</label><input id="jh" type="number" step="0.25" min="0" value="${esc(j.hours||'')}" oninput="updateJobLabour()"><div class="calc">Labour at ${money(db.settings.hourlyRate)}/hr: <strong id="jobLabour">${money(Number(j.hours||0)*Number(db.settings.hourlyRate||0))}</strong></div><label>Location</label><input id="jl" value="${esc(j.location)}"><label>Notes</label><textarea id="jn">${esc(j.notes)}</textarea><button class="primary" onclick="saveJob('${id||''}')">Save job</button>${id?` <button onclick="partForm('', '${id}')">＋ Add linked part</button>`:''}`);if(j.status)js.value=j.status}
function updateJobLabour(){jobLabour.textContent=money((Number(jh.value)||0)*Number(db.settings.hourlyRate||0))}
function saveJob(id){let x={id:id||crypto.randomUUID(),title:jt.value,customer:jc.value,reg:jr.value,date:jd.value,status:js.value,hours:Number(jh.value)||0,location:jl.value,notes:jn.value},i=db.jobs.findIndex(y=>y.id===x.id);i<0?db.jobs.push(x):db.jobs[i]=x;save();closeM();render()}
function customerForm(id){let c=db.customers.find(x=>x.id===id)||{};openModal(id?'Edit Customer':'New Customer',`<label>Name</label><input id="cn" value="${esc(c.name)}"><label>Phone</label><input id="cp" value="${esc(c.phone)}"><label>Vehicle / Reg</label><input id="cv" value="${esc(c.vehicle)}"><label>Address</label><textarea id="ca">${esc(c.address)}</textarea><button class="primary" onclick="saveCustomer('${id||''}')">Save</button>`)}
function saveCustomer(id){let x={id:id||crypto.randomUUID(),name:cn.value,phone:cp.value,vehicle:cv.value,address:ca.value},i=db.customers.findIndex(y=>y.id===x.id);i<0?db.customers.push(x):db.customers[i]=x;save();closeM();render()}
function partForm(id='',preJobId=''){let p=db.parts.find(x=>x.id===id)||{};let chosen=p.jobId||preJobId||'';openModal(id?'Edit Part / Cost':'Add Part / Cost',`<label>Part / expense</label><input id="pn" value="${esc(p.name)}"><div class="two"><div><label>Your cost (£)</label><input id="pc" type="number" step=".01" value="${esc(p.cost||'')}"></div><div><label>Charge to customer (£)</label><input id="pch" type="number" step=".01" value="${esc(p.charge||'')}"></div></div><label>Supplier</label><input id="ps" value="${esc(p.supplier)}"><label>Linked job</label><select id="pjob"><option value="">No linked job</option>${db.jobs.slice().reverse().map(j=>`<option value="${j.id}" ${j.id===chosen?'selected':''}>${esc(j.title||'Job')} • ${esc(j.reg||j.customer||'')}</option>`).join('')}</select><button class="primary" onclick="savePart('${id}')">Save part</button>`)}
function savePart(id){let jobId=pjob.value;let x={id:id||crypto.randomUUID(),name:pn.value,cost:Number(pc.value)||0,charge:Number(pch.value)||0,supplier:ps.value,jobId,job:jobId?(jobById(jobId)?.title||''):''},i=db.parts.findIndex(y=>y.id===x.id);i<0?db.parts.push(x):db.parts[i]=x;save();closeM();render()}
function invoiceForm(preJobId=''){const num='INV-'+String(db.invoices.length+1).padStart(4,'0');openModal('New Invoice',`<label>Invoice number</label><input id="ivn" value="${num}"><label>Recent job</label><select id="ivjob" onchange="fillInvoiceFromJob()"><option value="">No job selected</option>${db.jobs.slice().reverse().slice(0,20).map(j=>`<option value="${j.id}" ${j.id===preJobId?'selected':''}>${esc(j.date||'')} • ${esc(j.title||'Job')} • ${esc(j.reg||j.customer||'')}</option>`).join('')}</select><label>Customer</label><select id="ivc"><option value="">Select customer</option>${customerNames().map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select><label>Date</label><input id="ivd" type="date" value="${new Date().toISOString().slice(0,10)}"><div class="two"><div><label>Time spent (hours)</label><input id="ivh" type="number" step="0.25" min="0" value="0" oninput="recalcInvoice()"></div><div><label>Hourly rate (£)</label><input id="ivr" type="number" step="0.01" min="0" value="${Number(db.settings.hourlyRate||0)}" oninput="recalcInvoice()"></div></div><div class="calc">Labour: <strong id="ivLabour">${money(0)}</strong></div><label>Parts (£)</label><input id="ivp" type="number" step="0.01" value="0" oninput="recalcInvoice()"><div class="muted" id="partsHint">Select a job to pull in linked parts.</div><label>Travel / call-out (£)</label><input id="ivt" type="number" step="0.01" value="0" oninput="recalcInvoice()"><label>Other (£)</label><input id="ivo" type="number" step="0.01" value="0" oninput="recalcInvoice()"><div class="calc">Invoice total: <strong id="ivTotal">${money(0)}</strong></div><button class="primary" onclick="saveInvoice()">Save invoice</button>`);if(preJobId)fillInvoiceFromJob();else recalcInvoice()}
function fillInvoiceFromJob(){let j=jobById(ivjob.value);if(!j){partsHint.textContent='Select a job to pull in linked parts.';recalcInvoice();return}if([...ivc.options].some(o=>o.value===j.customer))ivc.value=j.customer;ivh.value=Number(j.hours||0);let ps=jobParts(j.id);let partCharge=ps.reduce((a,p)=>a+Number(p.charge||p.cost||0),0);ivp.value=partCharge.toFixed(2);partsHint.textContent=ps.length?`${ps.length} linked part${ps.length===1?'':'s'} added (${money(partCharge)}).`:'No parts are linked to this job yet.';recalcInvoice()}
function recalcInvoice(){let labour=(Number(ivh?.value)||0)*(Number(ivr?.value)||0),parts=Number(ivp?.value)||0,callout=Number(ivt?.value)||0,other=Number(ivo?.value)||0;if(window.ivLabour)ivLabour.textContent=money(labour);if(window.ivTotal)ivTotal.textContent=money(labour+parts+callout+other)}
function saveInvoice(){let labour=(Number(ivh.value)||0)*(Number(ivr.value)||0),parts=Number(ivp.value)||0,callout=Number(ivt.value)||0,other=Number(ivo.value)||0;db.invoices.push({id:crypto.randomUUID(),number:ivn.value,jobId:ivjob.value,customer:ivc.value,date:ivd.value,hours:Number(ivh.value)||0,hourlyRate:Number(ivr.value)||0,labour,parts,callout,other,total:labour+parts+callout+other,paid:false});save();closeM();render()}
function paid(id){let x=db.invoices.find(y=>y.id===id);x.paid=!x.paid;save();render()}function del(t,id){if(confirm('Delete this item?')){db[t]=db[t].filter(x=>x.id!==id);save();render()}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='mechanic-mate-backup.json';a.click()}
function importData(e){let r=new FileReader;r.onload=()=>{try{db=JSON.parse(r.result);if(!db.settings)db.settings={hourlyRate:40};save();render();alert('Backup imported')}catch{alert('Invalid backup')}};r.readAsText(e.target.files[0])}function resetData(){if(confirm('Delete ALL data?')){db={jobs:[],customers:[],parts:[],invoices:[],settings:{hourlyRate:40}};save();render()}}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error))}save();render();
</script>
</body></html>
