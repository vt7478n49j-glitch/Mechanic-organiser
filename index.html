<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Mechanic Mate"><title>Mechanic Mate</title>
<style>:root{--bg:#0b1020;--card:#141b2d;--line:#29344d;--text:#f4f7fb;--muted:#9aa6bb;--accent:#ff8a00;--red:#ff5d6c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:16px 16px 90px}h1{margin:0}.sub{color:var(--muted);font-size:13px}.nav{display:flex;gap:7px;overflow:auto;margin:16px 0}.nav button,button{border:0;border-radius:12px;padding:11px 13px;background:#1b2439;color:white;font-weight:700}.nav .on,button.primary{background:var(--accent);color:#111}.danger{background:var(--red)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{display:block;font-size:22px}.muted{color:var(--muted);font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}input,select,textarea{width:100%;padding:12px;margin:5px 0 12px;border-radius:10px;border:1px solid var(--line);background:#0f1526;color:white}label{font-size:12px;color:var(--muted)}#modal{position:fixed;inset:0;background:#000c;padding:18px;overflow:auto;z-index:20}#modal:empty{display:none}#modal .card{max-width:650px;margin:20px auto}@media(min-width:700px){body{max-width:800px;margin:auto}.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body>
<h1>🔧 Mechanic Mate</h1><div class="sub">Private mobile mechanic job manager</div><div id="nav" class="nav"></div><main id="app"></main><div id="modal"></div>
<script>
const KEY='mechanic-mate-v2';let db=JSON.parse(localStorage.getItem(KEY)||'{"jobs":[],"customers":[],"parts":[],"invoices":[]}'),page='Dashboard';const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(p){page=p;render()}function render(){nav.innerHTML=['Dashboard','Jobs','Customers','Parts','Invoices','Settings'].map(x=>`<button class="${page===x?'on':''}" onclick="go('${x}')">${x}</button>`).join('');app.innerHTML=({Dashboard:dash,Jobs:jobs,Customers:customers,Parts:parts,Invoices:invoices,Settings:settings}[page])()}
function dash(){const rev=db.invoices.reduce((a,x)=>a+Number(x.total||0),0),cost=db.parts.reduce((a,x)=>a+Number(x.cost||0),0);return `<div class="grid"><div class="card stat">Jobs<b>${db.jobs.length}</b></div><div class="card stat">Customers<b>${db.customers.length}</b></div><div class="card stat">Invoiced<b>${money(rev)}</b></div><div class="card stat">Profit*<b>${money(rev-cost)}</b></div></div><p><button class="primary" onclick="jobForm()">＋ New Job</button> <button onclick="invoiceForm()">＋ Invoice</button></p><div class="card"><b>Recent jobs</b>${db.jobs.slice().reverse().slice(0,5).map(jobCard).join('')||'<p class="muted">No jobs yet.</p>'}</div><p class="muted">*Invoices minus recorded parts.</p>`}
function jobCard(j){return `<div class="card"><div class="row"><b>${esc(j.title)}</b><span>${esc(j.status)}</span></div><div class="muted">${esc(j.customer)} • ${esc(j.reg)} • ${esc(j.date)}</div><button onclick="jobForm('${j.id}')">Open</button></div>`}
function jobs(){return `<div class="row"><h2>Jobs</h2><button class="primary" onclick="jobForm()">＋ New</button></div>${db.jobs.slice().reverse().map(jobCard).join('')||'<p class="muted">No jobs.</p>'}`}
function customers(){return `<div class="row"><h2>Customers</h2><button class="primary" onclick="customerForm()">＋ Add</button></div>${db.customers.map(c=>`<div class="card"><b>${esc(c.name)}</b><div class="muted">${esc(c.phone)}<br>${esc(c.vehicle)}<br>${esc(c.address)}</div><button onclick="customerForm('${c.id}')">Edit</button> <button class="danger" onclick="del('customers','${c.id}')">Delete</button></div>`).join('')||'<p class="muted">No customers.</p>'}`}
function parts(){return `<div class="row"><h2>Parts</h2><button class="primary" onclick="partForm()">＋ Add</button></div>${db.parts.slice().reverse().map(p=>`<div class="card"><div class="row"><b>${esc(p.name)}</b><b>${money(p.cost)}</b></div><div class="muted">${esc(p.supplier)} • ${esc(p.job)}</div><button class="danger" onclick="del('parts','${p.id}')">Delete</button></div>`).join('')||'<p class="muted">No parts.</p>'}`}
function invoices(){return `<div class="row"><h2>Invoices</h2><button class="primary" onclick="invoiceForm()">＋ New</button></div>${db.invoices.slice().reverse().map(i=>`<div class="card"><div class="row"><b>${esc(i.number)}</b><b>${money(i.total)}</b></div><div class="muted">${esc(i.customer)} • ${esc(i.date)}</div><p>${i.paid?'✅ PAID':'⚠️ UNPAID'}</p><button onclick="paid('${i.id}')">Mark ${i.paid?'unpaid':'paid'}</button> <button class="danger" onclick="del('invoices','${i.id}')">Delete</button></div>`).join('')||'<p class="muted">No invoices.</p>'}`}
function settings(){return `<h2>Settings</h2><div class="card"><b>Backup</b><p class="muted">Export your data regularly.</p><button class="primary" onclick="exportData()">Export backup</button> <button onclick="imp.click()">Import</button><input id="imp" type="file" accept=".json" style="display:none" onchange="importData(event)"></div><div class="card"><b>Reset</b><p class="muted">Delete everything stored on this device.</p><button class="danger" onclick="resetData()">Delete all data</button></div>`}
function openModal(title,body){modal.innerHTML=`<div class="card"><div class="row"><h2>${title}</h2><button onclick="closeM()">✕</button></div>${body}</div>`}function closeM(){modal.innerHTML=''}
function jobForm(id){let j=db.jobs.find(x=>x.id===id)||{};openModal(id?'Edit Job':'New Job',`<label>Job title</label><input id="jt" value="${esc(j.title)}"><label>Customer</label><input id="jc" value="${esc(j.customer)}"><label>Registration</label><input id="jr" value="${esc(j.reg)}"><label>Date</label><input id="jd" type="date" value="${j.date||new Date().toISOString().slice(0,10)}"><label>Status</label><select id="js"><option>Open</option><option>Booked</option><option>In progress</option><option>Complete</option><option>Cancelled</option></select><label>Location</label><input id="jl" value="${esc(j.location)}"><label>Notes</label><textarea id="jn">${esc(j.notes)}</textarea><button class="primary" onclick="saveJob('${id||''}')">Save job</button>`);if(j.status)js.value=j.status}
function saveJob(id){let x={id:id||crypto.randomUUID(),title:jt.value,customer:jc.value,reg:jr.value,date:jd.value,status:js.value,location:jl.value,notes:jn.value},i=db.jobs.findIndex(y=>y.id===x.id);i<0?db.jobs.push(x):db.jobs[i]=x;save();closeM();render()}
function customerForm(id){let c=db.customers.find(x=>x.id===id)||{};openModal(id?'Edit Customer':'New Customer',`<label>Name</label><input id="cn" value="${esc(c.name)}"><label>Phone</label><input id="cp" value="${esc(c.phone)}"><label>Vehicle / Reg</label><input id="cv" value="${esc(c.vehicle)}"><label>Address</label><textarea id="ca">${esc(c.address)}</textarea><button class="primary" onclick="saveCustomer('${id||''}')">Save</button>`)}
function saveCustomer(id){let x={id:id||crypto.randomUUID(),name:cn.value,phone:cp.value,vehicle:cv.value,address:ca.value},i=db.customers.findIndex(y=>y.id===x.id);i<0?db.customers.push(x):db.customers[i]=x;save();closeM();render()}
function partForm(){openModal('Add Part / Cost',`<label>Part / expense</label><input id="pn"><label>Cost (£)</label><input id="pc" type="number" step=".01"><label>Supplier</label><input id="ps"><label>Job</label><input id="pj"><button class="primary" onclick="db.parts.push({id:crypto.randomUUID(),name:pn.value,cost:+pc.value,supplier:ps.value,job:pj.value});save();closeM();render()">Save</button>`)}
function invoiceForm(){openModal('New Invoice',`<label>Invoice number</label><input id="ivn" value="INV-${String(db.invoices.length+1).padStart(4,'0')}"><label>Customer</label><input id="ivc"><label>Date</label><input id="ivd" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Labour (£)</label><input id="ivl" type="number" step=".01"><label>Travel / call-out (£)</label><input id="ivt" type="number" step=".01"><label>Other (£)</label><input id="ivo" type="number" step=".01"><button class="primary" onclick="db.invoices.push({id:crypto.randomUUID(),number:ivn.value,customer:ivc.value,date:ivd.value,total:(+ivl.value||0)+(+ivt.value||0)+(+ivo.value||0),paid:false});save();closeM();render()">Save invoice</button>`)}
function paid(id){let x=db.invoices.find(y=>y.id===id);x.paid=!x.paid;save();render()}function del(t,id){if(confirm('Delete this item?')){db[t]=db[t].filter(x=>x.id!==id);save();render()}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='mechanic-mate-backup.json';a.click()}
function importData(e){let r=new FileReader;r.onload=()=>{try{db=JSON.parse(r.result);save();render();alert('Backup imported')}catch{alert('Invalid backup')}};r.readAsText(e.target.files[0])}function resetData(){if(confirm('Delete ALL data?')){db={jobs:[],customers:[],parts:[],invoices:[]};save();render()}}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error))}render();
</script></body></html>
